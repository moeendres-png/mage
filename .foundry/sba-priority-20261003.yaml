technical_decisions:
- 'Turn order was derived empirically, not assumed: XMage builds its player list in
  reverse insertion order and the cycle starts at the starting player, so turn order
  is A,B / A,C,B / A,D,C,B / A,E,D,C,B for 2/3/4/5 seats with the standard A,B,C,D,E
  insertion. Every scenario asserts the active player per turn at runtime via runCode,
  and asserts the real seat count.'
- Test instrumentation is observational only. A TestPlayer subclass records every
  engine-driven Player.priority(game) call with the recorded player game status at
  that moment. No win/loss or other outcome is injected, no priority loop is bypassed,
  and no shared harness file was modified. All eliminations come from a real life-payment
  cost (CR 118.3b) driving the life total to 0 plus the engine own 704.5a check.
- 'The non-active-player elimination case is a second manifestation of the same defect,
  not an expected-green control: it fails on the original GameImpl and passes after
  the repair. The only controls are the all-players-in-game case and the non-lethal
  life payment case, and both are green on original and repaired source.'
- Repair is one eligibility re-check in GameImpl.playPriority after the state-based
  action pass and before Player.priority(), leaving the innermost per-player loop
  so the existing player-list iteration hands the window to the next player in turn
  order (CR 800.4a, 800.4j). No new rules core, no adapter, no pom or card-data change,
  no card or deck data touched.
- 'Finding: at two seats the defect is unreachable, because the elimination makes
  checkIfGameIsOver() true inside the same state-based pass and the existing game-over
  return happens before Player.priority(). test_twoPlayers_departedPlayerGetsNoPriority
  is therefore green on original and repaired source and is retained as behaviour
  coverage only, not as fail-before evidence. This is why fail-before is 5 of 8 cases,
  not 6 of 8.'
- 'Finding: the engine already removes a departed player stack objects when it removes
  the player (CR 800.4a). Regression 3 asserts this precisely instead of only asserting
  a finally-empty stack: the departed player spell is observed pending on the stack
  in the departing player own priority window before the lethal payment, no stack
  object controlled or owned by the departed player remains, the departed player owns
  no battlefield object (CR 800.4b), and a surviving player different stack object
  really resolves with an observable power/toughness change.'
- 'Turn-order note for reviewers: a departing active player already lost the turn
  correctly before this repair (priority passes via state.getPlayerList().getNext()).
  The repair adds no turn-progression logic; the new tests assert 800.4j behaviour
  that the fix must not regress.'
- 'Build/validation environment: the launcher sandbox has a read-only /tmp, so protoc-jar-maven-plugin
  fails with "Read-only file system" unless Maven gets -Djava.io.tmpdir=$TMPDIR via
  MAVEN_OPTS. All runs used -pl Mage.Tests -am so engine classes come from this reactor
  rather than the shared 1.4.61 cache jar, with explicitly selected tests and Maven
  exit status reported outside any pipe.'
- 'Executor continuity: this session runs the Coordinator-authorized space-bunny MAX
  secondary profile recorded in executor_handoff_from/executor_handoff_reason; no
  silent executor switch occurred in this session.'
