technical_decisions:
- 'Attribution confirmed on exact head b0ebd84a52eb465fafced33db108ceeee16330ee (tree
  7fd283c453940fca986eaa6c4eada6b015f24952): the CI failure MonarchTest.test_MonarchByDies
  reproduced locally as "Player PlayerA must have 0 actions but found 1" at MonarchTest.java:120,
  1 test 1 failure 0 errors 0 skipped. No fixture edit was made before this reproduction.'
- 'Root cause is the fixture depending on the very defect the repair removed: the
  global waitStackResolved(turn, step) overload queues a wait command for every seated
  player, including the player the engine must no longer ask for priority after CR
  117.5 state-based actions eliminated them. Observation ownership moved to surviving
  players B/C/D via the existing per-player waitStackResolved(int, PhaseStep, TestPlayer)
  overload. Semantic assertions, denominators, assertLostTheGame(playerA), the monarch
  checks, the harness assertAllCommandsUsed and the GameImpl recheck are all unchanged;
  no card, pom, workflow, qualification or candidate pin touched.'
- 'The fixture gained an assertion rather than losing one: checkStackSize("lethal
  damage ability pending", 1, PRECOMBAT_MAIN, playerA, 1) observes the lethal damage
  ability pending on the stack while PlayerA still holds priority and is still in
  the game. All three MonarchTest methods are the ordinary fixture control and are
  green after the adaptation.'
- 'Complete Mage.Tests reactor run with no -Dtest selection, so no case is selected
  away: first run 6822 tests 1 failure 3 errors 125 skipped. All four non-passing
  cases were read-only-/tmp sandbox artifacts of the forked surefire JVM (LoadCheatsTest.testCommands,
  DatabaseCompatibleTest.test_AuthUsers, ZipFilesReadWriteTest.test_Read, ZipFilesReadWriteTest.test_write),
  none touching priority, elimination or the stack. MAVEN_OPTS only reaches the Maven
  launcher JVM, so the fork also needs JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR".'
- 'Final complete reactor run: tests 6822, failures 0, errors 0, skipped 125, aggregated
  from all 1973 surefire XML files. The 125 skips are pre-existing and spread over
  69 classes; they are recorded in the evidence manifest and are NOT claimed as coverage.'
- 'Honest unknown: local runs report 6822 tests where Coordinator CI reported 6821
  on the same head family. Cause not investigated and left UNKNOWN; the per-class
  XML manifest is the authoritative local breakdown.'
- Mage.Verify was SKIPPED on Coordinator CI run 37119753436 job 111193455619. It carries
  no FAIL/PASS result and none is claimed here.
- 'Executor continuity: this session continues the same workstream on the same owned
  branch under the Coordinator-authorized space-bunny MAX profile already recorded
  in executor_handoff_from/executor_handoff_reason; no silent executor switch and
  no new workstream.'
