name: WS33 ABC D4c target closure

on:
  push:
    branches: [work/ws33-d-high-throughput-20260907]
    paths:
      - .github/workflows/ws33-abc-d4c-target.yml
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_d4c_target_campaign.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_filter_abc_d4c_target_campaign.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_certify_abc_d4c.py
      - research/greenfield-qualification/actual-card-behavior/ws33/runtime-tests/Ws33D4cTargetCampaignTest.java
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  MODEL_ARTIFACT_ID: '9823383539'
  MODEL_ARTIFACT_DIGEST: sha256:aab73ba2ede151bbd0b803c2164d3067ddd65f17d49cf655c34eef67d903595d
  MANIFEST_SHA256: cd48f4279d682ab944e2534bf937d87e5311e83989e97179ae73c5c7d1bb6224
  CONSUMER_MODEL_SHA256: 82638e6b3e4408cc5bddedc49372b6357d3c2bdce6fba7bfab7ed119678f9a48
  TARGET_DIGEST: 1c16bf25383cb2f710513f3ac1c7b64dd9a48c53f8f481d9566a6dcdca9f00c6
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33

jobs:
  d4c-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact current WS33D source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify immutable authoritative model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/model generated/runtime generated/campaign/all generated/campaign/d4c generated/evidence
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$MODEL_ARTIFACT_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID/zip" > generated/model.zip
          test "sha256:$(sha256sum generated/model.zip | cut -d' ' -f1)" = "$MODEL_ARTIFACT_DIGEST"
          unzip -q generated/model.zip -d generated/model
          if test -d generated/model/output/ws33; then mv generated/model/output/ws33 generated/model/ws33; fi
          test "$(sha256sum generated/model/ws33/WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          echo WS33_ABC_D4C_MODEL_ARTIFACT=PASS

      - name: Verify exact D4 queue and ledger binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('research/greenfield-qualification/actual-card-behavior/ws33')
          queue=json.loads((root/'WS33_INTEGRATED_WORK_QUEUE.json').read_text())
          rows=[x for x in queue['items'] if x.get('logical_bucket')=='WS33D' and x.get('scenario_group_id')=='ws33-g2-template-049' and x.get('evidence_profile')=='STATE_ONLY' and x.get('runtime_subsystem')=='forge.game.ability.effects.EffectEffect']
          assert len(rows)==1
          ids=rows[0]['effective_path_ids']
          assert rows[0]['unresolved_path_count']==49 and len(ids)==49 and len(set(ids))==49
          ledger=[json.loads(l) for l in (root/'WS33_INTEGRATED_CLOSURE_LEDGER.jsonl').read_text().splitlines() if l.strip()]
          assert len(ledger)==4188
          sel=sorted(r['effective_path_id'] for r in ledger if r['logical_bucket']=='WS33D' and r['scenario_group_id']=='ws33-g2-template-049' and r['current_status']=='UNKNOWN')
          assert len(sel)==49 and set(sel)==set(ids)
          assert 'forge-behavior-v2:ede58d662fddba65852ba12b8bb699c33eb8e708' not in sel
          print('WS33_ABC_D4C_QUEUE_BINDING=PASS paths=49')
          PY

      - name: Checkout exact pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1

      - name: Checkout retained Decision prerequisite
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: ${{ env.WS01_HEAD }}
          path: ws01
          fetch-depth: 1

      - name: Checkout retained failure-semantics prerequisite
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: ${{ env.WS12_HEAD }}
          path: ws12
          fetch-depth: 1

      - name: Checkout retained WS32 production binding
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: ${{ env.WS32_HEAD }}
          path: ws32
          fetch-depth: 1

      - name: Verify exact runtime pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          echo WS33_ABC_D4C_RUNTIME_PINS=PASS

      - name: Materialize authoritative runtime overlays
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/runtime/ws01-overlay.log
          python research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/runtime/ws05-overlay.log
          python research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/runtime/RNG_INVENTORY.json | tee generated/runtime/ws06-overlay.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/runtime/ws33-input-confirm-overlay.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/runtime/ws33-stack-target-overlay.log
          cp research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/runtime/ws33-target-selection-overlay.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/runtime/ws12-overlay.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/runtime/ws32-overlay.log

      - name: Materialize exact ABC-D4c case set
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_prepare_d4c_target_campaign.py" --ledger "$ROOT/WS33_INTEGRATED_CLOSURE_LEDGER.jsonl" --queue "$ROOT/WS33_INTEGRATED_WORK_QUEUE.json" --partition "$ROOT/WS33D_PARTITION.json" --forge-root forge --out-tsv generated/campaign/all/d4c-cases.tsv --out-plan generated/campaign/all/D4C_PLAN.json --out-deferred generated/campaign/all/D4C_DEFERRED.json
          python "$ROOT/ws33_filter_abc_d4c_target_campaign.py" --queue "$ROOT/WS33_INTEGRATED_WORK_QUEUE.json" --ledger "$ROOT/WS33_INTEGRATED_CLOSURE_LEDGER.jsonl" --partition "$ROOT/WS33D_PARTITION.json" --input-tsv generated/campaign/all/d4c-cases.tsv --input-plan generated/campaign/all/D4C_PLAN.json --input-deferred generated/campaign/all/D4C_DEFERRED.json --target-digest "$TARGET_DIGEST" --out-tsv generated/campaign/d4c/d4c-cases.tsv --out-plan generated/campaign/d4c/ABC_D4C_PLAN.json
          cp generated/campaign/all/D4C_DEFERRED.json generated/campaign/d4c/ABC_D4C_DEFERRED.json
          test "$(grep -vc '^#' generated/campaign/d4c/d4c-cases.tsv)" = 4
          echo WS33_ABC_D4C_MATERIALIZATION=PASS paths=4

      - name: Install current qualification test
        shell: bash
        run: |
          set -euo pipefail
          cp "$ROOT/runtime-tests/Ws33D4cTargetCampaignTest.java" forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/

      - name: Execute ABC-D4c Record
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.gamesimulationtests.Ws33D4cTargetCampaignTest -Dsurefire.failIfNoSpecifiedTests=false -Dws33.d4cMode=record -Dws33.d4cCases="$GITHUB_WORKSPACE/generated/campaign/d4c/d4c-cases.tsv" -Dws33.d4cOut="$GITHUB_WORKSPACE/generated/campaign/d4c" test) 2>&1 | tee generated/runtime/d4c-record-runtime.log
          test ! -s generated/campaign/d4c/target-record-diagnostics.jsonl
          test "$(find generated/campaign/d4c/records -name record-success.marker -type f | wc -l)" = 4
          echo WS33_ABC_D4C_RECORD=PASS paths=4

      - name: Execute ABC-D4c tape-driven Replay
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.gamesimulationtests.Ws33D4cTargetCampaignTest -Dsurefire.failIfNoSpecifiedTests=false -Dws33.d4cMode=replay -Dws33.d4cCases="$GITHUB_WORKSPACE/generated/campaign/d4c/d4c-cases.tsv" -Dws33.d4cOut="$GITHUB_WORKSPACE/generated/campaign/d4c" test) 2>&1 | tee generated/runtime/d4c-replay-runtime.log
          test ! -s generated/campaign/d4c/target-replay-diagnostics.jsonl
          test "$(jq '.records|length' generated/campaign/d4c/campaign-index.json)" = 4
          echo WS33_ABC_D4C_REPLAY=PASS paths=4

      - name: Certify exact per-path evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$SOURCE_TREE"
          python "$ROOT/ws33_certify_abc_d4c.py" --campaign-root generated/campaign/d4c --plan generated/campaign/d4c/ABC_D4C_PLAN.json --deferred generated/campaign/d4c/ABC_D4C_DEFERRED.json --out generated/evidence/ABC_D4C_GATE.json --source-head "$GITHUB_SHA" --source-tree "$SOURCE_TREE" --forge-pin "$FORGE_PIN" --model-artifact-id "$MODEL_ARTIFACT_ID" --model-artifact-digest "$MODEL_ARTIFACT_DIGEST" --manifest-sha256 "$MANIFEST_SHA256" --consumer-model-sha256 "$CONSUMER_MODEL_SHA256"
          cp generated/campaign/d4c/ABC_D4C_PLAN.json generated/evidence/
          cp generated/campaign/d4c/ABC_D4C_DEFERRED.json generated/evidence/
          cp generated/campaign/d4c/target-record-diagnostics.jsonl generated/evidence/
          cp generated/campaign/d4c/target-replay-diagnostics.jsonl generated/evidence/
          cp generated/campaign/d4c/campaign-index.json generated/evidence/
          cp -R generated/campaign/d4c/records generated/evidence/
          cp generated/runtime/d4c-record-runtime.log generated/evidence/
          cp generated/runtime/d4c-replay-runtime.log generated/evidence/
          cd generated/evidence
          find . -type f ! -name ABC_D4C_HASHES.sha256 -print0 | sort -z | xargs -0 sha256sum > ABC_D4C_HASHES.sha256
          sha256sum -c ABC_D4C_HASHES.sha256

      - name: Upload immutable ABC-D4c run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-abc-d4c-target-${{ github.run_id }}
          path: generated
          if-no-files-found: error
          retention-days: 90
