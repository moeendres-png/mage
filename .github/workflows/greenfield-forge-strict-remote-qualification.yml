name: Greenfield Forge strict typed Decision Export qualification

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/greenfield-engine-shootout-20260827
    paths:
      - '.github/workflows/greenfield-forge-strict-remote-qualification.yml'
      - 'research/greenfield-qualification/forge-patches/**'
      - 'research/greenfield-qualification/forge_decision_contract_smoke.py'
      - 'research/greenfield-qualification/strict_decision.py'
      - 'research/greenfield-qualification/test_strict_decision.py'
      - 'research/greenfield-qualification/schemas/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact qualification revision
        uses: actions/checkout@v4
        with:
          path: qual
          fetch-depth: 1

      - name: Materialize qualification provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qual rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "source_head=$(git -C qual rev-parse HEAD)"
            echo "source_tree=$(git -C qual rev-parse 'HEAD^{tree}')"
          } | tee provenance.env
          mkdir -p evidence
          cp provenance.env evidence/provenance.env

      - name: Checkout the exact Forge research pin
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 8c7e9afb8e6caee88644b94e25da5852e36f8928
          path: forge
          fetch-depth: 1

      - name: Apply the strict server-side Decision Export patch
        shell: bash
        run: |
          set -euo pipefail
          bash qual/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh \
            forge qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee evidence/patch-apply.log

      - name: Execute engine-neutral negative Decision contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/qual/research/greenfield-qualification" \
            python3 -m unittest discover -s qual/research/greenfield-qualification -p 'test_strict_decision.py' -v \
            | tee evidence/strict-decision-python-tests.log

      - name: Run exact-pin implementation and complete-census smoke test
        shell: bash
        run: |
          set -euo pipefail
          source provenance.env
          PYTHONPATH="$GITHUB_WORKSPACE/qual/research/greenfield-qualification" python3 \
            qual/research/greenfield-qualification/forge_decision_contract_smoke.py \
            --forge-root forge \
            --patch qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch \
            --source-head "$source_head" \
            --source-tree "$source_tree" \
            --out evidence/DECISION_EXPORT_IMPLEMENTATION.json

      - name: Compile the patched exact Forge checkout
        shell: bash
        working-directory: forge
        run: |
          set -euo pipefail
          mvn -B '-DskipTests' -pl forge-gui -am compile \
            | tee ../evidence/forge-compile.log

      - name: Compile and run the Java decision validator contract probe
        shell: bash
        working-directory: forge
        run: |
          set -euo pipefail
          mvn -B '-DskipTests' -pl forge-gui -am test-compile \
            | tee ../evidence/forge-test-compile.log
          java -cp 'forge-gui/target/test-classes:forge-gui/target/classes:forge-game/target/classes:forge-core/target/classes:forge-ai/target/classes' \
            forge.gamemodes.match.input.ExternalDecisionValidatorContractTest \
            | tee ../evidence/java-decision-contract.log
          grep -Fx 'JAVA_EXTERNAL_DECISION_CONTRACT=PASS' ../evidence/java-decision-contract.log

      - name: Adjudicate the strict boundary fail-closed
        shell: bash
        run: |
          set -euo pipefail
          source provenance.env
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          implementation = json.loads(Path('evidence/DECISION_EXPORT_IMPLEMENTATION.json').read_text())
          forge = Path('forge')
          patch = Path('qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch')
          source_head = Path('provenance.env').read_text().split('source_head=', 1)[1].splitlines()[0]
          source_tree = Path('provenance.env').read_text().split('source_tree=', 1)[1].splitlines()[0]
          java_contract_log = Path('evidence/java-decision-contract.log').read_text()
          java_validator_contract = 'JAVA_EXTERNAL_DECISION_CONTRACT=PASS' in java_contract_log
          exact_entity_boundary = implementation['status'] == 'PARTIAL' and all(implementation['assertions'].values())
          remaining = implementation['census']['remaining_controller_methods_not_externalized']
          gate = {
            'schema': 'commander-simulator-next.forge-strict-boundary-gate.v4',
            'source_head': source_head,
            'source_tree': source_tree,
            'forge_pin': implementation['forge_pin'],
            'forge_tree': implementation['forge_tree'],
            'patch_sha256': hashlib.sha256(patch.read_bytes()).hexdigest(),
            'status': 'FAIL',
            'strict_entity_selection_boundary': 'PASS' if exact_entity_boundary else 'FAIL',
            'java_runtime_validator_contract': 'PASS' if java_validator_contract else 'FAIL',
            'full_decision_externalization': 'FAIL',
            'full_decision_census': {
              'controller_callbacks': implementation['census']['player_controller_abstract_method_count'],
              'blocking_gui_decisions': implementation['census']['remote_protocol_blocking_decision_count'],
              'directly_externalized_controller_methods': implementation['census']['directly_externalized_controller_methods'],
              'remaining_controller_methods_not_externalized': remaining,
              'complete': False,
            },
            'hard_gate_values': {
              'EXACT_LEGAL_ENTITY_CHOICES_EXPORTED': exact_entity_boundary,
              'PLAYER_OPTIONS_INCLUDED': exact_entity_boundary,
              'TYPED_REQUEST_RESPONSE': exact_entity_boundary,
              'STALE_RESPONSE_REJECTED': exact_entity_boundary,
              'TIMEOUT_REJECTED': exact_entity_boundary,
              'ONE_SHOT_CONSUMPTION': exact_entity_boundary,
              'JAVA_RUNTIME_VALIDATOR_CONTRACT': java_validator_contract,
              'PRODUCTION_REACHABLE_UNQUALIFIED_CALLBACKS': remaining,
              'SILENT_FALLBACKS_ZERO': False,
              'RUNTIME_DECISION_TAPE_QUALIFIED': False,
            },
            'evidence_class': ['DIRECTLY_VERIFIED', 'CODE_DERIVED', 'CI_EXECUTED'],
            'failure': {
              'code': 'FULL_DECISION_CENSUS_NOT_EXTERNALIZED',
              'message': 'The patch proves, compiles, and executes a server-side validator contract for the typed seam, but the remaining controller callbacks and blocking GUI decisions are not admitted to the strict production path.',
            },
          }
          Path('evidence/STRICT_EXTERNAL_PILOT_BOUNDARY_GATE.json').write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')
          Path('evidence/STRICT_EXTERNAL_PILOT_BOUNDARY_GATE.md').write_text(
              "\n".join([
                  "# Forge strict typed Decision Export gate",
                  "",
                  f"- Qualification source head: `{source_head}`",
                  f"- Qualification source tree: `{source_tree}`",
                  f"- Forge pin: `{implementation['forge_pin']}`",
                  f"- Patch SHA-256: `{gate['patch_sha256']}`",
                  f"- Strict entity-selection seam: **{gate['strict_entity_selection_boundary']}**",
                  f"- Java runtime validator contract: **{gate['java_runtime_validator_contract']}**",
                  "- Full production gate: **FAIL**",
                  "",
                  "The exact `InputSelectEntitiesFromList` option set, including `Player`",
                  "entities, is now exported to a typed provider in the ephemeral Forge checkout.",
                  "Responses are checked against token, decision id, actor, principal, schema,",
                  "membership, count, cancel permission, one-shot state, and timeout state. The",
                  "patch compiles at the declared Forge pin. A dependency-free Java contract probe",
                  "also executes the server-side validator's accepted, stale, actor/principal,",
                  "malformed, missing, unknown-path, illegal-option, count, cancel, one-shot,",
                  "and timeout cases. It is a validator-contract result, not a gameplay tape.",
                  "",
                  "This does not close the production gate: only three entity-selection entry",
                  "points are directly routed. The census contains "
                  f"{implementation['census']['player_controller_abstract_method_count']} controller callback declarations and "
                  f"{implementation['census']['remote_protocol_blocking_decision_count']} blocking GUI decisions; "
                  f"{remaining} controller declarations remain outside the typed boundary. Legacy GUI/AI paths "
                  "therefore remain unqualified and the complete decision/RNG/hidden-information runtime tapes have not been produced.",
              ]) + "\n"
          )
          assert gate['status'] == 'FAIL'
          assert gate['strict_entity_selection_boundary'] == 'PASS'
          assert gate['java_runtime_validator_contract'] == 'PASS'
          assert gate['full_decision_externalization'] == 'FAIL'
          PY

      - name: Hash current qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence/hashes.sha256 || true

      - name: Upload current qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-forge-strict-typed-decision-boundary
          path: evidence
          if-no-files-found: error
