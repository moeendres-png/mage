name: F22 F23 parent baseline verify

on:
  push:
    branches:
      - ci/xmage-f22-f23-baseline-verify-20260929
  workflow_dispatch:

jobs:
  mage-verify-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run baseline Mage Verify
        run: >
          mvn -B -ntp -pl Mage.Verify -am test
          -Dxmage.dataCollectors.printGameLogs=false
          -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties
