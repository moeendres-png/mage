name: WS33 ABC A-rest SVar NonTrigger9 runtime

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-abc-a-rest-svar-nontrigger9-runtime.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adapt_g_svar_af_harness_to_a_nontrigger9.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_ability_harness.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_svar_af_harness.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_strengthen_g_svar_af_hidden_witness.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_instrument_g_principal_observations.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-input-confirm.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-observation-fanout.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-external-card-decision-lifetime.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-stack-target.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-target-selection.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-svar-reachability.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  CASE_ARTIFACT_ID: '9996808331'
  CASE_ARTIFACT_DIGEST: sha256:ea34615a1ee8735b9f97fd1ee3e6e9ff2fa925569792339a90b15fd4f03e99ec
  CASE_SOURCE_HEAD: 6dc8a3fb37f91026fb8b75a9614d528f4b88996d
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  nontrigger9:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout frozen qualification source
        uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Consume exact immutable A SVar26 case artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/cases generated/record generated/replay generated/diagnostic generated/overlay-logs
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CASE_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$CASE_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$CASE_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$CASE_ARTIFACT_ID/zip" > generated/cases.zip
          test "sha256:$(sha256sum generated/cases.zip | cut -d' ' -f1)" = "$CASE_ARTIFACT_DIGEST"
          unzip -q generated/cases.zip -d generated/cases
          jq -e '.status=="PASS" and .svar_paths==26 and .nontrigger_paths==9 and .trigger_paths==17 and .consumer_inference_performed==false and .coverage_mutated==false and .coverage_promotion==false' generated/cases/out/A_REST_SVAR_CASE_GATE.json
          python - <<'PY'
          from pathlib import Path
          rows=[x.split('\t') for x in Path('generated/cases/out/a-rest-svar-nontrigger9.tsv').read_text().splitlines() if x]
          assert len(rows)==9 and len({x[1] for x in rows})==9 and all(len(x)==19 for x in rows)
          assert all(x[10]=='1' and x[11]=='0' and x[12]=='1' and x[13]=='1' for x in rows)
          print('WS33_A_SVAR_NONTRIGGER9_CASES=PASS paths=9 hidden=9 rng=0 replay=9 decision=9')
          PY
          printf '%s\n' "$GITHUB_SHA" > generated/diagnostic/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/diagnostic/workflow-source-tree.txt

      - name: Checkout pinned runtime dependencies
        uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Apply exact Rules/Decision/Observation runtime stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-observation-fanout.py" --forge-root forge | tee generated/overlay-logs/ws33-observation-fanout.log
          python "$ROOT/runtime-overlays/apply-ws33-external-card-decision-lifetime.py" --forge-root forge | tee generated/overlay-logs/ws33-card-decision-lifetime.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python "$ROOT/runtime-overlays/apply-ws33-svar-reachability.py" --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log

      - name: Prepare exact NonTrigger9 production-parent harness
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33ARestSVarNonTriggerQualificationTest.java
          python "$ROOT/ws33_prepare_g_ability_harness.py" --source "$src" --out "$dst"
          python "$ROOT/ws33_prepare_g_svar_af_harness.py" --harness "$dst"
          python "$ROOT/ws33_adapt_g_svar_af_harness_to_a_nontrigger9.py" --harness "$dst" | tee generated/diagnostic/a-adapter.log
          python "$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py" --harness "$dst" | tee generated/diagnostic/hidden-witness.log
          python "$ROOT/ws33_instrument_g_principal_observations.py" --harness "$dst" | tee generated/diagnostic/observation-instrument.log
          grep -Fx 'WS33_A_SVAR_NONTRIGGER9_ADAPTER=PASS paths=9 mechanism=G3_AF_PRODUCTION_PARENT' generated/diagnostic/a-adapter.log
          grep -Fx 'WS33_A_SVAR_NONTRIGGER9_RULES_MUTATION=0 target_svar_direct_entry=FALSE' generated/diagnostic/a-adapter.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_CARD_NAME_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_PATH_ID_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -F 'WS33_G_PRINCIPAL_OBSERVATION_ATTRIBUTION=G_SVAR_AF' generated/diagnostic/observation-instrument.log
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          ! grep -F 'AbilityFactory.getAbility(spec.script,source)' "$dst"
          grep -F 'CharmEffect.makeChoices(sa)' "$dst"
          grep -F 'desired.equals(o.getSemanticValue())' "$dst"
          grep -F 'AbilitySub.setWs33ResolutionObserver' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256

      - name: Fresh NonTrigger9 Record
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33ARestSVarNonTriggerQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/cases/out/a-rest-svar-nontrigger9.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -f generated/record/PRINCIPAL_OBSERVATIONS.jsonl

      - name: Fresh tape-driven NonTrigger9 Replay
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33ARestSVarNonTriggerQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/cases/out/a-rest-svar-nontrigger9.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/case-summary.tsv
          test -f generated/replay/PRINCIPAL_OBSERVATIONS.jsonl

      - name: Fail-closed NonTrigger9 adjudication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          root=Path('generated'); cases=[x.split('\t') for x in (root/'cases/out/a-rest-svar-nontrigger9.tsv').read_text().splitlines() if x]
          ids={x[1] for x in cases}; failures=[]
          def rows(p): return {x.split('\t')[0]:x.split('\t') for x in p.read_text().splitlines() if x}
          rec=rows(root/'record/case-summary.tsv'); rep=rows(root/'replay/case-summary.tsv')
          if len(ids)!=9 or set(rec)!=ids or set(rep)!=ids: failures.append('path_set_mismatch')
          for c in cases:
            pid=c[1]; a=rec.get(pid); b=rep.get(pid)
            if a is None or b is None: continue
            for label,r in [('record',a),('replay',b)]:
              if len(r)<21: failures.append(pid+':'+label+':summary_schema'); continue
              if r[4]!='PASS': failures.append(pid+':'+label+':status='+r[4])
              if int(r[7])<=0: failures.append(pid+':'+label+':missing_decision')
              if int(r[9])!=0 or int(r[10])!=0: failures.append(pid+':'+label+':hidden_leak')
              if int(r[18])!=1 or int(r[19])!=1 or int(r[20])<1: failures.append(pid+':'+label+':parent_target_reachability')
              if r[14] or r[15]: failures.append(pid+':'+label+':runtime_failure')
            if len(a)>=21 and len(b)>=21 and (a[5]!=b[5] or a[6]!=b[6]): failures.append(pid+':semantic_digest_mismatch')
          # Accepted decisions must be attributable to every exact path in both fresh processes.
          for label in ('record','replay'):
            p=root/label/'decision-events-with-path.tsv'; seen=set()
            if not p.is_file(): failures.append(label+':decision_path_tape_missing')
            else:
              for line in p.read_text().splitlines():
                if not line: continue
                f=line.split('\t');
                if f and f[0] in ids: seen.add(f[0])
              if seen!=ids: failures.append(label+':decision_path_coverage')
          # Principal observation trace: allow zero positive events, but any actual hidden grant must
          # be principal-scoped, identity-matched, strictly revoked, and replay-semantically equal.
          def load(p): return [json.loads(x) for x in p.read_text().splitlines() if x.strip()] if p.is_file() else []
          def check(label,ev):
            streams=defaultdict(list); kinds=Counter()
            for e in ev:
              pid=e.get('path_id')
              if pid not in ids: failures.append(label+':unknown_observation_path='+str(pid)); continue
              if e.get('identity_match') is not True: failures.append(label+':identity_mismatch='+pid)
              kind=e.get('kind'); kinds[kind]+=1
              if kind in {'SERVER_GRANT','SERVER_REVOKE'}:
                reason=str(e.get('decision_kind',''))
                if not reason or reason.startswith('delta:'): failures.append(label+':invalid_server_reason='+pid)
              elif kind in {'CLIENT_VISIBLE','CLIENT_HIDDEN'}:
                d=str(e.get('decision_kind',''))
                if d and not d.startswith('delta:'): failures.append(label+':invalid_client_delta='+pid)
              if kind in {'SERVER_GRANT','CLIENT_VISIBLE','SERVER_REVOKE','CLIENT_HIDDEN'}:
                streams[(pid,int(e['principal_id']),int(e['card_id']))].append(e)
            for key,stream in streams.items():
              state='HIDDEN'
              for e in sorted(stream,key=lambda x:int(x.get('sequence',-1))):
                exp={'HIDDEN':'SERVER_GRANT','GRANTED':'CLIENT_VISIBLE','VISIBLE':'SERVER_REVOKE','REVOKED':'CLIENT_HIDDEN'}[state]
                if e.get('kind')!=exp: failures.append(label+':lifecycle:'+repr(key)); break
                state={'HIDDEN':'GRANTED','GRANTED':'VISIBLE','VISIBLE':'REVOKED','REVOKED':'HIDDEN'}[state]
              if state!='HIDDEN': failures.append(label+':incomplete_lifecycle:'+repr(key))
            return kinds
          re=load(root/'record/PRINCIPAL_OBSERVATIONS.jsonl'); pe=load(root/'replay/PRINCIPAL_OBSERVATIONS.jsonl'); rk=check('record',re); pk=check('replay',pe)
          def norm(ev):
            return Counter((e.get('path_id'),e.get('kind'),int(e.get('principal_id',-1)),int(e.get('card_id',-1)),e.get('decision_kind','') if e.get('kind') in {'SERVER_GRANT','SERVER_REVOKE'} else '',bool(e.get('identity_match'))) for e in ev)
          if norm(re)!=norm(pe): failures.append('observation_semantic_multiset_mismatch')
          out={'schema':'commander-simulator-next.ws33-a-rest-svar-nontrigger9.v1','status':'PASS' if not failures else 'FAIL_CLOSED','path_count':9,'hidden_required':9,'decision_required':9,'rng_required':0,'replay_required':9,'actual_card_parent_bound':True,'target_svar_direct_entry':False,'mode_selection_authoritative_membership':True,'target_restrictions_authoritative':True,'stack_authoritative':True,'semantic_replay_equal':not any('semantic' in x for x in failures),'record_observation_events':len(re),'replay_observation_events':len(pe),'record_observation_kinds':dict(rk),'replay_observation_kinds':dict(pk),'unauthorized_hidden_leaks':0,'cross_principal_leaks':0,'failure_count':len(failures),'failures':failures,'coverage_mutated':False,'coverage_promotion':False}
          (root/'diagnostic/A_REST_SVAR_NONTRIGGER9_GATE.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          if failures: raise SystemExit('WS33_A_SVAR_NONTRIGGER9=FAIL '+repr(failures[:30]))
          print('WS33_A_SVAR_NONTRIGGER9=PASS')
          PY
          cmp generated/record/decision-tape.tsv generated/replay/decision-tape.tsv
          cmp generated/record/decision-events-with-path.tsv generated/replay/decision-events-with-path.tsv
          cmp generated/record/rng-tape.tsv generated/replay/rng-tape.tsv
          cmp generated/record/rng-events-with-path.tsv generated/replay/rng-events-with-path.tsv
          cat > generated/diagnostic/SOURCE_CHAIN.json <<EOF
          {"schema":"commander-simulator-next.ws33-a-rest-svar-nontrigger9-source-chain.v1","workflow_source_head":"$GITHUB_SHA","workflow_source_tree":"$(git rev-parse 'HEAD^{tree}')","case_artifact_id":$CASE_ARTIFACT_ID,"case_artifact_digest":"$CASE_ARTIFACT_DIGEST","forge_pin":"$FORGE_PIN","coverage_mutated":false,"coverage_promotion":false}
          EOF
          find generated -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > generated/SHA256SUMS

      - name: Upload immutable NonTrigger9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-abc-a-rest-svar-nontrigger9-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 90
