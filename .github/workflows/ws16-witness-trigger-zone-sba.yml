name: WS16 recover trigger replacement zone SBA witness shard

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  WS14_HEAD: d8c1ee0c08c7e7f0bc2bc86c70166ebc198e30d5
  WS14_TREE: 5725f47951938bc71af181cf1617e6b3be158804
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  MANIFEST_SHA256: 1137335dd7101df44940a2b0c8cacc5740e2aef0a24eceb541449dd10a5e6f7b
  TESTED_SOURCE_HEAD: b6927c63f2dfcbc45b6357351be2828917db1a2c
  TESTED_SOURCE_TREE: 17c90ee714d5b2512df1c1fe2872b7c236fe0078
  EXECUTION_RUN_ID: '33270636779'
  EXECUTION_JOB_ID: '99148367194'
  EXECUTION_ARTIFACT_ID: '9720024348'
  EXECUTION_ARTIFACT_DIGEST: sha256:9d231f95ca45b84f170a3b7eb370a7f4aef821f7a06807840f0cb95ad41e0fd7

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested WS16 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SOURCE_HEAD }}
          path: qual
          fetch-depth: 0

      - name: Verify tested source, WS14 base and immutable primitive ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qual rev-parse HEAD)" = "$TESTED_SOURCE_HEAD"
          test "$(git -C qual rev-parse 'HEAD^{tree}')" = "$TESTED_SOURCE_TREE"
          git -C qual merge-base --is-ancestor "$WS14_HEAD" "$TESTED_SOURCE_HEAD"
          test "$(git -C qual rev-parse "$WS14_HEAD^{tree}")" = "$WS14_TREE"
          echo "$MANIFEST_SHA256  qual/research/greenfield-qualification/actual-card-behavior/WS14_PRIMITIVE_MANIFEST.json" | sha256sum -c -
          test "$(jq '[.primitives[] | select(.owner_family == "TRIGGER_REPLACEMENT_ZONE_SBA")] | length' qual/research/greenfield-qualification/actual-card-behavior/WS14_PRIMITIVE_MANIFEST.json)" = 53
          test ! -e qual/research/greenfield-qualification/actual-card-behavior/WS14_WITNESS_REGISTRY.json

      - name: Recover immutable successful Forge execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws16-execution
          gh run download "$EXECUTION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ws16-pinned-forge-execution \
            --dir artifacts/ws16-execution
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXECUTION_RUN_ID/artifacts")"
          test "$(jq -r '.artifacts[] | select(.name == "ws16-pinned-forge-execution") | .id' <<<"$metadata")" = "$EXECUTION_ARTIFACT_ID"
          test "$(jq -r '.artifacts[] | select(.name == "ws16-pinned-forge-execution") | .digest' <<<"$metadata")" = "$EXECUTION_ARTIFACT_DIGEST"
          job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXECUTION_RUN_ID/jobs" --paginate | jq -c '.jobs[] | select(.id == 99148367194)')"
          test "$(jq -r '.conclusion' <<<"$job")" = success
          test "$(jq -r '[.steps[] | select(.name == "Execute pinned Forge state witness only")][0].conclusion' <<<"$job")" = success
          test "$(jq -r '[.steps[] | select(.name == "Upload immutable Forge execution evidence")][0].conclusion' <<<"$job")" = success
          test "$(cat artifacts/ws16-execution/forge_head.txt)" = "$FORGE_PIN"
          (cd artifacts/ws16-execution && sha256sum -c EXECUTION_HASHES.sha256)

      - name: Materialize and ABI-validate WS16 witness shard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.23.0'
          mkdir -p artifacts/ws16
          python3 qual/research/greenfield-qualification/actual-card-behavior/witness-shards/trigger-replacement-zone-sba/ws16_materialize.py \
            --manifest qual/research/greenfield-qualification/actual-card-behavior/WS14_PRIMITIVE_MANIFEST.json \
            --report artifacts/ws16-execution/testng-report.xml \
            --source-head "$TESTED_SOURCE_HEAD" \
            --source-tree "$TESTED_SOURCE_TREE" \
            --run-id "$EXECUTION_RUN_ID" \
            --job-id "$EXECUTION_JOB_ID" \
            --artifact-id "$EXECUTION_ARTIFACT_ID" \
            --artifact-digest "$EXECUTION_ARTIFACT_DIGEST" \
            --out artifacts/ws16
          python3 qual/research/greenfield-qualification/actual-card-behavior/ws14/ws14_validate_witness.py \
            --schema qual/research/greenfield-qualification/actual-card-behavior/WS14_WITNESS_ABI.schema.json \
            --witness artifacts/ws16/ws16-jwar-isle-refuge.witness.json
          jq -e '.primitive_count == 53 and .pass_count == 2 and .partial_count == 51 and .unknown_count == 0 and .unsupported_count == 0 and .q6_actual_card_behavior == "NOT_ADJUDICATED"' artifacts/ws16/WS16_PRIMITIVE_COVERAGE.json >/dev/null
          jq -e '[.rows[].primitive_id] | length == 53 and unique | length == 53' artifacts/ws16/WS16_PRIMITIVE_COVERAGE.json >/dev/null
          sha256sum artifacts/ws16/ws16-jwar-isle-refuge.trace.json artifacts/ws16/ws16-jwar-isle-refuge.witness.json artifacts/ws16/WS16_PRIMITIVE_COVERAGE.json > artifacts/ws16/WS16_HASHES.sha256

      - name: Upload recovered WS16 witness shard
        uses: actions/upload-artifact@v4
        with:
          name: ws16-trigger-replacement-zone-sba-witness-shard
          path: |
            artifacts/ws16
            artifacts/ws16-execution/EXECUTION_HASHES.sha256
          if-no-files-found: error
          retention-days: 90
