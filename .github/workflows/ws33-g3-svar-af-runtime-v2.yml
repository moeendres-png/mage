name: WS33 G3 SVar AF runtime v2 hidden witness

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-g3-svar-af-runtime-v2.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_strengthen_g_svar_af_hidden_witness.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  DIRECT_RUNTIME_SOURCE_TREE: 857dc01e04f58ca59437e08710bcb194bf030ea4
  AF_BASE_SOURCE_HEAD: 28f4e7cdd6a35c488d4633cf8d77163a8aa2d5d9
  AF_BASE_SOURCE_TREE: fa5cb7385b2724433cf877b11e890985adef2376
  OLD_BEHAVIOR_ARTIFACT_ID: '9889684290'
  OLD_BEHAVIOR_ARTIFACT_DIGEST: sha256:7a9b8a4e8dd993d419d55fa31763ef8d49ffc3927408bfdb4488724dd16d68e9
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  af-runtime-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout strengthened witness source
        uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Consume exact existing AF case identities
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/source generated/record generated/diagnostic generated/overlay-logs
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$OLD_BEHAVIOR_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$OLD_BEHAVIOR_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$AF_BASE_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$OLD_BEHAVIOR_ARTIFACT_ID/zip" > generated/old-behavior.zip
          test "sha256:$(sha256sum generated/old-behavior.zip | cut -d' ' -f1)" = "$OLD_BEHAVIOR_ARTIFACT_DIGEST"
          unzip -q generated/old-behavior.zip -d generated/source
          test -s generated/source/g-svar-af-cases.tsv
          python - <<'PY'
          import base64
          from pathlib import Path
          rows=[x.split('\t') for x in Path('generated/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          assert len(rows)==21 and all(len(x)==19 for x in rows)
          scry=[x for x in rows if x[17]=='Scry' and 'ScryNum$ X' in base64.b64decode(x[18]).decode()]
          assert len(scry)==1, len(scry)
          print('WS33_G_SVAR_AF_V2_CASES=PASS paths=21 source_scry_x=1')
          PY

      - name: Checkout immutable sources
        uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.AF_BASE_SOURCE_HEAD }}', path: af-base, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C direct-source rev-parse HEAD)" = "$DIRECT_RUNTIME_SOURCE_HEAD"
          test "$(git -C direct-source rev-parse 'HEAD^{tree}')" = "$DIRECT_RUNTIME_SOURCE_TREE"
          test "$(git -C af-base rev-parse HEAD)" = "$AF_BASE_SOURCE_HEAD"
          test "$(git -C af-base rev-parse 'HEAD^{tree}')" = "$AF_BASE_SOURCE_TREE"
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"
          printf '%s\n' "$GITHUB_SHA" > generated/diagnostic/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/diagnostic/workflow-source-tree.txt

      - name: Apply exact green AF runtime stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python direct-source/$ROOT/runtime-overlays/apply-ws33-input-confirm.py --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python direct-source/$ROOT/runtime-overlays/apply-ws33-stack-target.py --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python af-base/$ROOT/runtime-overlays/apply-ws33-target-selection.py --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python af-base/$ROOT/runtime-overlays/apply-ws33-svar-reachability.py --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log

      - name: Prepare strengthened source-parent harness
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GSVarAfQualificationTest.java
          python direct-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$dst"
          python af-base/$ROOT/ws33_prepare_g_svar_af_harness.py --harness "$dst"
          python "$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py" --harness "$dst" | tee generated/diagnostic/hidden-witness.log
          python af-base/$ROOT/ws33_instrument_g_authoritative_requests.py --harness "$dst"
          grep -F 'WS33_G_SVAR_AF_HIDDEN_WITNESS=PASS' generated/diagnostic/hidden-witness.log
          grep -F 'prepareSourceDependentPositiveWitness(spec,sa,source,actor)' "$dst"
          ! grep -F 'Alibou' "$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py"
          ! grep -F 'a817142' "$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py"
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Execute strengthened 21-path AF record
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/source/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          python - <<'PY'
          import base64
          from pathlib import Path
          cases=[x.split('\t') for x in Path('generated/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          rows={x.split('\t')[0]:x.split('\t') for x in Path('generated/record/case-summary.tsv').read_text().splitlines() if x}
          assert len(rows)==21
          bad=[(p,r[4],r[14],r[15],r[18:21]) for p,r in rows.items() if len(r)<21 or r[4]!='PASS' or r[18]!='1' or r[19]!='1' or int(r[20])<1]
          if bad: raise SystemExit('WS33_G_SVAR_AF_V2_RUNTIME=FAIL '+repr(bad))
          scry=[x for x in cases if x[17]=='Scry' and 'ScryNum$ X' in base64.b64decode(x[18]).decode()]
          assert len(scry)==1
          pid=scry[0][1]
          events=[]
          for line in Path('generated/record/decision-events-with-path.tsv').read_text().splitlines():
              f=line.split('\t')
              path=base64.b64decode(f[0]).decode()
              kind=base64.b64decode(f[2]).decode()
              if path==pid: events.append(kind)
          if 'INPUT_CONFIRM' not in events:
              raise SystemExit('WS33_G_SVAR_AF_V2_SCRY_POSITIVE_BRANCH=FAIL '+repr(events))
          if int(rows[pid][7]) < 2:
              raise SystemExit('WS33_G_SVAR_AF_V2_SCRY_DECISION_COUNT=FAIL '+rows[pid][7])
          print('WS33_G_SVAR_AF_V2_RUNTIME=PASS paths=21 stack=21 target_reachability=21')
          print('WS33_G_SVAR_AF_V2_SCRY_POSITIVE_BRANCH=PASS decision_kinds='+','.join(events))
          PY

      - name: Materialize source chain
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg head "$(cat generated/diagnostic/workflow-source-head.txt)" \
            --arg tree "$(cat generated/diagnostic/workflow-source-tree.txt)" \
            --arg forge "$FORGE_PIN" --arg direct "$DIRECT_RUNTIME_SOURCE_HEAD" \
            --arg afbase "$AF_BASE_SOURCE_HEAD" --arg old_behavior "$OLD_BEHAVIOR_ARTIFACT_ID" \
            '{schema:"commander-simulator-next.ws33-g-svar-af-runtime-v2-source-chain.v1",workflow_source_head:$head,workflow_source_tree:$tree,forge_pin:$forge,direct_runtime_source_head:$direct,af_base_source_head:$afbase,case_identity_source_artifact_id:($old_behavior|tonumber),witness_strengthening:"SOURCE_SVAR_COUNT_VALID_TAPPED",coverage_mutated:false,status:"PASS"}' \
            > generated/diagnostic/SOURCE_CHAIN.json
          git diff --exit-code
          echo 'WS33_G_SVAR_AF_V2_COVERAGE_MUTATED=FALSE'

      - name: Upload immutable strengthened AF runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g3-svar-af-runtime-v2-${{ github.run_id }}
          path: |
            generated/source/g-svar-af-cases.tsv
            generated/record
            generated/diagnostic
            generated/overlay-logs
          if-no-files-found: error
          retention-days: 90
