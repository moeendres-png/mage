name: WS33 G3 SVar AF ABI replay evidence

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-g3-svar-af-abi-replay.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/checkpoints/G3_AF_ABI_RUN_33747841460.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  DIRECT_RUNTIME_SOURCE_TREE: 857dc01e04f58ca59437e08710bcb194bf030ea4
  AF_BEHAVIOR_SOURCE_HEAD: 28f4e7cdd6a35c488d4633cf8d77163a8aa2d5d9
  AF_BEHAVIOR_SOURCE_TREE: fa5cb7385b2724433cf877b11e890985adef2376
  BEHAVIOR_ARTIFACT_ID: '9889684290'
  BEHAVIOR_ARTIFACT_DIGEST: sha256:7a9b8a4e8dd993d419d55fa31763ef8d49ffc3927408bfdb4488724dd16d68e9
  MODEL_SOURCE_HEAD: c5d6cb8f4831e61b4ee8a1176ccbe4f6b98479ea
  MODEL_ARTIFACT_ID: '9823383539'
  MODEL_ARTIFACT_DIGEST: sha256:aab73ba2ede151bbd0b803c2164d3067ddd65f17d49cf655c34eef67d903595d
  MODEL_SHA: cd48f4279d682ab944e2534bf937d87e5311e83989e97179ae73c5c7d1bb6224
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  af-abi-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout current workflow only
        uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Download exact immutable AF behavior and model evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/model generated/source generated/record generated/replay generated/diagnostic generated/overlay-logs

          bmeta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BEHAVIOR_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$bmeta")" = "$BEHAVIOR_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$bmeta")" = "$AF_BEHAVIOR_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$BEHAVIOR_ARTIFACT_ID/zip" > generated/behavior.zip
          test "sha256:$(sha256sum generated/behavior.zip | cut -d' ' -f1)" = "$BEHAVIOR_ARTIFACT_DIGEST"
          unzip -q generated/behavior.zip -d generated/source
          test -s generated/source/g-svar-af-cases.tsv
          test -s generated/source/record/case-summary.tsv
          python - <<'PY'
          from pathlib import Path
          cases=[x.split('\t') for x in Path('generated/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          rows=[x.split('\t') for x in Path('generated/source/record/case-summary.tsv').read_text().splitlines() if x]
          assert len(cases)==21 and all(len(x)==19 for x in cases)
          assert sum(x[12]=='1' for x in cases)==12
          assert sum(x[13]=='1' for x in cases)==9
          assert sum(x[11]=='1' for x in cases)==4
          assert len(rows)==21 and all(len(x)>=21 for x in rows)
          assert all(x[4]=='PASS' and x[18]=='1' and x[19]=='1' and int(x[20])>=1 for x in rows)
          print('WS33_G_SVAR_AF_IMMUTABLE_BEHAVIOR=PASS paths=21 replay_required=12 decision_required=9 rng_required=4')
          PY

          mmeta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$mmeta")" = "$MODEL_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$mmeta")" = "$MODEL_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID/zip" > generated/model.zip
          test "sha256:$(sha256sum generated/model.zip | cut -d' ' -f1)" = "$MODEL_ARTIFACT_DIGEST"
          unzip -q generated/model.zip -d generated/model
          if test -d generated/model/output/ws33; then mv generated/model/output/ws33 generated/model/ws33; fi
          test -d generated/model/ws33
          test "$(sha256sum generated/model/ws33/WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json | cut -d' ' -f1)" = "$MODEL_SHA"
          jq -e '.status_counts.PASS==285 and .status_counts.UNKNOWN==3903' generated/model/ws33/WS33_PATH_COVERAGE.json

      - name: Checkout immutable Direct-G runtime source
        uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - name: Checkout immutable AF behavior tooling source
        uses: actions/checkout@v4
        with: {ref: '${{ env.AF_BEHAVIOR_SOURCE_HEAD }}', path: af-source, fetch-depth: 1}
      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - name: Checkout retained WS01
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - name: Checkout retained WS12
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - name: Checkout retained WS32
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - name: Checkout historical WS31 harness infrastructure only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C direct-source rev-parse HEAD)" = "$DIRECT_RUNTIME_SOURCE_HEAD"
          test "$(git -C direct-source rev-parse 'HEAD^{tree}')" = "$DIRECT_RUNTIME_SOURCE_TREE"
          test "$(git -C af-source rev-parse HEAD)" = "$AF_BEHAVIOR_SOURCE_HEAD"
          test "$(git -C af-source rev-parse 'HEAD^{tree}')" = "$AF_BEHAVIOR_SOURCE_TREE"
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"

      - name: Apply exact immutable green AF runtime overlay stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python direct-source/$ROOT/runtime-overlays/apply-ws33-input-confirm.py --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python direct-source/$ROOT/runtime-overlays/apply-ws33-stack-target.py --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python af-source/$ROOT/runtime-overlays/apply-ws33-target-selection.py --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python af-source/$ROOT/runtime-overlays/apply-ws33-svar-reachability.py --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log
          ! grep -F 'WS33_ENTITY_CARD_OBSERVATION=PRINCIPAL_SCOPED_REMOTE_DELTA' generated/overlay-logs/ws33-input-confirm.log
          echo 'WS33_G_SVAR_AF_RUNTIME_SOURCE_SPLIT=PASS direct_runtime=d8af15cb af_tooling=28f4e7cd'

      - name: Prepare exact immutable AF harness plus observer-only request trace
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GSVarAfQualificationTest.java
          python direct-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$dst"
          python af-source/$ROOT/ws33_prepare_g_svar_af_harness.py --harness "$dst"
          python af-source/$ROOT/ws33_instrument_g_authoritative_requests.py --harness "$dst"
          cp af-source/$ROOT/runtime-tests/Ws33TargetSelectionExternalizationTest.java forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'prepareSourceParentChoices(spec,sa)' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          grep -F 'decision-requests-with-path.tsv' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/instrumented-harness.sha256
          test "$(cut -d' ' -f1 generated/diagnostic/instrumented-harness.sha256)" = "d130881b2321bae66101131adddc0b8906a28b3fa8e289ca1fab101181970486"

      - name: Verify ABI adjudicator regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest "af-source/$ROOT/test_ws33_adjudicate_g_abi_request_evidence.py"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Verify target-selection regression in isolated JVM
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.gamesimulationtests.Ws33TargetSelectionExternalizationTest \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) \
            2>&1 | tee generated/diagnostic/target-selection-regression.log
          echo 'WS33_G_SVAR_AF_TARGET_REGRESSION_ISOLATED=PASS'

      - name: Supplemental AF record capture in fresh campaign JVM
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/source/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" \
            -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          test -s generated/record/decision-requests-with-path.tsv
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -s generated/record/rng-tape.tsv
          python - <<'PY'
          from pathlib import Path
          rows=[x.split('\t') for x in Path('generated/record/case-summary.tsv').read_text().splitlines() if x]
          assert len(rows)==21
          bad=[(x[0],x[4],x[14],x[15],x[18:21]) for x in rows if len(x)<21 or x[4]!='PASS' or x[18]!='1' or x[19]!='1' or int(x[20])<1]
          if bad: raise SystemExit('WS33_G_SVAR_AF_RECORD=FAIL '+repr(bad))
          print('WS33_G_SVAR_AF_RECORD=PASS paths=21 stack=21 target_reachability=21')
          PY

      - name: Prove exact nonperturbation against immutable AF record
        shell: bash
        run: |
          set -euo pipefail
          cmp generated/source/record/case-summary.tsv generated/record/case-summary.tsv
          cmp generated/source/record/decision-tape.tsv generated/record/decision-tape.tsv
          cmp generated/source/record/decision-events-with-path.tsv generated/record/decision-events-with-path.tsv
          cmp generated/source/record/rng-tape.tsv generated/record/rng-tape.tsv
          cmp generated/source/record/rng-events-with-path.tsv generated/record/rng-events-with-path.tsv
          cmp generated/source/record/decision-requests-with-path.tsv generated/record/decision-requests-with-path.tsv
          echo 'WS33_G_SVAR_AF_REQUEST_TRACE_RECORD_NONPERTURBATION=PASS'

      - name: Tape-driven AF replay capture
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/source/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" \
            -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/source/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/source/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/decision-requests-with-path.tsv
          cmp generated/record/case-summary.tsv generated/replay/case-summary.tsv
          cmp generated/record/decision-tape.tsv generated/replay/decision-tape.tsv
          cmp generated/record/decision-events-with-path.tsv generated/replay/decision-events-with-path.tsv
          cmp generated/record/rng-tape.tsv generated/replay/rng-tape.tsv
          cmp generated/record/rng-events-with-path.tsv generated/replay/rng-events-with-path.tsv
          cmp generated/record/decision-requests-with-path.tsv generated/replay/decision-requests-with-path.tsv
          python - <<'PY'
          from pathlib import Path
          cases=[x.split('\t') for x in Path('generated/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          rec={x.split('\t')[0]:x for x in Path('generated/record/case-summary.tsv').read_text().splitlines() if x}
          rep={x.split('\t')[0]:x for x in Path('generated/replay/case-summary.tsv').read_text().splitlines() if x}
          required=[x[1] for x in cases if x[12]=='1']
          assert len(required)==12 and all(rec[p]==rep[p] for p in required)
          print('WS33_G_SVAR_AF_REQUIRED_REPLAY=PASS required_paths=12')
          PY

      - name: Strictly adjudicate AF authoritative request evidence
        shell: bash
        run: |
          set -euo pipefail
          python "af-source/$ROOT/ws33_adjudicate_g_abi_request_evidence.py" \
            --cases generated/source/g-svar-af-cases.tsv \
            --record-requests generated/record/decision-requests-with-path.tsv \
            --replay-requests generated/replay/decision-requests-with-path.tsv \
            --decision-events generated/record/decision-events-with-path.tsv \
            --decision-tape generated/record/decision-tape.tsv \
            --rng-events generated/record/rng-events-with-path.tsv \
            --out-dir generated/diagnostic \
            --expected-paths 21 \
            --expected-decision-paths 9 \
            --expected-rng-paths 4 \
            --behavior-artifact-id "$BEHAVIOR_ARTIFACT_ID" \
            --behavior-artifact-digest "$BEHAVIOR_ARTIFACT_DIGEST" \
            --behavior-source-head "$AF_BEHAVIOR_SOURCE_HEAD" \
            --model-artifact-id "$MODEL_ARTIFACT_ID" \
            --effective-model-sha256 "$MODEL_SHA"
          jq -e '.status=="PASS" and .schema=="commander-simulator-next.ws33-g-abi-request-evidence.v2" and .path_count==21 and .decision_required_path_count==9 and .decision_required_paths_observed==9 and .rng_required_path_count==4 and .rng_required_paths_observed==4 and .record_replay_request_trace_equal==true and .authoritative_legal_options_captured_from_request==true and .request_identity_scope=="principal_id+token" and .hidden_identity_payload_retained==false and .coverage_mutated==false and .silent_fallback==false' generated/diagnostic/WS33_G_ABI_REQUEST_EVIDENCE.json

      - name: Upload immutable AF ABI replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g3-svar-af-abi-replay-${{ github.run_id }}
          path: |
            generated/diagnostic
            generated/record
            generated/replay
            generated/overlay-logs
            generated/source/g-svar-af-cases.tsv
          if-no-files-found: error
          retention-days: 90
