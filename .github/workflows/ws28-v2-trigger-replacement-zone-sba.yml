name: WS28 trigger replacement zone SBA closure V2

on:
  workflow_dispatch:
  push:
    branches:
      - work/ws28-v2-trigger-replacement-zone-sba-20260830

permissions:
  contents: read
  actions: read

env:
  WS26_HEAD: 206a39cbaa3eeb98b10c2ddc36d51fe5b1b2f5ef
  WS26_TREE: 837f445f78bb26462653c58baf1532e294151b10
  WS26_ARTIFACT_ID: '9723722686'
  WS26_ARTIFACT_DIGEST: sha256:b9e1fc4fd792b0baa1da1c17e3bbc9e01b2557d4b73b8590e680679f53b59883
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  ROOT: research/greenfield-qualification/actual-card-behavior/ws28

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact WS28 source
        uses: actions/checkout@v4
        with:
          path: qual
          fetch-depth: 20

      - name: Verify exact WS26 base and file ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qual rev-parse "$WS26_HEAD^{tree}")" = "$WS26_TREE"
          git -C qual merge-base --is-ancestor "$WS26_HEAD" HEAD
          bad="$(git -C qual diff --name-only "$WS26_HEAD"...HEAD | grep -Ev '^(research/greenfield-qualification/actual-card-behavior/ws28/|research/greenfield-qualification/WS28_HANDOFF\.md$|\.github/workflows/ws28-v2-trigger-replacement-zone-sba\.yml$)' || true)"
          test -z "$bad" || { echo "out-of-scope WS28 changes:" >&2; echo "$bad" >&2; exit 1; }
          mkdir -p inputs prepared artifact engine-artifact

      - name: Checkout exact pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1

      - name: Verify exact Forge pin
        shell: bash
        run: test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"

      - name: Download exact immutable WS26 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WS26_ARTIFACT_ID" --jq '.digest')"
          test "$actual" = "$WS26_ARTIFACT_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$WS26_ARTIFACT_ID/zip" > /tmp/ws26.zip
          unzip -q /tmp/ws26.zip -d inputs/ws26-artifact
          WS26_DIR="inputs/ws26-artifact/research/greenfield-qualification/actual-card-behavior/ws26"
          test "$(jq -r '.WORKSTREAM_COMPLETE' "$WS26_DIR/WS26_GATE.json")" = true
          test "$(jq -r '.WS26_MODEL_V2' "$WS26_DIR/WS26_GATE.json")" = PASS
          test "$(jq -r '.WS27_WS31_ELIGIBLE' "$WS26_DIR/WS26_GATE.json")" = true
          test "$(jq -r '.path_count' "$WS26_DIR/WS26_BEHAVIOR_PATH_MANIFEST_V2.json")" = 4280

      - name: Materialize exact WS28 owner cases
        shell: bash
        run: |
          set -euo pipefail
          python3 "qual/$ROOT/ws28_prepare.py" \
            --ws26-dir inputs/ws26-artifact/research/greenfield-qualification/actual-card-behavior/ws26 \
            --forge-root forge --out prepared
          test "$(wc -l < prepared/WS28_CASES.tsv)" = 1172
          jq -e '.family_path_count==1174 and .reused_exact_ws16_child_count==2 and .new_execution_case_count==1172 and .unresolved_root_count==0' prepared/WS28_PREPARE_SUMMARY.json >/dev/null

      - name: Install isolated WS28 real-event overlay
        shell: bash
        run: |
          set -euo pipefail
          cp "qual/$ROOT/forge-overlay/Ws28FamilyHarnessTest.java" \
            forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/Ws28FamilyHarnessTest.java
          cp "qual/$ROOT/forge-overlay/Ws28RealChangesZoneSmokeTest.java" \
            forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/Ws28RealChangesZoneSmokeTest.java
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"

      - name: Execute pinned Forge real ChangesZone census
        id: engine
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CASES="$PWD/prepared/WS28_CASES.tsv"
          mkdir -p engine-artifact
          (
            cd forge
            xvfb-run -a mvn -pl forge-gui-desktop -am \
              '-Dtest=forge.gamesimulationtests.Ws28RealChangesZoneSmokeTest' \
              '-Dsurefire.failIfNoSpecifiedTests=false' \
              "-Dws28.cases=$CASES" '-Dws28.cz.limit=400' test
          ) 2>&1 | tee engine-artifact/maven.log

      - name: Package real-event census evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp -a forge/forge-gui-desktop/target/ws28-runtime/. engine-artifact/ 2>/dev/null || true
          cp forge/forge-gui-desktop/target/surefire-reports/TEST-forge.gamesimulationtests.Ws28RealChangesZoneSmokeTest.xml engine-artifact/testng-report.xml 2>/dev/null || true
          printf '%s\n' "$(git -C forge rev-parse HEAD)" > engine-artifact/forge_head.txt
          printf '%s\n' "$GITHUB_SHA" > engine-artifact/tested_source_head.txt
          sha256sum engine-artifact/* > engine-artifact/ENGINE_HASHES.sha256 2>/dev/null || true

      - name: Upload real-event census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws28-real-changes-zone-census
          path: engine-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Package preparation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp -a prepared/. artifact/ 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > artifact/tested_source_head.txt
          git -C qual rev-parse 'HEAD^{tree}' > artifact/tested_source_tree.txt
          printf '%s\n' "$FORGE_PIN" > artifact/forge_pin.txt

      - name: Materialize fail-closed closure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "qual/$ROOT/ws28_gate.py" \
            --prepare-summary prepared/WS28_PREPARE_SUMMARY.json \
            --cases prepared/WS28_CASES.tsv \
            --changes-zone-results engine-artifact/WS28_REAL_CHANGES_ZONE_RESULTS.tsv \
            --source-head "$GITHUB_SHA" \
            --source-tree "$(git -C qual rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" \
            --out-dir "artifact/$ROOT"
          test "$(jq -r '.WS28_FAMILY_GATE' "artifact/$ROOT/WS28_GATE.json")" = FAIL_CLOSED
          test "$(jq -r '.WORKSTREAM_COMPLETE' "artifact/$ROOT/WS28_GATE.json")" = false

      - name: Upload WS28 closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws28-closure-evidence
          path: artifact
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete WS28 closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gate="artifact/$ROOT/WS28_GATE.json"
          test "$(jq -r '.WS28_FAMILY_GATE' "$gate")" = PASS
          test "$(jq -r '.WORKSTREAM_COMPLETE' "$gate")" = true
