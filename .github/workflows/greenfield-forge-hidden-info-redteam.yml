name: Greenfield Forge WS05 principal hidden-info qualification

on:
  workflow_dispatch: {}
  push:
    branches:
      - work/ws05-hidden-info-20260828
    paths:
      - '.github/workflows/greenfield-forge-hidden-info-redteam.yml'
      - 'research/greenfield-qualification/hidden-info/**'
      - 'research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py'

concurrency:
  group: ws05-hidden-info-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUDIT_BASE_SHA: c0e42fb42c4a603aff4a76b1284f8271c12bfd42
      FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
      WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
      WS01_TREE: 8d8d4587e3cf2cb3c375b8039c0d9d08c6e41f84
      WS01_RUN_ID: '33200503101'
      EXISTING_2P_RUN_ID: '33155887970'
      EXISTING_2P_ARTIFACT_ID: '9679616053'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact WS05 revision
        uses: actions/checkout@v4
        with:
          path: qual
          fetch-depth: 1

      - name: Checkout exact qualified WS01 dependency read-only
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: bf089ea806f54a9bbb64ede205915729e3629684
          path: ws01-dependency
          fetch-depth: 1

      - name: Checkout exact Forge pin
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 8c7e9afb8e6caee88644b94e25da5852e36f8928
          path: forge
          fetch-depth: 1

      - name: Verify dependency and materialize provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qual rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$AUDIT_BASE_SHA...$GITHUB_SHA" --jq .merge_base_commit.sha)" = "$AUDIT_BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$AUDIT_BASE_SHA...$GITHUB_SHA" --jq .behind_by)" = 0
          test "$(git -C ws01-dependency rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws01-dependency rev-parse 'HEAD^{tree}')" = "$WS01_TREE"
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WS01_RUN_ID" --jq .head_sha)" = "$WS01_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WS01_RUN_ID" --jq .conclusion)" = success
          mkdir -p artifacts/forge-ws05-hidden-info
          git -C qual rev-parse HEAD > artifacts/forge-ws05-hidden-info/source_head.txt
          git -C qual rev-parse 'HEAD^{tree}' > artifacts/forge-ws05-hidden-info/source_tree.txt
          printf '%s\n' "$AUDIT_BASE_SHA" > artifacts/forge-ws05-hidden-info/audit_base_sha.txt
          printf '%s\n' "$WS01_HEAD" > artifacts/forge-ws05-hidden-info/ws01_dependency_head.txt
          printf '%s\n' "$WS01_TREE" > artifacts/forge-ws05-hidden-info/ws01_dependency_tree.txt
          printf '%s\n' "$WS01_RUN_ID" > artifacts/forge-ws05-hidden-info/ws01_dependency_run.txt
          printf '%s\n' "$FORGE_PIN" > artifacts/forge-ws05-hidden-info/forge_pin.txt

      - name: Apply exact WS01 overlay without merging dependency branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ws01-dependency rev-parse HEAD)" = "$WS01_HEAD"
          bash ws01-dependency/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh \
            forge ws01-dependency/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch \
            | tee artifacts/forge-ws05-hidden-info/ws01-overlay.log
          test "$(git -C qual rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply WS05 principal visibility overlay and install probes
        shell: bash
        run: |
          set -euo pipefail
          python3 qual/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge \
            | tee artifacts/forge-ws05-hidden-info/ws05-overlay.log
          cp qual/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java \
            forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          cp qual/research/greenfield-qualification/hidden-info/Ws05HiddenInfoQualificationTest.java \
            forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoQualificationTest.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: forge/pom.xml

      - name: Ensure virtual display
        shell: bash
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Run static fail-closed boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 qual/research/greenfield-qualification/hidden-info/ws05_hidden_info_static_audit.py \
            --forge-root forge \
            --source-head "$(cat artifacts/forge-ws05-hidden-info/source_head.txt)" \
            --source-tree "$(cat artifacts/forge-ws05-hidden-info/source_tree.txt)" \
            --ws01-head "$WS01_HEAD" \
            --out artifacts/forge-ws05-hidden-info/WS05_STATIC_AUDIT.json \
            | tee artifacts/forge-ws05-hidden-info/static-audit.log

      - name: Compile exact-pin WS01 plus WS05 overlay
        shell: bash
        run: |
          set -o pipefail
          cd forge
          mvn -B -ntp -T 1C -pl forge-gui-desktop -am -DskipTests test-compile 2>&1 \
            | tee ../artifacts/forge-ws05-hidden-info/compile.log

      - name: Run real 4P Commander multi-principal hidden-info campaign
        shell: bash
        run: |
          set -uo pipefail
          secret="$RUNNER_TEMP/ws05-hidden-canary.txt"
          rm -f "$secret"
          cd forge
          set +e
          xvfb-run -a mvn -B -ntp -T 1C -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws05HiddenInfoQualificationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dws05.evidencePath="$GITHUB_WORKSPACE/artifacts/forge-ws05-hidden-info/WS05_RUNTIME.json" \
            -Dws05.secretPath="$secret" \
            test 2>&1 | tee ../artifacts/forge-ws05-hidden-info/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > ../artifacts/forge-ws05-hidden-info/test.exit
          grep -E '^WS05_' ../artifacts/forge-ws05-hidden-info/runtime.log \
            > ../artifacts/forge-ws05-hidden-info/runtime-markers.txt || true
          rm -f "$secret"
          test "$rc" -eq 0
          grep -q '^WS05_PILOT_VISIBLE_HIDDEN_INFO_LEAKS=0$' ../artifacts/forge-ws05-hidden-info/runtime-markers.txt
          grep -q '^WS05_CROSS_PRINCIPAL_DECISION_LEAKS=0$' ../artifacts/forge-ws05-hidden-info/runtime-markers.txt
          grep -q '^WS05_LOOK_REVEAL_LIFECYCLE=PASS$' ../artifacts/forge-ws05-hidden-info/runtime-markers.txt
          grep -q '^WS05_SECRET_CHOICE_EXCEPTION=PASS$' ../artifacts/forge-ws05-hidden-info/runtime-markers.txt
          grep -q '^WS05_HIDDEN_INFO=PASS$' ../artifacts/forge-ws05-hidden-info/runtime-markers.txt

      - name: Adjudicate Q2 fail-closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/forge-ws05-hidden-info')
          def load(name):
              p = root / name
              return json.loads(p.read_text()) if p.exists() else None
          def text(name):
              p = root / name
              return p.read_text(errors='replace') if p.exists() else ''

          static = load('WS05_STATIC_AUDIT.json')
          runtime = load('WS05_RUNTIME.json')
          test_exit = text('test.exit').strip() or None
          markers = text('runtime-markers.txt')
          source_head = text('source_head.txt').strip() or None
          source_tree = text('source_tree.txt').strip() or None

          marker_ok = all(x in markers for x in (
              'WS05_PILOT_VISIBLE_HIDDEN_INFO_LEAKS=0',
              'WS05_CROSS_PRINCIPAL_DECISION_LEAKS=0',
              'WS05_LOOK_REVEAL_LIFECYCLE=PASS',
              'WS05_SECRET_CHOICE_EXCEPTION=PASS',
              'WS05_HIDDEN_INFO=PASS',
          ))

          def rz(key, default=10**9):
              return runtime.get(key, default) if runtime else default
          def rp(key, default=0):
              return runtime.get(key, default) if runtime else default

          runtime_core = bool(runtime) and runtime.get('status') == 'PASS' and test_exit == '0' and marker_ok
          static_core = bool(static) and static.get('status') == 'PASS'
          principals = runtime.get('principal_request_counts', {}) if runtime else {}
          four_principals = len(principals) == 4 and all(int(v) > 0 for v in principals.values())

          surfaces = {
              'decoded_transport': 'PASS' if runtime_core and rz('transport_leaks') == 0 and rp('decoded_transport_samples') > 0 else 'FAIL',
              'principal_observations': 'PASS' if runtime_core and four_principals else 'FAIL',
              'private_hands_libraries': 'PASS' if runtime_core and rz('transport_leaks') == 0 else 'FAIL',
              'face_down_objects': 'PASS' if runtime_core and rp('face_down_hidden_samples') > 0 and rz('transport_leaks') == 0 else 'FAIL',
              'private_searches': 'PASS' if runtime_core and runtime.get('lifecycle_complete') else 'FAIL',
              'look_at_effects': 'PASS' if runtime_core and runtime.get('lifecycle_complete') else 'FAIL',
              'secret_choices': 'PASS' if runtime_core and 'WS05_SECRET_CHOICE_EXCEPTION=PASS' in markers else 'FAIL',
              'reveal_lifecycle': 'PASS' if runtime_core and runtime.get('lifecycle_complete') and rz('lifecycle_mismatches') == 0 else 'FAIL',
              'known_top_information': 'PASS' if runtime_core and runtime.get('lifecycle_complete') else 'FAIL',
              'decision_request_payloads': 'PASS' if runtime_core and rz('decision_payload_leaks') == 0 and four_principals else 'FAIL',
              'ids_hashes': 'PASS' if runtime_core and static_core and rz('identity_bearing_id_hash_leaks') == 0 else 'FAIL',
              'serialized_transport': 'PASS' if runtime_core and static_core and rz('transport_leaks') == 0 else 'FAIL',
              'logs': 'PASS' if runtime_core and rz('log_surface_leaks') == 0 else 'FAIL',
              'exceptions': 'PASS' if runtime_core and rz('exception_surface_leaks') == 0 and 'WS05_SECRET_CHOICE_EXCEPTION=PASS' in markers else 'FAIL',
              'debug_surface': 'PASS' if runtime_core and rz('debug_surface_leaks') == 0 else 'FAIL',
              'replay_surface': 'PASS' if runtime_core and rp('replay_events') > 0 and rz('replay_surface_leaks') == 0 else 'FAIL',
          }

          pass_all = static_core and runtime_core and all(v == 'PASS' for v in surfaces.values()) \
              and rz('pilot_visible_hidden_info_leaks') == 0 \
              and rz('cross_principal_decision_leaks') == 0

          result = {
              'schema': 'commander-simulator-next.ws05-hidden-information-gate.v1',
              'workstream': 'WS05',
              'source_head': source_head,
              'source_tree': source_tree,
              'audit_base_sha': 'c0e42fb42c4a603aff4a76b1284f8271c12bfd42',
              'forge_pin': '8c7e9afb8e6caee88644b94e25da5852e36f8928',
              'ws01_dependency': {
                  'head': 'bf089ea806f54a9bbb64ede205915729e3629684',
                  'tree': '8d8d4587e3cf2cb3c375b8039c0d9d08c6e41f84',
                  'qualified_run_id': 33200503101,
                  'merged': False,
                  'overlay_only': True,
              },
              'existing_2p_regression_baseline': {
                  'run_id': 33155887970,
                  'artifact_id': 9679616053,
                  'decoded_hidden_name_leaks': 0,
                  'rerun': False,
                  'reason': 'Superseded by broader fresh 4P decoded-transport campaign after visibility change.',
              },
              'pilot_visible_hidden_info_leaks': rz('pilot_visible_hidden_info_leaks'),
              'cross_principal_decision_leaks': rz('cross_principal_decision_leaks'),
              'surfaces': surfaces,
              'static_audit': static.get('status') if static else 'NOT_RUN',
              'runtime_campaign': runtime.get('status') if runtime else 'NOT_RUN',
              'Q2_HIDDEN_INFORMATION': 'PASS' if pass_all else 'FAIL',
              'status': 'PASS' if pass_all else 'FAIL',
              'evidence_class': ['DIRECTLY_VERIFIED', 'CODE_DERIVED', 'TECHNICALLY_CONFORMANT', 'CI_EXECUTED'],
          }
          (root / 'HIDDEN_INFORMATION_GATE.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'status': result['status'], 'surfaces': surfaces}, sort_keys=True))
          if not pass_all:
              raise SystemExit(1)
          PY

      - name: Hash current evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/forge-ws05-hidden-info
          find . -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > hashes.sha256 || true

      - name: Upload WS05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-forge-ws05-hidden-info
          path: artifacts/forge-ws05-hidden-info
          if-no-files-found: error
