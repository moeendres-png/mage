name: WS33 G3 SVar AF principal observation v5

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-g3-svar-af-principal-observation-v5.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_g_principal_observation.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_g_principal_observation_v4.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_g_principal_observation_v5.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_instrument_g_principal_observations.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-input-confirm.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-observation-fanout.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-external-card-decision-lifetime.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  MODEL_SHA: cd48f4279d682ab944e2534bf937d87e5311e83989e97179ae73c5c7d1bb6224
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  DIRECT_RUNTIME_SOURCE_TREE: 857dc01e04f58ca59437e08710bcb194bf030ea4
  AF_BASE_SOURCE_HEAD: 28f4e7cdd6a35c488d4633cf8d77163a8aa2d5d9
  AF_BASE_SOURCE_TREE: fa5cb7385b2724433cf877b11e890985adef2376
  STRENGTHENER_SOURCE_HEAD: b3d02af402e55a65b11dcfec94def62be469a7a0
  RUNTIME_V2_SOURCE_HEAD: bd9998a30bd4f34603592aa06e7b16d2d3320047
  RUNTIME_V2_ARTIFACT_ID: '9900656730'
  RUNTIME_V2_ARTIFACT_DIGEST: sha256:b339b3eba6daaee5b7f59e9e3c05a7af611c1479ebd3d7b6e2c94d04f72e0708
  AF_ABI_V2_SOURCE_HEAD: fe63c66a7be6215dffd4da85fc4cf7bf1de63b72
  AF_ABI_V2_SOURCE_TREE: 6faa1a272201c5101fdf1533f8540ce99a4a3f8c
  AF_ABI_V2_ARTIFACT_ID: '9901008043'
  AF_ABI_V2_ARTIFACT_DIGEST: sha256:bf58a7154e8e2623bc9e6f4acf10c933b7d4fd692a357a643b881c586f4c15ef
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  af-principal-observation-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout current G3 v5 tooling
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Verify exact serial ancestry and source trees
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$DIRECT_RUNTIME_SOURCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$AF_BASE_SOURCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$STRENGTHENER_SOURCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$AF_ABI_V2_SOURCE_HEAD" "$GITHUB_SHA"
          test "$(git rev-parse "$DIRECT_RUNTIME_SOURCE_HEAD^{tree}")" = "$DIRECT_RUNTIME_SOURCE_TREE"
          test "$(git rev-parse "$AF_BASE_SOURCE_HEAD^{tree}")" = "$AF_BASE_SOURCE_TREE"
          test "$(git rev-parse "$AF_ABI_V2_SOURCE_HEAD^{tree}")" = "$AF_ABI_V2_SOURCE_TREE"
          mkdir -p generated/abi generated/record generated/replay generated/diagnostic generated/overlay-logs
          printf '%s\n' "$GITHUB_SHA" > generated/diagnostic/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/diagnostic/workflow-source-tree.txt

      - name: Consume exact immutable AF ABI v2 pass
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AF_ABI_V2_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$AF_ABI_V2_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$AF_ABI_V2_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$AF_ABI_V2_ARTIFACT_ID/zip" > generated/af-abi-v2.zip
          test "sha256:$(sha256sum generated/af-abi-v2.zip | cut -d' ' -f1)" = "$AF_ABI_V2_ARTIFACT_DIGEST"
          unzip -q generated/af-abi-v2.zip -d generated/abi
          test -s generated/abi/source/source/g-svar-af-cases.tsv
          test -s generated/abi/record/case-summary.tsv
          test -s generated/abi/diagnostic/WS33_G_ABI_REQUEST_EVIDENCE.json
          test -s generated/abi/diagnostic/ABI_V2_SOURCE_CHAIN.json
          jq -e '.schema=="commander-simulator-next.ws33-g-abi-request-evidence.v2" and .status=="PASS" and .path_count==21 and .decision_required_path_count==9 and .decision_required_paths_observed==9 and .rng_required_path_count==4 and .rng_required_paths_observed==4 and .record_replay_request_trace_equal==true and .authoritative_legal_options_captured_from_request==true and .request_identity_scope=="principal_id+token" and .hidden_identity_payload_retained==false and .coverage_mutated==false and .silent_fallback==false' generated/abi/diagnostic/WS33_G_ABI_REQUEST_EVIDENCE.json
          jq -e --arg runtime "$RUNTIME_V2_SOURCE_HEAD" --arg digest "$RUNTIME_V2_ARTIFACT_DIGEST" '.schema=="commander-simulator-next.ws33-g-svar-af-abi-v2-chain.v1" and .status=="PASS" and .runtime_cert_source_head==$runtime and .runtime_cert_artifact_digest==$digest and .coverage_mutated==false' generated/abi/diagnostic/ABI_V2_SOURCE_CHAIN.json
          python - <<'PY'
          from pathlib import Path
          cases=[x.split('\t') for x in Path('generated/abi/source/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          rows=[x.split('\t') for x in Path('generated/abi/record/case-summary.tsv').read_text().splitlines() if x]
          assert len(cases)==21 and all(len(x)==19 for x in cases) and len({x[1] for x in cases})==21
          assert sum(x[10]=='1' for x in cases)==19
          assert sum(x[11]=='1' for x in cases)==4
          assert sum(x[12]=='1' for x in cases)==12
          assert sum(x[13]=='1' for x in cases)==9
          assert len(rows)==21 and all(len(x)>=21 for x in rows)
          assert all(x[4]=='PASS' and not x[14] and not x[15] and x[18]=='1' and x[19]=='1' and int(x[20])>=1 for x in rows)
          print('WS33_G_SVAR_AF_V5_ABI_SOURCE=PASS paths=21 hidden=19 rng=4 replay=12 decision_required=9')
          PY

      - name: Verify certified runtime v2 artifact remains immutable and available
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RUNTIME_V2_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$RUNTIME_V2_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$RUNTIME_V2_SOURCE_HEAD"

      - name: Checkout exact runtime and harness sources
        uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.AF_BASE_SOURCE_HEAD }}', path: af-base, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.STRENGTHENER_SOURCE_HEAD }}', path: strengthener-source, fetch-depth: 1}
      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact dependency pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C direct-source rev-parse HEAD)" = "$DIRECT_RUNTIME_SOURCE_HEAD"
          test "$(git -C direct-source rev-parse 'HEAD^{tree}')" = "$DIRECT_RUNTIME_SOURCE_TREE"
          test "$(git -C af-base rev-parse HEAD)" = "$AF_BASE_SOURCE_HEAD"
          test "$(git -C af-base rev-parse 'HEAD^{tree}')" = "$AF_BASE_SOURCE_TREE"
          test "$(git -C strengthener-source rev-parse HEAD)" = "$STRENGTHENER_SOURCE_HEAD"
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"

      - name: Apply principal-scoped observation runtime stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-observation-fanout.py" --forge-root forge | tee generated/overlay-logs/ws33-observation-fanout.log
          python "$ROOT/runtime-overlays/apply-ws33-external-card-decision-lifetime.py" --forge-root forge | tee generated/overlay-logs/ws33-card-decision-lifetime.log
          python direct-source/$ROOT/runtime-overlays/apply-ws33-stack-target.py --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python af-base/$ROOT/runtime-overlays/apply-ws33-target-selection.py --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python af-base/$ROOT/runtime-overlays/apply-ws33-svar-reachability.py --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log
          grep -F 'WS33_OBSERVATION_FANOUT=PASS' generated/overlay-logs/ws33-observation-fanout.log
          grep -F 'WS33_EXTERNAL_CARD_DECISION_LIFETIME=PASS' generated/overlay-logs/ws33-card-decision-lifetime.log
          grep -F 'WS33_FORGE_TEMP_SHOW_CLOSE_BOUNDARY=AUTHORITATIVE_CARD_REQUEST_RETURN' generated/overlay-logs/ws33-card-decision-lifetime.log

      - name: Prepare strengthened principal-observation harness
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GSVarAfQualificationTest.java
          python direct-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$dst"
          python af-base/$ROOT/ws33_prepare_g_svar_af_harness.py --harness "$dst"
          python strengthener-source/$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py --harness "$dst" | tee generated/diagnostic/hidden-witness.log
          python "$ROOT/ws33_instrument_g_principal_observations.py" --harness "$dst" | tee generated/diagnostic/af-observation-instrument.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS=PASS' generated/diagnostic/hidden-witness.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_CARD_NAME_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_PATH_ID_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -F 'WS33_G_PRINCIPAL_OBSERVATION_ATTRIBUTION=G_SVAR_AF' generated/diagnostic/af-observation-instrument.log
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'prepareSourceDependentPositiveWitness(spec,sa,source,actor)' "$dst"
          grep -F 'ExternalObservationTrace.setPath(spec.pathId)' "$dst"
          grep -F 'AbilitySub.setWs33ResolutionObserver' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/af-v5-instrumented-harness.sha256

          direct=generated/Ws33GAbilityQualificationTest.java
          python direct-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$direct"
          python "$ROOT/ws33_instrument_g_principal_observations.py" --harness "$direct" | tee generated/diagnostic/direct-anchor-compat.log
          grep -F 'WS33_G_PRINCIPAL_OBSERVATION_ATTRIBUTION=DIRECT_G' generated/diagnostic/direct-anchor-compat.log
          grep -F 'ExternalObservationTrace.setPath(spec.pathId)' "$direct"
          echo 'WS33_G_PRINCIPAL_OBSERVATION_DIRECT_G_COMPAT=PASS execution_rerun=FALSE'

      - name: Verify v5 classifier and lifecycle fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$ROOT/ws33_adjudicate_g_principal_observation.py" "$ROOT/ws33_adjudicate_g_principal_observation_v4.py" "$ROOT/ws33_adjudicate_g_principal_observation_v5.py" "$ROOT/ws33_instrument_g_principal_observations.py"
          PYTHONPATH="$ROOT" python - <<'PY'
          from pathlib import Path
          import base64
          import tempfile
          import ws33_adjudicate_g_principal_observation as p
          import ws33_adjudicate_g_principal_observation_v4 as v4
          import ws33_adjudicate_g_principal_observation_v5 as v5

          v5.regression_contract()
          assert v5.positive_profile_v5('Manifest','DB$ Manifest | DefinedPlayer$ TargetedController',True,False)[0]=='NEGATIVE_OR_TRANSITION_ONLY'
          assert v5.positive_profile_v5('Manifest','DB$ Manifest | ChoiceZone$ Library',True,False)[0]=='UNKNOWN_HIDDEN_CONSUMER'
          assert v5.positive_profile_v5('Scry','DB$ Scry | Defined$ You | ScryNum$ X',True,False)[0]=='POSITIVE_TEMPORARY_REQUIRED'

          rows=[x.split('\t') for x in Path('generated/abi/source/source/g-svar-af-cases.tsv').read_text().splitlines() if x]
          with tempfile.TemporaryDirectory() as td:
              af=Path(td)/'af.tsv'; af.write_text('\n'.join('\t'.join(x) for x in rows)+'\n')
              parsed=p.load_cases(af)
              assert len(parsed)==21 and {x['case_abi'] for x in parsed.values()}=={p.G_SVAR_AF_V19}
              assert all(parsed[x[1]]['api']==x[17] for x in rows)
              assert all(parsed[x[1]]['script']==base64.b64decode(x[18]).decode() for x in rows)

          def row(pid,coarse='0',cross='0'):
              x=['']*21; x[0]=pid; x[4]='PASS'; x[7]='0'; x[8]='0'; x[9]=coarse; x[10]=cross; x[18]='1'; x[19]='1'; x[20]='1'; return x
          pos='forge-behavior-v2:v5-positive'; req={pos:{'profile':'POSITIVE_TEMPORARY_REQUIRED','decision':False,'rng':False}}
          lifecycle=[
              {'path_id':pos,'kind':'SERVER_GRANT','principal_id':1,'card_id':7,'identity_match':True},
              {'path_id':pos,'kind':'CLIENT_VISIBLE','principal_id':1,'card_id':7,'identity_match':True},
              {'path_id':pos,'kind':'SERVER_REVOKE','principal_id':1,'card_id':7,'identity_match':True},
              {'path_id':pos,'kind':'CLIENT_HIDDEN','principal_id':1,'card_id':7,'identity_match':True},
          ]
          v4.reset_contract_state(); failures=[]
          v4.check_summary_v4('record',{pos:row(pos,'1')},req,failures); v4.check_summary_v4('replay',{pos:row(pos,'1')},req,failures)
          v4.check_events_v4('record',lifecycle,req,failures); v4.check_events_v4('replay',lifecycle,req,failures)
          assert not failures, failures
          v4.reset_contract_state(); failures=[]; v4.check_summary_v4('record',{pos:row(pos,'1')},req,failures); v4.check_events_v4('record',lifecycle[:-1],req,failures)
          assert failures
          v4.reset_contract_state(); failures=[]; v4.check_summary_v4('record',{pos:row(pos,'0','1')},req,failures); assert failures
          print('WS33_G_PRINCIPAL_OBSERVATION_V5_REGRESSION=PASS manifest_shape_aware=TRUE lifecycle_attested=TRUE incomplete_lifecycle_fail_closed=TRUE cross_principal_fail_closed=TRUE')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Fresh strengthened AF principal-observation record
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/abi/source/source/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -s generated/record/rng-tape.tsv
          test -s generated/record/PRINCIPAL_OBSERVATIONS.jsonl
          python - <<'PY'
          from pathlib import Path
          rows=[x.split('\t') for x in Path('generated/record/case-summary.tsv').read_text().splitlines() if x]
          assert len(rows)==21 and all(len(x)>=21 for x in rows) and len({x[0] for x in rows})==21
          bad=[(x[0],x[4],x[14],x[15],x[18:21]) for x in rows if x[4]!='PASS' or x[14] or x[15] or x[18]!='1' or x[19]!='1' or int(x[20])<1]
          if bad: raise SystemExit('WS33_G_SVAR_AF_PRINCIPAL_V5_RECORD_ENGINE=FAIL '+repr(bad))
          coarse={x[0]:int(x[9]) for x in rows if int(x[9])!=0}
          print('WS33_G_SVAR_AF_PRINCIPAL_V5_RECORD_ENGINE=PASS paths=21 coarse_hidden_signal_raw='+repr(coarse))
          PY

      - name: Tape-driven strengthened AF principal-observation replay
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/abi/source/source/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/PRINCIPAL_OBSERVATIONS.jsonl
          cmp generated/record/case-summary.tsv generated/replay/case-summary.tsv
          cmp generated/record/decision-tape.tsv generated/replay/decision-tape.tsv
          cmp generated/record/decision-events-with-path.tsv generated/replay/decision-events-with-path.tsv
          cmp generated/record/rng-tape.tsv generated/replay/rng-tape.tsv
          cmp generated/record/rng-events-with-path.tsv generated/replay/rng-events-with-path.tsv
          echo 'WS33_G_SVAR_AF_PRINCIPAL_V5_SEMANTIC_REPLAY=PASS paths=21'

      - name: Prove observation-only nonperturbation against AF ABI v2
        shell: bash
        run: |
          set -euo pipefail
          cmp generated/abi/record/decision-tape.tsv generated/record/decision-tape.tsv
          cmp generated/abi/record/decision-events-with-path.tsv generated/record/decision-events-with-path.tsv
          cmp generated/abi/record/rng-tape.tsv generated/record/rng-tape.tsv
          cmp generated/abi/record/rng-events-with-path.tsv generated/record/rng-events-with-path.tsv
          python - <<'PY'
          from pathlib import Path
          old={x.split('\t')[0]:x.split('\t') for x in Path('generated/abi/record/case-summary.tsv').read_text().splitlines() if x}
          new={x.split('\t')[0]:x.split('\t') for x in Path('generated/record/case-summary.tsv').read_text().splitlines() if x}
          assert set(old)==set(new) and len(old)==21
          for pid in old:
              a,b=old[pid],new[pid]
              assert len(a)>=21 and len(b)>=21
              assert a[:9]+a[10:] == b[:9]+b[10:], (pid,a,b)
          print('WS33_G_SVAR_AF_PRINCIPAL_V5_NONPERTURBATION=PASS only_permitted_summary_delta=coarse_hidden_signal_column_9')
          PY

      - name: Strict shape-aware AF principal-observation adjudication
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_adjudicate_g_principal_observation_v5.py" \
            --cases generated/abi/source/source/g-svar-af-cases.tsv \
            --record-dir generated/record \
            --replay-dir generated/replay \
            --out generated/diagnostic/WS33_G_AF_PRINCIPAL_OBSERVATION.json \
            --source-case-artifact-id "$AF_ABI_V2_ARTIFACT_ID" \
            --expected-paths 21
          jq -e '.schema=="commander-simulator-next.ws33-g-principal-observation.v3" and .status=="PASS" and .failure_count==0 and .case_abi=="G_SVAR_AF_V19" and .expected_paths==21 and .hidden_required_paths==19 and .record_path_coverage==21 and .replay_path_coverage==21 and .principal_transport=="REMOTE_CLIENT_DELTA" and .retained_hidden_identity_payload==false and .temporary_observation_revocation_required==true and .hidden_leak_delta_required==0 and .unauthorized_hidden_leak_delta_required==0 and .cross_principal_delta_required==0 and .coarse_hidden_signal_policy=="PRINCIPAL_ATTESTED_TEMPORARY_OBSERVATION" and .coarse_hidden_signal_raw_retained==true and .coarse_hidden_signal_record_paths==.coarse_hidden_signal_replay_paths and .coarse_hidden_signal_record_total==.coarse_hidden_signal_replay_total and .coverage_mutated==false and ((.observation_profile_counts.UNKNOWN_HIDDEN_CONSUMER // 0)==0)' generated/diagnostic/WS33_G_AF_PRINCIPAL_OBSERVATION.json

      - name: Materialize v5 source chain and hashes
        shell: bash
        run: |
          set -euo pipefail
          head="$(cat generated/diagnostic/workflow-source-head.txt)"
          tree="$(cat generated/diagnostic/workflow-source-tree.txt)"
          jq -n \
            --arg head "$head" --arg tree "$tree" --arg forge "$FORGE_PIN" --arg model "$MODEL_SHA" \
            --arg runtime_head "$RUNTIME_V2_SOURCE_HEAD" --arg runtime_id "$RUNTIME_V2_ARTIFACT_ID" --arg runtime_digest "$RUNTIME_V2_ARTIFACT_DIGEST" \
            --arg abi_head "$AF_ABI_V2_SOURCE_HEAD" --arg abi_tree "$AF_ABI_V2_SOURCE_TREE" --arg abi_id "$AF_ABI_V2_ARTIFACT_ID" --arg abi_digest "$AF_ABI_V2_ARTIFACT_DIGEST" \
            '{schema:"commander-simulator-next.ws33-g-af-principal-observation-v5-source-chain.v1",workflow_source_head:$head,workflow_source_tree:$tree,forge_pin:$forge,effective_model_sha256:$model,runtime_v2_source_head:$runtime_head,runtime_v2_artifact_id:($runtime_id|tonumber),runtime_v2_artifact_digest:$runtime_digest,af_abi_v2_source_head:$abi_head,af_abi_v2_source_tree:$abi_tree,af_abi_v2_artifact_id:($abi_id|tonumber),af_abi_v2_artifact_digest:$abi_digest,strengthened_witness:true,manifest_classifier:"SHAPE_AWARE_V5",coverage_mutated:false,status:"PASS"}' \
            > generated/diagnostic/SOURCE_CHAIN.json
          (cd generated && find diagnostic record replay overlay-logs abi/diagnostic -type f ! -path 'diagnostic/EVIDENCE_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > generated/EVIDENCE_SHA256SUMS.tmp
          mv generated/EVIDENCE_SHA256SUMS.tmp generated/diagnostic/EVIDENCE_SHA256SUMS.txt
          git diff --exit-code
          echo 'WS33_G_SVAR_AF_PRINCIPAL_V5_COVERAGE_MUTATED=FALSE'

      - name: Upload immutable AF principal-observation v5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g3-svar-af-principal-observation-v5-${{ github.run_id }}
          path: |
            generated/diagnostic
            generated/record
            generated/replay
            generated/overlay-logs
            generated/abi/diagnostic/WS33_G_ABI_REQUEST_EVIDENCE.json
            generated/abi/diagnostic/ABI_V2_SOURCE_CHAIN.json
            generated/abi/source/source/g-svar-af-cases.tsv
          if-no-files-found: error
          retention-days: 90
