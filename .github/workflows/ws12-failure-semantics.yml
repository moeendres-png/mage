name: WS12 unified failure semantics

on:
  workflow_dispatch: {}
  push:
    branches:
      - work/ws12-failure-semantics-20260829
    paths:
      - '.github/workflows/ws12-failure-semantics.yml'
      - 'research/greenfield-qualification/failure-semantics/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact WS12 revision
        uses: actions/checkout@v4
        with:
          path: qual
          fetch-depth: 1

      - name: Record immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "source_head=$(git -C qual rev-parse HEAD)"
            echo "source_tree=$(git -C qual rev-parse 'HEAD^{tree}')"
          } | tee evidence/provenance.env

      - name: Checkout exact Forge research pin
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 8c7e9afb8e6caee88644b94e25da5852e36f8928
          path: forge
          fetch-depth: 1

      - name: Apply retained strict boundary and WS12 overlay
        shell: bash
        run: |
          set -euo pipefail
          bash qual/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh \
            forge qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch \
            | tee evidence/ws01-patch-apply.log
          python3 qual/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py \
            --forge-root forge | tee evidence/ws12-overlay-apply.log
          grep -Fq 'private final UnifiedOutcomeCategory outcomeCategory;' \
            forge/forge-gui/src/main/java/forge/gamemodes/match/input/ExternalDecisionTape.java

      - name: Execute engine-neutral outcome witnesses
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/qual/research/greenfield-qualification/failure-semantics"
          python3 -m unittest discover \
            -s qual/research/greenfield-qualification/failure-semantics -p 'test_*.py' -v \
            2>&1 | tee evidence/python-contract-tests.log

      - name: Compile exact-pin Forge overlay
        shell: bash
        working-directory: forge
        run: |
          set -euo pipefail
          mvn -B '-DskipTests' -pl forge-gui -am test-compile \
            | tee ../evidence/forge-test-compile.log

      - name: Run affected Q1 and unified Java contracts
        shell: bash
        working-directory: forge
        run: |
          set -euo pipefail
          CP='forge-gui/target/test-classes:forge-gui/target/classes:forge-game/target/classes:forge-core/target/classes:forge-ai/target/classes'
          java -cp "$CP" forge.gamemodes.match.input.ExternalDecisionValidatorContractTest \
            | tee ../evidence/q1-decision-validator-regression.log
          grep -Fx 'JAVA_EXTERNAL_DECISION_CONTRACT=PASS' ../evidence/q1-decision-validator-regression.log
          java -cp "$CP" forge.gamemodes.match.input.Ws12FailureSemanticsContractTest \
            | tee ../evidence/ws12-java-contract.log
          grep -Fx 'WS12_JAVA_FAILURE_SEMANTICS=PASS' ../evidence/ws12-java-contract.log

      - name: Materialize fail-closed gate
        shell: bash
        run: |
          set -euo pipefail
          source evidence/provenance.env
          python3 qual/research/greenfield-qualification/failure-semantics/qualify.py \
            --source-head "$source_head" --source-tree "$source_tree" \
            --forge-root forge \
            --out evidence/FAILURE_SEMANTICS_GATE.json \
            --md-out evidence/FAILURE_SEMANTICS_GATE.md \
            | tee evidence/failure-semantics-gate.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('evidence/FAILURE_SEMANTICS_GATE.json').read_text())
          assert gate['FAILURE_SEMANTICS'] == 'FAIL_INCOMPLETE'
          assert gate['status'] == 'FAIL'
          assert gate['production_reachable_untyped_failure_outcomes'] is None
          assert gate['production_reachable_fallback_failure_handling'] is None
          assert len(gate['unbound_production_categories']) == 7
          assert gate['hard_gate_values']['ALL_PRODUCTION_REACHABLE_CATEGORIES_BOUND_TO_ACTUAL_ADAPTERS'] is False
          PY

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence/hashes.sha256 || true

      - name: Upload WS12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws12-unified-failure-semantics
          path: evidence
          if-no-files-found: error
