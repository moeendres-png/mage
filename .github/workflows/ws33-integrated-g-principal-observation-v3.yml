name: WS33 integrated G principal observation v3

on:
  push:
    branches: [work/ws33-integrated-closure-20260831]
    paths:
      - '.github/workflows/ws33-integrated-g-principal-observation-v3.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-input-confirm.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-observation-fanout.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_instrument_g_principal_observations.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_ability_harness.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_g_principal_observation.py'
      - 'research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  G_STRICT_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  G_STRICT_ARTIFACT_ID: '9803814288'
  G_STRICT_ARTIFACT_DIGEST: sha256:493f3549b6483d4fea9644f3a0216deb108a9ac581b651ff3e083499bcb14b5a
  GENERATION2_BASE_HEAD: 991486fd012463d29173a9aba15ebb3296d64dda
  GENERATION2_BASE_TREE: c8ba229cf428973bd7711844563987d69517b5b8
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33

jobs:
  g-principal-observation-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout integrated successor
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Verify exact ancestry and scoped ownership
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$G_STRICT_SOURCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$GENERATION2_BASE_HEAD" "$GITHUB_SHA"
          test "$(git rev-parse "$GENERATION2_BASE_HEAD^{tree}")" = "$GENERATION2_BASE_TREE"
          bad="$(git diff --name-only "$GENERATION2_BASE_HEAD" "$GITHUB_SHA" | grep -Ev '^(.github/workflows/ws33-|research/greenfield-qualification/actual-card-behavior/ws33/|research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py|research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java)' || true)"
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }

      - name: Verify immutable green direct-G case source
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/strict-input generated/record generated/replay generated/diagnostic generated/overlay-logs
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$G_STRICT_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$G_STRICT_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$G_STRICT_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$G_STRICT_ARTIFACT_ID/zip" > g-strict.zip
          unzip -q g-strict.zip -d generated/strict-input
          jq -e '.schema=="commander-simulator-next.ws33-g-ability-diagnostic.v4" and .status=="PASS" and .failure_count==0 and .expected_paths==28 and .coverage_mutated==false' generated/strict-input/diagnostic/WS33_G_ABILITY_DIAGNOSTIC.json
          cp generated/strict-input/g-ability-cases.tsv generated/g-ability-cases.tsv
          python - <<'PY'
          from pathlib import Path
          rows=[x for x in Path('generated/g-ability-cases.tsv').read_text().splitlines() if x.strip()]
          assert len(rows)==28
          assert len({r.split('\t')[1] for r in rows})==28
          print('WS33_G_OBSERVATION_V3_CASE_SOURCE=PASS paths=28')
          PY

      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1
      - name: Checkout WS01
        uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - name: Checkout WS12
        uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - name: Checkout WS32
        uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - name: Checkout historical WS31 harness only
        uses: actions/checkout@v4
        with:
          repository: moeendres-png/mage
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"

      - name: Apply current rules and pilot-boundary overlays
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-observation-fanout.py" --forge-root forge | tee generated/overlay-logs/ws33-observation-fanout.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log
          grep -F 'WS33_OBSERVATION_FANOUT=PASS' generated/overlay-logs/ws33-observation-fanout.log
          grep -F 'WS33_TEMP_SHOW_REMOTE_OBSERVATION=PRINCIPAL_SCOPED_DELTA' generated/overlay-logs/ws33-observation-fanout.log
          grep -F 'WS33_TEMP_SHOW_DECISION_POLICY=UNCHANGED' generated/overlay-logs/ws33-observation-fanout.log

      - name: Prepare production-routed direct-G harness
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GAbilityQualificationTest.java
          python "$ROOT/ws33_prepare_g_ability_harness.py" --source "$src" --out "$dst"
          python "$ROOT/ws33_instrument_g_principal_observations.py" --harness "$dst"
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          grep -F 'ExternalObservationTrace.setPath(spec.pathId)' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Fresh record execution
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GAbilityQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/g-ability-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          test -s generated/record/case-summary.tsv
          test -s generated/record/PRINCIPAL_OBSERVATIONS.jsonl

      - name: Fresh tape-driven replay execution
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GAbilityQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/g-ability-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/case-summary.tsv
          test -s generated/replay/PRINCIPAL_OBSERVATIONS.jsonl

      - name: Strict source-profile principal-observation adjudication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_adjudicate_g_principal_observation.py" \
            --cases generated/g-ability-cases.tsv \
            --record-dir generated/record \
            --replay-dir generated/replay \
            --out generated/diagnostic/WS33_G_PRINCIPAL_OBSERVATION.json \
            --source-case-artifact-id "$G_STRICT_ARTIFACT_ID"
          jq -e '.schema=="commander-simulator-next.ws33-g-principal-observation.v3" and .status=="PASS" and .failure_count==0 and .expected_paths==28' generated/diagnostic/WS33_G_PRINCIPAL_OBSERVATION.json

      - name: Upload immutable G principal observation v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g-principal-observation-v3-${{ github.run_id }}
          path: |
            generated/diagnostic/
            generated/g-ability-cases.tsv
            generated/record/
            generated/replay/
            generated/overlay-logs/
          if-no-files-found: error
