name: WS33 G3 SVar AF parent runtime

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-g3-svar-af-runtime.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_svar_af_cases.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_svar_af_harness.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  BEHAVIOR_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007
  TOPOLOGY_ARTIFACT_ID: '9866293827'
  TOPOLOGY_ARTIFACT_DIGEST: sha256:6a41f66937b4bf1bcf782045d869ece183c0be49b345eac654dc3588cb98b96b
  MODEL_SHA: cd48f4279d682ab944e2534bf937d87e5311e83989e97179ae73c5c7d1bb6224

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout G3 tooling
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Download exact green SVar topology
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/topology generated/record generated/overlay-logs generated/diagnostic
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$TOPOLOGY_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$TOPOLOGY_ARTIFACT_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$TOPOLOGY_ARTIFACT_ID/zip" > generated/topology.zip
          test "sha256:$(sha256sum generated/topology.zip | cut -d' ' -f1)" = "$TOPOLOGY_ARTIFACT_DIGEST"
          unzip -q generated/topology.zip -d generated/topology
          jq -e --arg model "$MODEL_SHA" '.status=="PASS" and .effective_model_sha256==$model and .g_unknown_count==81 and .direct_g_count==28 and .remaining_svar_count==53 and (.unresolved_parent_paths|length)==0' generated/topology/G_SVAR_CONSUMER_TOPOLOGY.json
          python "$ROOT/ws33_prepare_g_svar_af_cases.py" --topology generated/topology/G_SVAR_CONSUMER_TOPOLOGY.json --out generated/g-svar-af-cases.tsv
          test "$(wc -l < generated/g-svar-af-cases.tsv)" -eq 21

      - name: Checkout pinned Forge and retained dependencies
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1
      - uses: actions/checkout@v4
        with: {ref: '${{ env.BEHAVIOR_SOURCE_HEAD }}', path: behavior-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact pins
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C behavior-source rev-parse HEAD)" = "$BEHAVIOR_SOURCE_HEAD"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"

      - name: Apply exact green runtime overlay stack
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python behavior-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp behavior-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python behavior-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python behavior-source/$ROOT/runtime-overlays/apply-ws33-input-confirm.py --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python behavior-source/$ROOT/runtime-overlays/apply-ws33-stack-target.py --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log

      - name: Prepare source-parent stack harness
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GSVarAfQualificationTest.java
          python behavior-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$dst"
          python "$ROOT/ws33_prepare_g_svar_af_harness.py" --harness "$dst"
          python "$ROOT/ws33_instrument_g_authoritative_requests.py" --harness "$dst"
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'sa.setupTargets()' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Execute 21 source-proven AF parents
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GSVarAfQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/g-svar-af-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" \
            -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) \
            2>&1 | tee generated/record/runtime.log
          test "$(wc -l < generated/record/case-summary.tsv)" -eq 21
          python - <<'PY'
          from pathlib import Path
          rows=[line.split('\t') for line in Path('generated/record/case-summary.tsv').read_text().splitlines() if line]
          assert len(rows)==21,len(rows)
          bad=[(r[0],r[4],r[14],r[15]) for r in rows if len(r)<20 or r[4] != 'PASS' or r[18] != '1' or r[19] != '1']
          if bad: raise SystemExit('WS33_G_SVAR_AF_RUNTIME=FAIL '+repr(bad))
          print('WS33_G_SVAR_AF_RUNTIME=PASS paths=21 stack_admission=21 stack_resolution=21 coverage_mutated=FALSE')
          PY

      - name: Upload diagnostic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g3-svar-af-runtime-${{ github.run_id }}
          path: |
            generated/topology/G_SVAR_CONSUMER_TOPOLOGY.json
            generated/g-svar-af-cases.tsv
            generated/record
            generated/diagnostic
            generated/overlay-logs
          if-no-files-found: error
          retention-days: 90
