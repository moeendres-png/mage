name: WS33 integrated closure

on:
  push:
    branches: [work/ws33-integrated-closure-20260831]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CURRENT_PREDECESSOR_HEAD: 4596a58287ccd0f2b432ebeca2b4fd0d8bec4df3
  CURRENT_PREDECESSOR_TREE: 422beaa5199305efb933f5866207ff2338841a93
  CURRENT_PREDECESSOR_RUN_ID: '33414000812'
  CURRENT_PREDECESSOR_JOB_ID: '99560193066'
  CURRENT_PREDECESSOR_ARTIFACT_ID: '9766400471'
  CURRENT_PREDECESSOR_ARTIFACT_DIGEST: sha256:a28834e59b86468dc8855c5db5b1f433cfa17b5eded2bc4061092566f95f4372
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33

jobs:
  integrated-frontier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integrated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact current predecessor and scoped ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CURRENT_PREDECESSOR_HEAD"
          test "$(git rev-parse "$CURRENT_PREDECESSOR_HEAD^{tree}")" = "$CURRENT_PREDECESSOR_TREE"
          git merge-base --is-ancestor "$CURRENT_PREDECESSOR_HEAD" "$GITHUB_SHA"
          bad="$(git diff --name-only "$CURRENT_PREDECESSOR_HEAD" "$GITHUB_SHA" | grep -Ev '^(.github/workflows/ws33-|research/greenfield-qualification/actual-card-behavior/ws33/|research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py)' || true)"
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }

      - name: Download exact immutable current successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_PREDECESSOR_ARTIFACT_ID" --jq '.digest')"
          test "$actual" = "$CURRENT_PREDECESSOR_ARTIFACT_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_PREDECESSOR_ARTIFACT_ID/zip" > predecessor.zip
          mkdir -p generated/predecessor generated/current
          unzip -q predecessor.zip -d generated/predecessor

      - name: Materialize sole current operational frontier
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_materialize_current_operational_state.py" \
            --artifact-root generated/predecessor \
            --out generated/current/WS33_CURRENT_OPERATIONAL_STATE.json \
            --source-head "$CURRENT_PREDECESSOR_HEAD" \
            --source-tree "$CURRENT_PREDECESSOR_TREE" \
            --run-id "$CURRENT_PREDECESSOR_RUN_ID" \
            --job-id "$CURRENT_PREDECESSOR_JOB_ID" \
            --artifact-id "$CURRENT_PREDECESSOR_ARTIFACT_ID" \
            --artifact-digest "$CURRENT_PREDECESSOR_ARTIFACT_DIGEST"
          jq -e '
            .classification == "DIRECTLY_VERIFIED_IMMUTABLE_SUCCESSOR" and
            .effective_path_count == ([.path_status_counts[]] | add) and
            .path_status_counts.FAIL == 0 and
            .path_status_counts.UNSUPPORTED == 0 and
            .path_status_counts.UNKNOWN == ([.unknown_by_shard[]] | add) and
            .predecessor.source_head == env.CURRENT_PREDECESSOR_HEAD and
            .predecessor.source_tree == env.CURRENT_PREDECESSOR_TREE and
            .predecessor.artifact_id == env.CURRENT_PREDECESSOR_ARTIFACT_ID and
            .predecessor.artifact_digest == env.CURRENT_PREDECESSOR_ARTIFACT_DIGEST
          ' generated/current/WS33_CURRENT_OPERATIONAL_STATE.json

      - name: Checkout exact pinned Forge for requirement projection audit
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge-requirement-audit
          fetch-depth: 1

      - name: Audit path-local evidence requirement projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge-requirement-audit rev-parse HEAD)" = "$FORGE_PIN"
          python "$ROOT/ws33_requirement_projection_audit.py" \
            --manifest generated/predecessor/ws33/WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json \
            --coverage generated/predecessor/ws33/WS33_PATH_COVERAGE.json \
            --forge-root forge-requirement-audit \
            --out generated/current/WS33_REQUIREMENT_PROJECTION_AUDIT.json
          expected_effective="$(jq -r .effective_path_count generated/current/WS33_CURRENT_OPERATIONAL_STATE.json)"
          expected_unknown="$(jq -r .path_status_counts.UNKNOWN generated/current/WS33_CURRENT_OPERATIONAL_STATE.json)"
          jq -e --argjson expected_effective "$expected_effective" --argjson expected_unknown "$expected_unknown" '
            .status == "PASS" and
            .effective_path_count == $expected_effective and
            .unknown_path_count == $expected_unknown and
            .pass_upgrade_candidate_count == 0 and
            .disposition == "AUDIT_ONLY_NO_MANIFEST_MUTATION"
          ' generated/current/WS33_REQUIREMENT_PROJECTION_AUDIT.json

      - name: Upload immutable integrated frontier evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws33-current-operational-state-${{ github.run_id }}
          path: generated/current
          if-no-files-found: error
          retention-days: 90
