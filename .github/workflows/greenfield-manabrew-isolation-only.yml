name: Greenfield Manabrew isolation-only qualification

on:
  push:
    branches:
      - research/greenfield-engine-shootout-20260827
    paths:
      - '.github/workflows/greenfield-manabrew-isolation-only.yml'

permissions:
  contents: read

jobs:
  isolation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: witchesofthehill/manabrew
          ref: 754ec2aeec495d67d7bb9b89d0fd67ee22281b46
          path: manabrew
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            manabrew/pom.xml
            manabrew/forge/pom.xml
            manabrew/forge-harness/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact pins and build runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C manabrew rev-parse HEAD)" = 754ec2aeec495d67d7bb9b89d0fd67ee22281b46
          test "$(git -C manabrew/forge rev-parse HEAD)" = 192b5eab000069bbb8917a5df9d60d4a9128aa07
          mkdir -p artifacts/manabrew-isolation-only
          (cd manabrew && node scripts/harness.mjs ensure) > artifacts/manabrew-isolation-only/harness-build.log 2>&1
          (cd manabrew && cargo build -p self-hosted-node --features java-forge --locked) > artifacts/manabrew-isolation-only/node-build.log 2>&1
      - name: Concurrent two-game 4P process/isolation probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd manabrew && \
            SELF_HOSTED_NODE_JAVA_CONCURRENT_GAMES=2 \
            SELF_HOSTED_NODE_SELF_PLAY_FORMAT=Commander \
            SELF_HOSTED_NODE_SELF_PLAY_PLAYERS=4 \
            SELF_HOSTED_NODE_SELF_PLAY_SEED=777777 \
            SELF_HOSTED_NODE_SELF_PLAY_DECKS='ashling_limitless_commander,neheb_minotaur_commander,kaalia_regression_commander' \
            SELF_HOSTED_NODE_JAVA_SELF_PLAY_PROMPTS=3000 \
            SELF_HOSTED_NODE_JAVA_GC_LOG='' \
            RUST_LOG=self_hosted_node=info \
            timeout 420s ./target/debug/self-hosted-node) > artifacts/manabrew-isolation-only/concurrent-4p.log 2>&1
          rc=$?
          set -e
          echo "$rc" > artifacts/manabrew-isolation-only/concurrent-4p.exit
          test "$rc" -eq 0
      - name: Exact-pin fail-closed source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('manabrew')
          controller=(root/'forge-harness/src/main/java/forge/harness/host/ManaBrewInteractiveController.java').read_text()
          session=(root/'forge-harness/src/main/java/forge/harness/host/ManaBrewInteractiveSession.java').read_text()
          agent=(root/'manabrew-rs/crates/manabrew-agent-interface/src/agent_impl/mod.rs').read_text()
          items=[]
          def add(code,present,evidence): items.append({'code':code,'present':bool(present),'evidence':evidence})
          add('TARGET_FIRST_FALLBACK', 'chosen.isEmpty() ? 0 : chosen.get(0)' in controller and 'allTargets.get(0)' in controller, 'empty/invalid multi-target choice can resolve to first target')
          add('DISCARD_FIRST_N_FALLBACK', 'guard++ < 512' in controller and 'subList(0, max)' in controller, 'retry guard ends in first-N discard')
          add('REPLACEMENT_FIRST_FALLBACK', 'chooseSingleReplacementEffect' in controller and 'possibleReplacers.get(0)' in controller and 'chosen.isEmpty() ? 0 : chosen.get(0)' in controller, 'replacement chooser can select first on empty/invalid choice')
          add('STATIC_FIRST_FALLBACK', 'chooseSingleStaticAbility' in controller and 'possibleReplacers.get(0)' in controller, 'static ability chooser selects first')
          add('INTERNAL_RANDOM_TARGET_RNG', 'tr.isRandomTarget()' in controller and 'Aggregates.random(candidates)' in controller, 'random target chosen by controller/global RNG, not explicit RNG tape')
          add('PROMPT0_DEFAULT_PASS', 'prompt_id: 0' in agent and 'return Self::default_pass()' in agent, 'agent maps prompt_id 0 response to pass')
          add('INTERRUPT_PRIORITY_PASS', 'InterruptedException' in session and 'PriorityActionKind.PASS' in session, 'interrupted priority wait returns pass')
          present=[x for x in items if x['present']]
          out={'candidate':'manabrew-forge-interactive','manabrew_pin':'754ec2aeec495d67d7bb9b89d0fd67ee22281b46','forge_pin':'192b5eab000069bbb8917a5df9d60d4a9128aa07','findings':items,'forbidden_fallback_count':len(present),'silent_fallbacks_zero':len(present)==0,'production_decision_gate':'FAIL' if present else 'INSUFFICIENT_EVIDENCE'}
          Path('artifacts/manabrew-isolation-only/fail-closed-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          cd artifacts/manabrew-isolation-only
          find . -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > hashes.sha256 || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-manabrew-isolation-only
          path: artifacts/manabrew-isolation-only
          if-no-files-found: error
