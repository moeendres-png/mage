name: WS33 integrated G direct-ABILITY diagnostic

on:
  push:
    branches: [work/ws33-integrated-closure-20260831]
    paths:
      - '.github/workflows/ws33-integrated-g-ability-diagnostic.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_g_ability_harness.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-target-selection.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-tests/Ws33TargetSelectionExternalizationTest.java'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/WS33_POST_GEN2_CLOSURE_INTELLIGENCE_AUDIT_*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g-ability-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      H_COMPLETE_SOURCE_HEAD: 4596a58287ccd0f2b432ebeca2b4fd0d8bec4df3
      H_COMPLETE_ARTIFACT_ID: '9766400471'
      H_COMPLETE_ARTIFACT_DIGEST: sha256:a28834e59b86468dc8855c5db5b1f433cfa17b5eded2bc4061092566f95f4372
      GENERATION2_BASE_HEAD: 991486fd012463d29173a9aba15ebb3296d64dda
      GENERATION2_BASE_TREE: c8ba229cf428973bd7711844563987d69517b5b8
      FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
      WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
      WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
      WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
      WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007
      ROOT: research/greenfield-qualification/actual-card-behavior/ws33
    steps:
      - name: Checkout integrated successor
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify immutable ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$H_COMPLETE_SOURCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$GENERATION2_BASE_HEAD" "$GITHUB_SHA"
          test "$(git rev-parse "$GENERATION2_BASE_HEAD^{tree}")" = "$GENERATION2_BASE_TREE"
      - name: Download H-complete frontier
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$H_COMPLETE_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$H_COMPLETE_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$H_COMPLETE_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$H_COMPLETE_ARTIFACT_ID/zip" > h.zip
          mkdir -p generated/input generated/record generated/replay generated/diagnostic
          unzip -q h.zip -d generated/input
          test -d generated/input/ws33
          mv generated/input/ws33 generated/ws33
          python - <<'PY'
          import hashlib,json
          from collections import Counter
          from pathlib import Path
          root=Path('generated/ws33')
          for line in (root/'WS33_HASHES.sha256').read_text().splitlines():
              want,rel=line.split('  ',1); got=hashlib.sha256((root/rel).read_bytes()).hexdigest(); assert got==want,(rel,want,got)
          m=json.loads((root/'WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json').read_text())
          c=json.loads((root/'WS33_PATH_COVERAGE.json').read_text())
          st={r['effective_v2_path_id']:r['status'] for r in c['paths']}
          counts=Counter(st.values()); assert counts==Counter({'UNKNOWN':3903,'PASS':285}),counts
          g=[p for p in m['paths'] if p['owner_family']=='HIDDEN_RNG_REPLAY']
          assert Counter(st[p['v2_path_id']] for p in g)==Counter({'UNKNOWN':81})
          direct=[p for p in g if st[p['v2_path_id']]=='UNKNOWN' and {x['source_directive'] for x in p['source_provenance']}=={'ABILITY'}]
          assert len(direct)==28,len(direct)
          print('WS33_G_INPUT=PASS paths=4188 PASS=285 UNKNOWN=3903 G_UNKNOWN=81 G_DIRECT_ABILITY=28 internal_hashes=TRUE')
          PY
      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1
      - name: Checkout retained WS01
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - name: Checkout retained WS12
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - name: Checkout retained WS32
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - name: Checkout historical WS31 harness infrastructure only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
      - name: Verify exact pins
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"
      - name: Apply Generation-2 production overlay stack
        run: |
          set -euo pipefail
          mkdir -p generated/overlay-logs
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log
      - name: Materialize exact current 28 direct-ABILITY cases from Gen2 plus pinned Forge
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,re
          from pathlib import Path
          manifest=json.loads(Path('generated/ws33/WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json').read_text())
          coverage=json.loads(Path('generated/ws33/WS33_PATH_COVERAGE.json').read_text())
          st={r['effective_v2_path_id']:r['status'] for r in coverage['paths']}
          direct=[p for p in manifest['paths'] if p['owner_family']=='HIDDEN_RNG_REPLAY' and st[p['v2_path_id']]=='UNKNOWN' and {x['source_directive'] for x in p['source_provenance']}=={'ABILITY'}]
          direct.sort(key=lambda p:p['v2_path_id'])
          assert len(direct)==28,len(direct)
          rows=[]
          ids=set()
          for ordinal,p in enumerate(direct,1):
              pid=p['v2_path_id']; assert pid not in ids; ids.add(pid)
              prov=sorted(p['source_provenance'],key=lambda x:(x['forge_source_path'],int(x['source_line']),x['oracle_identity']))[0]
              assert prov['source_directive']=='ABILITY'
              src=Path('forge')/prov['forge_source_path']; assert src.is_file(),src
              lines=src.read_text(encoding='utf-8').splitlines(); ln=int(prov['source_line']); assert 1<=ln<=len(lines),(pid,ln)
              raw=lines[ln-1]
              assert ':' in raw,(pid,raw)
              script=raw.split(':',1)[1].strip()
              token=prov['source_token']; assert script.startswith(token),(pid,token,script)
              m=re.search(r'(?:^|\s\|\s)(?:AB|SP|DB)\$\s*([^|]+)',script); assert m,(pid,script)
              assert m.group(1).strip()==p['dispatch_token'],(pid,m.group(1).strip(),p['dispatch_token'])
              name=next((x.split(':',1)[1].strip() for x in lines if x.startswith('Name:')),None); assert name,(pid,src)
              oid=prov['oracle_identity']; assert oid in p['representative_actual_oracle_identities'],(pid,oid)
              fields=[ordinal,pid,oid,name,p['dispatch_token'],p['implementation_target'],prov['forge_source_path'],ln,prov['source_directive'],token,int(p['required_hidden_info_evidence']),int(p['required_rng_evidence']),int(p['required_replay_evidence']),int(p['required_decision_evidence']),base64.b64encode(script.encode()).decode()]
              rows.append('\t'.join(map(str,fields)))
          Path('generated/g-ability-cases.tsv').write_text('\n'.join(rows)+'\n')
          Path('generated/diagnostic/G_DIRECT_ABILITY_PATH_IDS.txt').write_text('\n'.join(sorted(ids))+'\n')
          print('WS33_G_ABILITY_CASES=PASS paths=28 source=CURRENT_GEN2_PLUS_PINNED_FORGE historical_pass_reused=0')
          PY
      - name: Prepare admissible G harness
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GAbilityQualificationTest.java
          python "$ROOT/ws33_prepare_g_ability_harness.py" --source "$src" --out "$dst"
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'getStack().add(sa)' "$dst"
          grep -F 'actor.getController().chooseTargetsFor(sa)' "$dst"
          cp "$ROOT/runtime-tests/Ws33TargetSelectionExternalizationTest.java" \
            forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Fresh Gen2 record execution
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.gamesimulationtests.Ws33TargetSelectionExternalizationTest,forge.net.Ws33GAbilityQualificationTest -Dws31.cases="$GITHUB_WORKSPACE/generated/g-ability-cases.tsv" -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          java -cp forge/forge-gui/target/test-classes:forge/forge-gui/target/classes \
            forge.gamemodes.match.input.ExternalDecisionValidatorContractTest \
            | tee generated/record/validator-contract.log
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -s generated/record/rng-tape.tsv
      - name: Fresh tape-driven replay execution
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.net.Ws33GAbilityQualificationTest -Dws31.cases="$GITHUB_WORKSPACE/generated/g-ability-cases.tsv" -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" -Dws31.mode=replay -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/record/decision-tape.tsv" -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/record/rng-tape.tsv" -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/case-summary.tsv
      - name: Adjudicate diagnostic only
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          def rows(p):
              if not Path(p).is_file(): return []
              return [x.split('\t') for x in Path(p).read_text().splitlines() if x.strip()]
          rec=rows('generated/record/case-summary.tsv'); rep=rows('generated/replay/case-summary.tsv')
          out={'schema':'commander-simulator-next.ws33-g-ability-diagnostic.v2','coverage_mutated':False,'historical_pass_status_reused':False,'case_source':'CURRENT_GEN2_PLUS_PINNED_FORGE','expected_paths':28,'record_rows':len(rec),'replay_rows':len(rep),'record_status':dict(Counter(x[4] for x in rec)),'replay_status':dict(Counter(x[4] for x in rep)),'record_private_leak_paths':sum(int(x[9])>0 or int(x[10])>0 for x in rec),'replay_private_leak_paths':sum(int(x[9])>0 or int(x[10])>0 for x in rep),'record_missing_decision_paths':sum(int(x[7])==0 for x in rec),'record_missing_rng_paths':sum(int(x[8])==0 for x in rec)}
          Path('generated/diagnostic/WS33_G_ABILITY_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload immutable G diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g-ability-diagnostic-${{ github.run_id }}
          path: |
            generated/diagnostic/
            generated/g-ability-cases.tsv
            generated/record/
            generated/replay/
            generated/overlay-logs/
          if-no-files-found: error
