name: WS33 G3 ABI request evidence

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-integrated-g-abi-request-evidence.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_g_abi_request_evidence.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/test_ws33_adjudicate_g_abi_request_evidence.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-target-selection.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-tests/Ws33TargetSelectionExternalizationTest.java'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  BEHAVIOR_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  BEHAVIOR_SOURCE_TREE: 857dc01e04f58ca59437e08710bcb194bf030ea4
  BEHAVIOR_ARTIFACT_ID: '9803814288'
  BEHAVIOR_ARTIFACT_DIGEST: sha256:493f3549b6483d4fea9644f3a0216deb108a9ac581b651ff3e083499bcb14b5a
  MODEL_SOURCE_HEAD: c5d6cb8f4831e61b4ee8a1176ccbe4f6b98479ea
  MODEL_ARTIFACT_ID: '9823383539'
  MODEL_ARTIFACT_DIGEST: sha256:aab73ba2ede151bbd0b803c2164d3067ddd65f17d49cf655c34eef67d903595d
  MODEL_SHA: cd48f4279d682ab944e2534bf937d87e5311e83989e97179ae73c5c7d1bb6224
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  request-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current qualification tooling
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Download exact immutable model and behavior evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/model generated/source generated/record generated/replay generated/diagnostic generated/overlay-logs

          bmeta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BEHAVIOR_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$bmeta")" = "$BEHAVIOR_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$bmeta")" = "$BEHAVIOR_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$BEHAVIOR_ARTIFACT_ID/zip" > generated/behavior.zip
          test "sha256:$(sha256sum generated/behavior.zip | cut -d' ' -f1)" = "$BEHAVIOR_ARTIFACT_DIGEST"
          unzip -q generated/behavior.zip -d generated/source
          test -s generated/source/g-ability-cases.tsv
          jq -e '.schema=="commander-simulator-next.ws33-g-ability-diagnostic.v4" and .status=="PASS" and .expected_paths==28 and .failure_count==0 and .record_rows==28 and .record_status.PASS==28 and .replay_rows==28 and .replay_status.PASS==28 and .stack_admission_required==true and .stack_resolution_required==true and .semantic_replay_equality_required_for_observed_decision_or_rng==true and .requirements_are_minimum_evidence_obligations==true and .coverage_mutated==false' generated/source/diagnostic/WS33_G_ABILITY_DIAGNOSTIC.json

          mmeta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$mmeta")" = "$MODEL_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.head_sha <<<"$mmeta")" = "$MODEL_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$MODEL_ARTIFACT_ID/zip" > generated/model.zip
          test "sha256:$(sha256sum generated/model.zip | cut -d' ' -f1)" = "$MODEL_ARTIFACT_DIGEST"
          unzip -q generated/model.zip -d generated/model
          if test -d generated/model/output/ws33; then
            mv generated/model/output/ws33 generated/model/ws33
          fi
          test -d generated/model/ws33
          test "$(sha256sum generated/model/ws33/WS33_EFFECTIVE_BEHAVIOR_PATH_MANIFEST.json | cut -d' ' -f1)" = "$MODEL_SHA"
          jq -e '.status_counts.PASS==285 and .status_counts.UNKNOWN==3903' generated/model/ws33/WS33_PATH_COVERAGE.json

      - name: Checkout exact green behavior source and retained dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BEHAVIOR_SOURCE_HEAD }}
          path: behavior-source
          fetch-depth: 1
      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1
      - name: Checkout retained WS01
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - name: Checkout retained WS12
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - name: Checkout retained WS32
        uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - name: Checkout historical WS31 harness infrastructure only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Verify exact source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C behavior-source rev-parse HEAD)" = "$BEHAVIOR_SOURCE_HEAD"
          test "$(git -C behavior-source rev-parse 'HEAD^{tree}')" = "$BEHAVIOR_SOURCE_TREE"
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          test "$(git -C ws31-historical rev-parse HEAD)" = "$WS31_HIST_HEAD"

      - name: Apply exact green behavior runtime overlay stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python behavior-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp behavior-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python behavior-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python behavior-source/$ROOT/runtime-overlays/apply-ws33-input-confirm.py --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python behavior-source/$ROOT/runtime-overlays/apply-ws33-stack-target.py --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log

      - name: Prepare exact green harness plus observer-only request trace
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33GAbilityQualificationTest.java
          python behavior-source/$ROOT/ws33_prepare_g_ability_harness.py --source "$src" --out "$dst"
          python "$ROOT/ws33_instrument_g_authoritative_requests.py" --harness "$dst"
          cp "$ROOT/runtime-tests/Ws33TargetSelectionExternalizationTest.java" forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          grep -F 'decision-requests-with-path.tsv' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/instrumented-harness.sha256

      - name: Verify G ABI adjudicator regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest "$ROOT/test_ws33_adjudicate_g_abi_request_evidence.py"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Supplemental record capture
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.gamesimulationtests.Ws33TargetSelectionExternalizationTest,forge.net.Ws33GAbilityQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/source/g-ability-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" \
            -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) \
            2>&1 | tee generated/record/runtime.log
          test -s generated/record/decision-requests-with-path.tsv
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -s generated/record/rng-tape.tsv

      - name: Prove observer did not perturb immutable green record
        shell: bash
        run: |
          set -euo pipefail
          cmp generated/source/record/case-summary.tsv generated/record/case-summary.tsv
          cmp generated/source/record/decision-tape.tsv generated/record/decision-tape.tsv
          cmp generated/source/record/decision-events-with-path.tsv generated/record/decision-events-with-path.tsv
          cmp generated/source/record/rng-tape.tsv generated/record/rng-tape.tsv
          cmp generated/source/record/rng-events-with-path.tsv generated/record/rng-events-with-path.tsv
          echo 'WS33_G_REQUEST_TRACE_RECORD_NONPERTURBATION=PASS'

      - name: Supplemental replay capture using immutable green tapes
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33GAbilityQualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/source/g-ability-cases.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" \
            -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/source/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/source/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) \
            2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/decision-requests-with-path.tsv
          cmp generated/source/replay/case-summary.tsv generated/replay/case-summary.tsv
          cmp generated/source/replay/decision-tape.tsv generated/replay/decision-tape.tsv
          cmp generated/source/replay/decision-events-with-path.tsv generated/replay/decision-events-with-path.tsv
          cmp generated/source/replay/rng-tape.tsv generated/replay/rng-tape.tsv
          cmp generated/source/replay/rng-events-with-path.tsv generated/replay/rng-events-with-path.tsv
          cmp generated/record/decision-requests-with-path.tsv generated/replay/decision-requests-with-path.tsv
          echo 'WS33_G_REQUEST_TRACE_REPLAY_NONPERTURBATION=PASS'

      - name: Strictly adjudicate authoritative request evidence
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_adjudicate_g_abi_request_evidence.py" \
            --cases generated/source/g-ability-cases.tsv \
            --record-requests generated/record/decision-requests-with-path.tsv \
            --replay-requests generated/replay/decision-requests-with-path.tsv \
            --decision-events generated/record/decision-events-with-path.tsv \
            --decision-tape generated/record/decision-tape.tsv \
            --rng-events generated/source/record/rng-events-with-path.tsv \
            --out-dir generated/diagnostic \
            --expected-paths 28 \
            --expected-decision-paths 19 \
            --expected-rng-paths 7 \
            --behavior-artifact-id "$BEHAVIOR_ARTIFACT_ID" \
            --behavior-artifact-digest "$BEHAVIOR_ARTIFACT_DIGEST" \
            --behavior-source-head "$BEHAVIOR_SOURCE_HEAD" \
            --model-artifact-id "$MODEL_ARTIFACT_ID" \
            --effective-model-sha256 "$MODEL_SHA"
          jq -e '.status=="PASS" and .schema=="commander-simulator-next.ws33-g-abi-request-evidence.v2" and .path_count==28 and .decision_required_path_count==19 and .decision_required_paths_observed==19 and .rng_required_path_count==7 and .rng_required_paths_observed==7 and .record_replay_request_trace_equal==true and .authoritative_legal_options_captured_from_request==true and .request_identity_scope=="principal_id+token" and .hidden_identity_payload_retained==false and .coverage_mutated==false and .silent_fallback==false' generated/diagnostic/WS33_G_ABI_REQUEST_EVIDENCE.json

      - name: Upload immutable supplemental ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-g3-abi-request-evidence-${{ github.run_id }}
          path: |
            generated/diagnostic
            generated/record
            generated/replay
            generated/overlay-logs
          if-no-files-found: error
          retention-days: 90
