name: WS33-C AbilitySub pilot (production-parent witness)

on:
  push:
    branches: [work/ws33-c-high-throughput-20260907]
    paths:
      - '.github/workflows/ws33-c-abilitysub-pilot.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/c-campaign/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  CCAMPAIGN: research/greenfield-qualification/actual-card-behavior/ws33/c-campaign
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  C_MANIFEST_SHA256: b47510017fbfd5cae478917c37f83c1a41e73095eb49a2fa9ecb43360c809ca4
  C_QUEUE_SHA256: a88842375e5e91894acb238c6306a60760dc77d0f098e5dbbd2069e2dbca1482

jobs:
  c-abilitysub-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact current WS33-C source
        uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Verify owned C manifest binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$CCAMPAIGN/WS33_C_UNKNOWN_MANIFEST.json" | cut -d' ' -f1)" = "$C_MANIFEST_SHA256"
          test "$(sha256sum "$CCAMPAIGN/WS33_C_CLUSTER_QUEUE.json" | cut -d' ' -f1)" = "$C_QUEUE_SHA256"
          python -m py_compile "$CCAMPAIGN/ws33_derive_c_manifest.py" "$CCAMPAIGN/ws33_prepare_abilitysub_campaign.py" "$CCAMPAIGN/ws33_certify_abilitysub_pilot.py"
          python "$CCAMPAIGN/ws33_certify_abilitysub_pilot.py" --self-test
          python - <<'PY'
          import json
          m=json.load(open('research/greenfield-qualification/actual-card-behavior/ws33/c-campaign/WS33_C_UNKNOWN_MANIFEST.json'))
          assert m['owned_path_count']==700 and len(m['paths'])==700
          assert m['forge_pin']=='8c7e9afb8e6caee88644b94e25da5852e36f8928'
          print('WS33_C_MANIFEST_BINDING=PASS owned=700')
          PY

      - name: Checkout pinned runtime dependencies
        uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {repository: moeendres-png/mage, ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}

      - name: Verify exact runtime pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          test "$(git -C direct-source rev-parse HEAD)" = "$DIRECT_RUNTIME_SOURCE_HEAD"
          test "$(git -C ws01 rev-parse HEAD)" = "$WS01_HEAD"
          test "$(git -C ws12 rev-parse HEAD)" = "$WS12_HEAD"
          test "$(git -C ws32 rev-parse HEAD)" = "$WS32_HEAD"
          echo WS33_C_PILOT_RUNTIME_PINS=PASS

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Apply exact Rules Decision Observation runtime stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/overlay-logs generated/campaign/pilot generated/evidence
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/campaign/pilot/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-observation-fanout.py" --forge-root forge | tee generated/overlay-logs/ws33-observation-fanout.log
          python "$ROOT/runtime-overlays/apply-ws33-external-card-decision-lifetime.py" --forge-root forge | tee generated/overlay-logs/ws33-card-decision-lifetime.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python "$ROOT/runtime-overlays/apply-ws33-svar-reachability.py" --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          grep -F 'setWs33ResolutionObserver' forge/forge-game/src/main/java/forge/game/spellability/AbilitySub.java
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log

      - name: Materialize exact pilot case set
        shell: bash
        run: |
          set -euo pipefail
          python "$CCAMPAIGN/ws33_prepare_abilitysub_campaign.py" --manifest "$CCAMPAIGN/WS33_C_UNKNOWN_MANIFEST.json" --out-tsv generated/campaign/pilot/abilitysub-cases.tsv --out-plan generated/campaign/pilot/ABILITYSUB_PILOT_PLAN.json
          test "$(grep -vc '^#' generated/campaign/pilot/abilitysub-cases.tsv)" = 1
          jq -e '.path_count==1 and (.paths|length)==1' generated/campaign/pilot/ABILITYSUB_PILOT_PLAN.json
          echo WS33_C_PILOT_MATERIALIZATION=PASS paths=1

      - name: Install current qualification test
        shell: bash
        run: |
          set -euo pipefail
          cp "$CCAMPAIGN/Ws33AbilitySubCampaignTest.java" forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/

      - name: Execute pilot Record (production-parent witness)
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.gamesimulationtests.Ws33AbilitySubCampaignTest -Dsurefire.failIfNoSpecifiedTests=false -Dws33.subCases="$GITHUB_WORKSPACE/generated/campaign/pilot/abilitysub-cases.tsv" -Dws33.subOut="$GITHUB_WORKSPACE/generated/campaign/pilot" test) 2>&1 | tee generated/overlay-logs/pilot-record-runtime.log
          test ! -s generated/campaign/pilot/abilitysub-record-diagnostics.jsonl
          test "$(find generated/campaign/pilot/records -name record-success.marker -type f | wc -l)" = 1
          echo WS33_C_PILOT_RECORD=PASS paths=1

      - name: Certify pilot evidence and seal
        shell: bash
        run: |
          set -euo pipefail
          python "$CCAMPAIGN/ws33_certify_abilitysub_pilot.py" --campaign-root generated/campaign/pilot --manifest "$CCAMPAIGN/WS33_C_UNKNOWN_MANIFEST.json" --plan generated/campaign/pilot/ABILITYSUB_PILOT_PLAN.json --out generated/evidence/WS33_C_PILOT_GATE.json
          cp generated/campaign/pilot/ABILITYSUB_PILOT_PLAN.json generated/campaign/pilot/abilitysub-cases.tsv generated/campaign/pilot/abilitysub-record-diagnostics.jsonl generated/evidence/
          cp -R generated/campaign/pilot/records generated/evidence/
          cp generated/overlay-logs/pilot-record-runtime.log generated/evidence/
          printf '%s\n' "$GITHUB_SHA" > generated/evidence/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/evidence/workflow-source-tree.txt
          cd generated/evidence
          find . -type f ! -name WS33_C_PILOT_HASHES.sha256 -print0 | sort -z | xargs -0 sha256sum > WS33_C_PILOT_HASHES.sha256
          sha256sum -c WS33_C_PILOT_HASHES.sha256

      - name: Upload immutable pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-c-abilitysub-pilot-${{ github.run_id }}
          path: generated
          if-no-files-found: error
          retention-days: 90
