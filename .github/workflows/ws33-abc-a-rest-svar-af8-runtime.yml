name: WS33 ABC A-rest SVar AF8 runtime

on:
  push:
    branches: [work/ws33-g3-final-closure-20260902]
    paths:
      - '.github/workflows/ws33-abc-a-rest-svar-af8-runtime.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adapt_g_svar_af_harness_to_a_af8.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_decision_path_evidence.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/test_ws33_decision_path_evidence.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_harden_a_rest_svar_af8_runtime.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_a_rest_svar_af8.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-stack-resolution-reachability.py'
      - 'research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-a-rest-play-stage-observer.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ROOT: research/greenfield-qualification/actual-card-behavior/ws33
  FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
  ROUTE_RUN_ID: '34063748962'
  ROUTE_ARTIFACT_ID: '9998291348'
  ROUTE_ARTIFACT_DIGEST: sha256:646594434eb987009561127f012bd0d974dcec97e67bef0bf478294f1fd9d0e9
  ROUTE_SOURCE_HEAD: 48cb9a018f606f1209d14ee587a6ff3f14d263a1
  DIRECT_RUNTIME_SOURCE_HEAD: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
  WS01_HEAD: bf089ea806f54a9bbb64ede205915729e3629684
  WS12_HEAD: 80743bdbc2950b00e422f3deb38f04111f30a4d4
  WS32_HEAD: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
  WS31_HIST_HEAD: b09fe7c16845cddbbfe30fd1f855b59234bbf007

jobs:
  af8:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout frozen qualification source
        uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - name: Validate AF8 parser hardener and adjudicator source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "$ROOT/ws33_decision_path_evidence.py" \
            "$ROOT/ws33_harden_a_rest_svar_af8_runtime.py" \
            "$ROOT/ws33_adjudicate_a_rest_svar_af8.py" \
            "$ROOT/runtime-overlays/apply-ws33-stack-resolution-reachability.py" \
            "$ROOT/runtime-overlays/apply-ws33-a-rest-play-stage-observer.py"
          (cd "$ROOT" && python -m unittest -v test_ws33_decision_path_evidence.py)

      - name: Consume immutable production-root routes
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated/routes generated/record generated/replay generated/diagnostic generated/overlay-logs
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ROUTE_ARTIFACT_ID")"
          test "$(jq -r .digest <<<"$meta")" = "$ROUTE_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$ROUTE_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$ROUTE_SOURCE_HEAD"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$ROUTE_ARTIFACT_ID/zip" > generated/routes.zip
          test "sha256:$(sha256sum generated/routes.zip | cut -d' ' -f1)" = "$ROUTE_ARTIFACT_DIGEST"
          unzip -q generated/routes.zip -d generated/routes
          (cd generated/routes && sha256sum -c SHA256SUMS)
          jq -e '.status=="PASS" and .effective_paths==26 and .af_effective_paths==8 and .nested_trigger_effective_paths==1 and .nested_trigger_parent_entrypoints==2 and .direct_trigger_effective_paths==17 and .total_runtime_parent_entrypoints==27 and .effective_path_overlap==0 and .magic_legality_inference==false and .coverage_mutated==false and .coverage_promotion==false' generated/routes/out/A_REST_SVAR_EXECUTION_ROUTE_GATE.json
          python - <<'PY'
          from pathlib import Path
          rows=[x.split('\t') for x in Path('generated/routes/out/a-rest-svar-af8.tsv').read_text().splitlines() if x]
          assert len(rows)==8 and len({x[1] for x in rows})==8 and all(len(x)==19 for x in rows)
          assert all(x[8]=='ABILITY' for x in rows)
          assert all(x[10]=='1' and x[11]=='0' and x[12]=='1' and x[13]=='1' for x in rows)
          print('WS33_A_SVAR_AF8_CASES=PASS paths=8 ability_roots=8 hidden=8 rng=0 replay=8 decision=8')
          PY
          printf '%s\n' "$GITHUB_SHA" > generated/diagnostic/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/diagnostic/workflow-source-tree.txt
          cut -f2 generated/routes/out/a-rest-svar-af8.tsv | sort > generated/diagnostic/expected-paths.txt
          test "$(wc -l < generated/diagnostic/expected-paths.txt)" -eq 8

      - name: Checkout pinned runtime dependencies
        uses: actions/checkout@v4
        with: {repository: Card-Forge/forge, ref: '${{ env.FORGE_PIN }}', path: forge, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.DIRECT_RUNTIME_SOURCE_HEAD }}', path: direct-source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS01_HEAD }}', path: ws01, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS12_HEAD }}', path: ws12, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ env.WS32_HEAD }}', path: ws32, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WS31_HIST_HEAD }}
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}

      - name: Apply exact Rules Decision Observation runtime stack
        shell: bash
        run: |
          set -euo pipefail
          bash ws01/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh forge ws01/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch | tee generated/overlay-logs/ws01.log
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws05-hidden-info-overlay.py forge | tee generated/overlay-logs/ws05.log
          cp direct-source/research/greenfield-qualification/hidden-info/Ws05HiddenInfoProbe.java forge/forge-gui-desktop/src/test/java/forge/net/Ws05HiddenInfoProbe.java
          python direct-source/research/greenfield-qualification/forge-patches/apply-ws06-rng-replay-overlay.py forge --inventory generated/record/RNG_INVENTORY.json | tee generated/overlay-logs/ws06.log
          python "$ROOT/runtime-overlays/apply-ws33-input-confirm.py" --forge-root forge | tee generated/overlay-logs/ws33-input-confirm.log
          python "$ROOT/runtime-overlays/apply-ws33-observation-fanout.py" --forge-root forge | tee generated/overlay-logs/ws33-observation-fanout.log
          python "$ROOT/runtime-overlays/apply-ws33-external-card-decision-lifetime.py" --forge-root forge | tee generated/overlay-logs/ws33-card-decision-lifetime.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-resolution-reachability.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-resolution-reachability.log
          python "$ROOT/runtime-overlays/apply-ws33-a-rest-play-stage-observer.py" --forge-root forge | tee generated/overlay-logs/ws33-a-rest-play-stage-observer.log
          python "$ROOT/runtime-overlays/apply-ws33-stack-target.py" --forge-root forge | tee generated/overlay-logs/ws33-stack-target.log
          python "$ROOT/runtime-overlays/apply-ws33-target-selection.py" --forge-root forge | tee generated/overlay-logs/ws33-target-selection.log
          python "$ROOT/runtime-overlays/apply-ws33-svar-reachability.py" --forge-root forge | tee generated/overlay-logs/ws33-svar-reachability.log
          python ws12/research/greenfield-qualification/failure-semantics/apply-ws12-forge-overlay.py --forge-root forge | tee generated/overlay-logs/ws12.log
          python ws32/research/greenfield-qualification/actual-card-behavior/ws32/apply_ws32_card_behavior_production_binding.py --forge-root forge | tee generated/overlay-logs/ws32.log
          grep -F 'public static void setWs33ResolutionObserver' forge/forge-game/src/main/java/forge/game/zone/MagicStack.java
          grep -F 'public static void setWs33PlayStageObserver' forge/forge-game/src/main/java/forge/game/player/PlaySpellAbility.java
          grep -Fx 'WS33_STACK_RESOLUTION_REACHABILITY=PASS boundary=TRIGGER_PLAY_PREREQUISITES_ADD_TARGET_REJECT_FROZEN_PUSH_FIZZLE_POST_FIZZLE_PRE_API_RESOLVE semantics_mutated=FALSE' generated/overlay-logs/ws33-stack-resolution-reachability.log
          grep -Fx 'WS33_A_REST_PLAY_STAGE_OBSERVER=PASS semantics_mutated=FALSE booleans_mutated=FALSE' generated/overlay-logs/ws33-a-rest-play-stage-observer.log
          grep -Fx 'WS33_A_REST_MANA_PAYMENT_OBSERVER=PASS options_mutated=FALSE selection_mutated=FALSE mana_mutated=FALSE cost_mutated=FALSE' generated/overlay-logs/ws33-a-rest-play-stage-observer.log

      - name: Prepare exact AF8 production-parent harness
        shell: bash
        run: |
          set -euo pipefail
          src=ws31-historical/research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/net/Ws33ARestSVarAf8QualificationTest.java
          python "$ROOT/ws33_prepare_g_ability_harness.py" --source "$src" --out "$dst"
          python "$ROOT/ws33_prepare_g_svar_af_harness.py" --harness "$dst"
          python "$ROOT/ws33_strengthen_g_svar_af_hidden_witness.py" --harness "$dst" | tee generated/diagnostic/hidden-witness.log
          python "$ROOT/ws33_adapt_g_svar_af_harness_to_a_af8.py" --harness "$dst" | tee generated/diagnostic/a-af8-adapter.log
          python "$ROOT/ws33_instrument_g_principal_observations.py" --harness "$dst" | tee generated/diagnostic/observation-instrument.log
          python "$ROOT/ws33_harden_a_rest_svar_af8_runtime.py" --harness "$dst" | tee generated/diagnostic/a-af8-hardener.log
          grep -Fx 'WS33_A_SVAR_AF8_ADAPTER=PASS paths=8 route=ABILITY_ROOT' generated/diagnostic/a-af8-adapter.log
          grep -Fx 'WS33_A_SVAR_AF8_MODE_SELECTION=FORGE_AUTHORITATIVE_DESIRED_PLUS_MINIMUM' generated/diagnostic/a-af8-adapter.log
          grep -Fx 'WS33_A_SVAR_AF8_FIXTURES=GENERIC_PUBLIC_ZONE_CANDIDATES' generated/diagnostic/a-af8-adapter.log
          grep -Fx 'WS33_A_SVAR_AF8_RULES_MUTATION=0 target_svar_direct_entry=FALSE' generated/diagnostic/a-af8-adapter.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_CARD_NAME_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -Fx 'WS33_G_SVAR_AF_HIDDEN_WITNESS_PATH_ID_BRANCH=0' generated/diagnostic/hidden-witness.log
          grep -F 'WS33_G_PRINCIPAL_OBSERVATION_ATTRIBUTION=G_SVAR_AF' generated/diagnostic/observation-instrument.log
          grep -Fx 'WS33_A_SVAR_AF8_RUNTIME_HARDEN=PASS paths=8 play=PlaySpellAbility actor=REMOTE_SLOT_1 phase=FORGE_MAIN1' generated/diagnostic/a-af8-hardener.log
          grep -Fx 'WS33_A_SVAR_AF8_PAYMENT=FORGE_AUTHORITATIVE mana_pool_injection=0 cost_bypass=0' generated/diagnostic/a-af8-hardener.log
          grep -Fx 'WS33_A_SVAR_AF8_EFFECT_EVIDENCE=TARGET_CARD_POSTCONDITION_FROM_TARGET_SCRIPT' generated/diagnostic/a-af8-hardener.log
          grep -Fx 'WS33_A_SVAR_AF8_CLIENT_EVIDENCE=WS05_REAL_REMOTE_PHASE_SAMPLES' generated/diagnostic/a-af8-hardener.log
          grep -Fx 'WS33_A_SVAR_AF8_RULES_MUTATION=0 card_name_branch=0 path_id_branch=0' generated/diagnostic/a-af8-hardener.log
          ! grep -F 'sa.resolve()' "$dst"
          ! grep -F 'sa.getTargets().add(' "$dst"
          ! grep -F 'AbilityFactory.getAbility(spec.script,source)' "$dst"
          ! grep -F 'forge-behavior-v2:' "$dst"
          ! grep -F 'getStack().addAndUnfreeze(sa)' "$dst"
          ! grep -F 'prepareSourceParentChoices(spec,sa)' "$dst"
          grep -F 'PlaySpellAbility.playSpellAbility(actor.getController(),actor,sa)' "$dst"
          grep -F 'MagicStack.setWs33ResolutionObserver' "$dst"
          grep -F 'AbilitySub.setWs33ResolutionObserver' "$dst"
          grep -F 'PlaySpellAbility.setWs33PlayStageObserver' "$dst"
          grep -F 'assertAF8PositiveEffect(spec,ce)' "$dst"
          grep -F 'AF8_CLIENT_OBSERVATION_SAMPLES.tsv' "$dst"
          grep -F 'Ws05HiddenInfoProbe.phaseSampleCount' "$dst"
          grep -F 'getStack().resolveStack()' "$dst"
          sha256sum "$dst" | tee generated/diagnostic/harness.sha256

      - name: Fresh AF8 Record
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33ARestSVarAf8QualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/routes/out/a-rest-svar-af8.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/record" -Dws31.mode=record \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/record/runtime.log
          test -s generated/record/case-summary.tsv
          test -s generated/record/decision-tape.tsv
          test -s generated/record/decision-events-with-path.tsv
          test -f generated/record/rng-tape.tsv
          test -f generated/record/rng-events-with-path.tsv
          test -f generated/record/PRINCIPAL_OBSERVATIONS.jsonl
          test -s generated/record/AF8_EFFECT_EVIDENCE.tsv
          test -s generated/record/AF8_CLIENT_OBSERVATION_SAMPLES.tsv
          test -s generated/record/play-stages.tsv

      - name: Fresh tape-driven AF8 Replay
        shell: bash
        run: |
          set -euo pipefail
          (cd forge && xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.net.Ws33ARestSVarAf8QualificationTest \
            -Dws31.cases="$GITHUB_WORKSPACE/generated/routes/out/a-rest-svar-af8.tsv" \
            -Dws31.outDir="$GITHUB_WORKSPACE/generated/replay" -Dws31.mode=replay \
            -Dws31.decisionReplay="$GITHUB_WORKSPACE/generated/record/decision-tape.tsv" \
            -Dws31.rngReplay="$GITHUB_WORKSPACE/generated/record/rng-tape.tsv" \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test) 2>&1 | tee generated/replay/runtime.log
          test -s generated/replay/case-summary.tsv
          test -s generated/replay/decision-events-with-path.tsv
          test -f generated/replay/PRINCIPAL_OBSERVATIONS.jsonl
          test -s generated/replay/AF8_EFFECT_EVIDENCE.tsv
          test -s generated/replay/AF8_CLIENT_OBSERVATION_SAMPLES.tsv
          test -s generated/replay/play-stages.tsv

      - name: Fail-closed AF8 adjudication
        shell: bash
        run: |
          set -euo pipefail
          python "$ROOT/ws33_adjudicate_a_rest_svar_af8.py" \
            --cases generated/routes/out/a-rest-svar-af8.tsv \
            --record-dir generated/record \
            --replay-dir generated/replay \
            --out generated/diagnostic/A_REST_SVAR_AF8_GATE.json
          jq -e '.status=="PASS" and .expected_paths==8 and .actual_card_source_bound==true and .play_spell_ability_authoritative==true and .mode_selection_authoritative==true and .target_selection_authoritative==true and .cost_payment_authoritative==true and .manual_target_injection==false and .direct_effect_resolution==false and .positive_target_effect_required==true and .real_client_confidentiality_samples_required==true and .coverage_mutated==false and .coverage_promotion==false' generated/diagnostic/A_REST_SVAR_AF8_GATE.json
          cmp generated/record/decision-tape.tsv generated/replay/decision-tape.tsv
          cmp generated/record/decision-events-with-path.tsv generated/replay/decision-events-with-path.tsv
          cmp generated/record/rng-tape.tsv generated/replay/rng-tape.tsv
          cmp generated/record/rng-events-with-path.tsv generated/replay/rng-events-with-path.tsv
          cmp generated/record/AF8_EFFECT_EVIDENCE.tsv generated/replay/AF8_EFFECT_EVIDENCE.tsv
          cmp generated/record/AF8_CLIENT_OBSERVATION_SAMPLES.tsv generated/replay/AF8_CLIENT_OBSERVATION_SAMPLES.tsv
          cmp generated/record/play-stages.tsv generated/replay/play-stages.tsv

      - name: Seal AF8 evidence even on failure
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p generated/diagnostic
          printf '%s\n' "$GITHUB_SHA" > generated/diagnostic/workflow-source-head.txt
          git rev-parse 'HEAD^{tree}' > generated/diagnostic/workflow-source-tree.txt
          if [[ -f generated/routes/out/a-rest-svar-af8.tsv ]]; then
            cut -f2 generated/routes/out/a-rest-svar-af8.tsv | sort > generated/diagnostic/expected-paths.txt
          else
            : > generated/diagnostic/expected-paths.txt
          fi
          if [[ ! -f generated/diagnostic/A_REST_SVAR_AF8_GATE.json ]]; then
            cat > generated/diagnostic/A_REST_SVAR_AF8_GATE.json <<'EOF'
          {
            "schema": "commander-simulator-next.ws33-a-rest-svar-af8-runtime.v2",
            "status": "FAIL_CLOSED_EARLY",
            "expected_paths": 8,
            "failure_count": 1,
            "failures": ["adjudication_not_completed"],
            "coverage_mutated": false,
            "coverage_promotion": false
          }
          EOF
          fi
          expected_sha="UNAVAILABLE"
          if [[ -s generated/diagnostic/expected-paths.txt ]]; then
            expected_sha="$(sha256sum generated/diagnostic/expected-paths.txt | cut -d' ' -f1)"
          fi
          cat > generated/SOURCE_CHAIN.json <<EOF
          {"schema":"commander-simulator-next.ws33-a-rest-svar-af8-source-chain.v2","workflow_source_head":"$GITHUB_SHA","workflow_source_tree":"$(git rev-parse 'HEAD^{tree}')","workflow_file":".github/workflows/ws33-abc-a-rest-svar-af8-runtime.yml","expected_path_count":8,"expected_path_set_sha256":"$expected_sha","expected_artifact_name":"ws33-abc-a-rest-svar-af8-$GITHUB_RUN_ID","route_run_id":$ROUTE_RUN_ID,"route_artifact_id":$ROUTE_ARTIFACT_ID,"route_artifact_digest":"$ROUTE_ARTIFACT_DIGEST","route_source_head":"$ROUTE_SOURCE_HEAD","forge_pin":"$FORGE_PIN","coverage_mutated":false,"coverage_promotion":false}
          EOF
          (cd generated && find . -type f ! -path './SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test -s generated/SOURCE_CHAIN.json
          test -s generated/SHA256SUMS
          (cd generated && sha256sum -c SHA256SUMS)

      - name: Upload immutable AF8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-abc-a-rest-svar-af8-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 90
