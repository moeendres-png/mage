name: "Pull Request Labeler (auto)"
on:
  - pull_request_target

# least privilege: no token permission by default; each job grants only what it needs
permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: label-the-PR
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          configuration-path: '.github/labeler.yml'
