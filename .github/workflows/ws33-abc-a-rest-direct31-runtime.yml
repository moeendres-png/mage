name: WS33 ABC A-rest Direct31 runtime

on:
  push:
    branches:
      - work/ws33-g3-final-closure-20260902
    paths:
      - .github/workflows/ws33-abc-a-rest-direct31-runtime.yml
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_run_a_rest_direct31_runtime_v2.sh
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_prepare_a_rest_direct_harness.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_repair_a_rest_direct_case_abi.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_bind_a_rest_direct_remote_actor.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_instrument_a_rest_direct_observation.py
      - research/greenfield-qualification/actual-card-behavior/ws33/ws33_adjudicate_a_rest_direct_observation.py
      - research/greenfield-qualification/actual-card-behavior/ws33/runtime-overlays/apply-ws33-a-rest-play-stage-observer.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct31_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout frozen qualification source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 8c7e9afb8e6caee88644b94e25da5852e36f8928
          path: forge
          fetch-depth: 1

      - name: Checkout retained Direct runtime source
        uses: actions/checkout@v4
        with:
          ref: d8af15cb879bdfc3c40ce4cba3462da24ee3f272
          path: direct-source
          fetch-depth: 1

      - name: Checkout retained WS01
        uses: actions/checkout@v4
        with:
          ref: bf089ea806f54a9bbb64ede205915729e3629684
          path: ws01
          fetch-depth: 1

      - name: Checkout retained WS12
        uses: actions/checkout@v4
        with:
          ref: 80743bdbc2950b00e422f3deb38f04111f30a4d4
          path: ws12
          fetch-depth: 1

      - name: Checkout retained WS32
        uses: actions/checkout@v4
        with:
          ref: 6ca2a7bbacd074cc84fa4a6019c4d26e5e3717a9
          path: ws32
          fetch-depth: 1

      - name: Checkout historical WS31 harness infrastructure only
        uses: actions/checkout@v4
        with:
          ref: b09fe7c16845cddbbfe30fd1f855b59234bbf007
          path: ws31-historical
          fetch-depth: 1
          sparse-checkout: |
            research/greenfield-qualification/actual-card-behavior/ws31/forge-overlay/Ws31HiddenRngReplayQualificationTest.java

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Execute frozen Direct31 record/replay driver v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash research/greenfield-qualification/actual-card-behavior/ws33/ws33_run_a_rest_direct31_runtime_v2.sh

      - name: Upload immutable Direct31 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws33-abc-a-rest-direct31-runtime-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 90
