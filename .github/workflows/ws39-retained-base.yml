name: WS39 retained-base commander history restore

on:
  push:
    branches:
      - foundry/ws39-commander-history-state-restore
  workflow_dispatch:

jobs:
  retained-base-engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: foundry/ws39-commander-history-state-restore
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Record exact source identity
        shell: bash
        run: |
          mkdir -p foundry/ws39/evidence
          git rev-parse HEAD | tee foundry/ws39/evidence/ENGINE_COMMIT.txt
          git rev-parse 'HEAD^{tree}' | tee foundry/ws39/evidence/ENGINE_TREE.txt
          git status --porcelain=v1 | tee foundry/ws39/evidence/GIT_STATUS.txt

      - name: Run focused native WS39 engine tests
        shell: bash
        run: |
          mvn test -B \
            -Dtest=CommanderPlaysCountStateRestoreTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dxmage.dataCollectors.printGameLogs=false \
            -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties

      - name: Collect focused test reports
        if: always()
        shell: bash
        run: |
          mkdir -p foundry/ws39/evidence/surefire
          find . -path '*/target/surefire-reports/*CommanderPlaysCountStateRestoreTest*' -type f -exec cp {} foundry/ws39/evidence/surefire/ \; || true
          find foundry/ws39/evidence -type f -print0 | sort -z | xargs -0 sha256sum > foundry/ws39/evidence/SHA256SUMS || true

      - name: Upload exact-head WS39 engine evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ws39-xmage-engine-retained-base-evidence
          path: foundry/ws39/evidence
          if-no-files-found: error
