name: Greenfield Forge runtime qualification

on:
  workflow_dispatch: {}
  push:
    branches:
      - research/greenfield-engine-shootout-20260827
    paths:
      - '.github/workflows/greenfield-forge-runtime.yml'
      - 'research/greenfield-qualification/**'

permissions:
  contents: read

concurrency:
  group: greenfield-forge-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forge-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qual
          fetch-depth: 1
      - name: Checkout pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: 8c7e9afb8e6caee88644b94e25da5852e36f8928
          path: forge
          fetch-depth: 1
      - name: Materialize exact run provenance and apply strict boundary patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qual rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts/engine-shootout/forge/runtime
          printf 'source_head=%s\n' "$(git -C qual rev-parse HEAD)" > provenance.env
          printf 'source_tree=%s\n' "$(git -C qual rev-parse 'HEAD^{tree}')" >> provenance.env
          cp provenance.env artifacts/engine-shootout/forge/runtime/provenance.env
          bash qual/research/greenfield-qualification/forge-patches/apply-strict-decision-boundary.sh \
            forge qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch \
            | tee artifacts/engine-shootout/forge/runtime/patch-apply.log
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: forge/pom.xml
      - name: Install headless display
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Build runnable pinned Forge artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/engine-shootout/forge/runtime
          /usr/bin/time -v bash -lc 'cd forge && xvfb-run -a mvn -U -B -DskipTests package' > artifacts/engine-shootout/forge/runtime/package.log 2>&1
          jar=$(find forge/forge-gui-desktop/target -maxdepth 1 -type f -name '*-jar-with-dependencies.jar' | head -n1)
          test -n "$jar"
          printf '%s\n' "$jar" > artifacts/engine-shootout/forge/runtime/jar.path
          sha256sum "$jar" > artifacts/engine-shootout/forge/runtime/jar.sha256
          test "$(git -C forge rev-parse HEAD)" = "8c7e9afb8e6caee88644b94e25da5852e36f8928"
          # GuiDesktop uses ASSETS_DIR="" for snapshot builds, so command-line mode
          # must run from forge-gui/, where ./res exists. This is upstream runtime layout,
          # not a rules or card-semantics modification.
          test -f forge/forge-gui/res/languages/en-US.properties
      - name: Run 2P 3P 4P 5P Commander CLI probes
        shell: bash
        run: |
          set -euo pipefail
          source provenance.env
          root="$GITHUB_WORKSPACE/artifacts/engine-shootout/forge/runtime"
          mkdir -p "$root/results"
          jar="$GITHUB_WORKSPACE/$(cat "$root/jar.path")"
          deck="$GITHUB_WORKSPACE/qual/research/greenfield-qualification/decks/micro-ruhan-forge.dck"
          failures=0
          for p in 2 3 4 5; do
            python3 qual/research/greenfield-qualification/harness.py \
              --candidate forge \
              --commit 8c7e9afb8e6caee88644b94e25da5852e36f8928 \
              --source-head "$source_head" --source-tree "$source_tree" \
              --external-pin forge=8c7e9afb8e6caee88644b94e25da5852e36f8928 \
              --scenario "L_${p}P_commander_cli_full_game" \
              --seed 424242 --players "$p" \
              --command "bash '$GITHUB_WORKSPACE/qual/research/greenfield-qualification/forge_probe.sh' '$jar' '$deck' '$p' 424242 90" \
              --cwd "$GITHUB_WORKSPACE/forge/forge-gui" --timeout 180 \
              --out "$root/results/L_${p}P.result.json" || failures=$((failures+1))
          done
          echo "$failures" > "$root/player-count-failures.count"
      - name: Run current RogShai exact-name load/full-game probe
        shell: bash
        run: |
          set -euo pipefail
          source provenance.env
          root="$GITHUB_WORKSPACE/artifacts/engine-shootout/forge/runtime"
          jar="$GITHUB_WORKSPACE/$(cat "$root/jar.path")"
          deck="$GITHUB_WORKSPACE/qual/research/greenfield-qualification/decks/rogshai-current-forge.dck"
          set +e
          python3 qual/research/greenfield-qualification/harness.py \
            --candidate forge --commit 8c7e9afb8e6caee88644b94e25da5852e36f8928 \
            --source-head "$source_head" --source-tree "$source_tree" \
            --external-pin forge=8c7e9afb8e6caee88644b94e25da5852e36f8928 \
            --scenario CARD_ROGSHAI_CURRENT_LOAD_AND_RUN --seed 515151 --players 2 \
            --command "bash '$GITHUB_WORKSPACE/qual/research/greenfield-qualification/forge_probe.sh' '$jar' '$deck' 2 515151 60" \
            --cwd "$GITHUB_WORKSPACE/forge/forge-gui" --timeout 150 \
            --out "$root/results/CARD_ROGSHAI.result.json"
          echo "$?" > "$root/rogshai-probe.exit"
          exit 0
      - name: Fresh-process seeded repeatability probe
        shell: bash
        run: |
          set -euo pipefail
          source provenance.env
          root="$GITHUB_WORKSPACE/artifacts/engine-shootout/forge/runtime"
          dir="$root/fresh-process"
          mkdir -p "$dir"
          jar="$GITHUB_WORKSPACE/$(cat "$root/jar.path")"
          deck="$GITHUB_WORKSPACE/qual/research/greenfield-qualification/decks/micro-ruhan-forge.dck"
          for n in 1 2 3; do
            (cd "$GITHUB_WORKSPACE/forge/forge-gui" && bash "$GITHUB_WORKSPACE/qual/research/greenfield-qualification/forge_probe.sh" "$jar" "$deck" 4 989898 90) > "$dir/run${n}.out" 2> "$dir/run${n}.stderr" || true
            sha256sum "$dir/run${n}.out" "$dir/run${n}.stderr" >> "$dir/raw-log-hashes.sha256"
          done
          # The current CLI probe emits terminal text only.  It does not emit
          # canonical state digests, RNG events, or decision events.  Keep the
          # three real fresh-process logs as context, but never compare raw
          # stdout/stderr as a replay criterion.
          for n in 1 2 3; do
            python3 - "$dir/process${n}.json" "$source_head" "$source_tree" <<'PY'
          import json, sys
          from pathlib import Path
          path, head, tree = sys.argv[1:]
          Path(path).write_text(json.dumps({
              'schema': 'commander-simulator-next.game-run-evidence.v2',
              'source_head': head, 'source_tree': tree,
              'external_pins': {'forge': '8c7e9afb8e6caee88644b94e25da5852e36f8928'},
              'scenario': 'S0_seeded_cli_fresh_process_repeatability',
              'seed': 989898, 'players': 4,
              'note': 'CLI probe has no canonical semantic/RNG/decision streams; raw logs are not replay evidence.'
          }, sort_keys=True) + '\n')
          PY
          done
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/qual/research/greenfield-qualification" python3 \
            "$GITHUB_WORKSPACE/qual/research/greenfield-qualification/semantic_replay.py" \
            --input "$dir/process1.json" --input "$dir/process2.json" --input "$dir/process3.json" \
            --out "$dir/SEMANTIC_REPLAY_GATE.json"
          replay_rc=$?
          set -e
          python3 "$GITHUB_WORKSPACE/qual/research/greenfield-qualification/harness.py" \
            --candidate forge --commit 8c7e9afb8e6caee88644b94e25da5852e36f8928 \
            --source-head "$source_head" --source-tree "$source_tree" \
            --external-pin forge=8c7e9afb8e6caee88644b94e25da5852e36f8928 \
            --scenario S0_seeded_cli_fresh_process_repeatability --seed 989898 --players 4 \
            --status NOT_RUN --reason 'No canonical semantic state, RNG event tape, or decision tape is emitted by the current CLI probe; raw process logs are intentionally excluded.' \
            --out "$root/results/S0.result.json"
          echo "$replay_rc" > "$root/fresh-process.exit"
      - name: Census Forge player-decision surface
        shell: bash
        run: |
          set -euo pipefail
          source_head=$(cut -d= -f2 provenance.env | head -n1)
          source_tree=$(cut -d= -f2 provenance.env | tail -n1)
          PYTHONPATH="$GITHUB_WORKSPACE/qual/research/greenfield-qualification" python3 \
            qual/research/greenfield-qualification/forge_decision_contract_smoke.py \
            --forge-root forge \
            --patch qual/research/greenfield-qualification/forge-patches/strict-decision-boundary.patch \
            --source-head "$source_head" --source-tree "$source_tree" \
            --out artifacts/engine-shootout/forge/runtime/DECISION_EXPORT_IMPLEMENTATION.json
          cp artifacts/engine-shootout/forge/runtime/DECISION_EXPORT_IMPLEMENTATION.json \
            artifacts/engine-shootout/forge/runtime/decision-census-source.json
      - name: Hash runtime evidence
        if: always()
        shell: bash
        run: |
          cd artifacts/engine-shootout/forge/runtime
          find . -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > hashes.sha256 || true
      - name: Upload Forge runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-forge-runtime-rerun
          path: artifacts/engine-shootout/forge/runtime
          if-no-files-found: error
      - name: Classify runtime probes after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/engine-shootout/forge/runtime"
          pc=$(cat "$root/player-count-failures.count" 2>/dev/null || echo 99)
          rg=$(cat "$root/rogshai-probe.exit" 2>/dev/null || echo 99)
          fp=$(cat "$root/fresh-process.exit" 2>/dev/null || echo 99)
          echo "player_count_failures=$pc rogshai_exit=$rg fresh_process_exit=$fp"
          if [ "$pc" = 0 ] && [ "$rg" = 0 ] && [ "$fp" = 0 ]; then
            echo 'FORGE_RUNTIME_GATE=PASS'
          else
            echo 'FORGE_RUNTIME_GATE=FAIL_OR_NOT_RUN'
            echo 'Replay remains unqualified until canonical state, RNG, and decision tapes are emitted.'
            exit 1
          fi
