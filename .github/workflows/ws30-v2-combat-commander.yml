name: WS30 Evidence Finalizer

on:
  push:
    branches: [work/ws30-v2-combat-commander-20260830]

permissions:
  contents: write
  actions: write

jobs:
  finalize-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: work/ws30-v2-combat-commander-20260830
      EVIDENCE_HEAD: 38d2db6eae131bef1e7079eb80e6c012b9badbdf
      EVIDENCE_TREE: f55320645dfa63920954ebc2b292ccfc90128db7
      EVIDENCE_RUN_ID: '33316335525'
      EVIDENCE_JOB_ID: '99270369522'
      EVIDENCE_ARTIFACT_ID: '9733584180'
      EVIDENCE_ARTIFACT_DIGEST: sha256:e31b939402e4b59db711a2bdf29773f4cb7be8d0ea434224256f5b3459a92199
      WS26_HEAD: 206a39cbaa3eeb98b10c2ddc36d51fe5b1b2f5ef
      WS26_TREE: 837f445f78bb26462653c58baf1532e294151b10
      FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
    steps:
      - name: Checkout finalizer commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify parent and immutable full-pass artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EVIDENCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" != "$EVIDENCE_TREE"
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}")
          test "$(jq -r '.id' <<<"$meta")" = "$EVIDENCE_ARTIFACT_ID"
          test "$(jq -r '.name' <<<"$meta")" = "ws30-v2-combat-commander-${EVIDENCE_RUN_ID}"
          test "$(jq -r '.digest' <<<"$meta")" = "$EVIDENCE_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$EVIDENCE_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$EVIDENCE_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" > /tmp/ws30-evidence.zip
          test "sha256:$(sha256sum /tmp/ws30-evidence.zip | awk '{print $1}')" = "$EVIDENCE_ARTIFACT_DIGEST"
          rm -rf /tmp/ws30-evidence && mkdir -p /tmp/ws30-evidence
          unzip -q /tmp/ws30-evidence.zip -d /tmp/ws30-evidence
          test -f /tmp/ws30-evidence/ws30/WS30_GATE.json
          (cd /tmp/ws30-evidence/ws30 && sha256sum -c WS30_HASHES.sha256)
          for f in WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json; do
            cmp "/tmp/ws30-evidence/ws30/$f" "/tmp/ws30-evidence/ws30-replay/$f"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/ws30-evidence/ws30')
          e=json.loads((root/'WS30_EXECUTION.json').read_text())
          g=json.loads((root/'WS30_GATE.json').read_text())
          c=json.loads((root/'WS30_PATH_COVERAGE.json').read_text())
          assert e['qualification_head']=='38d2db6eae131bef1e7079eb80e6c012b9badbdf'
          assert e['qualification_tree']=='f55320645dfa63920954ebc2b292ccfc90128db7'
          assert [e[k] for k in ('test_exit_code','materialize_exit_code','gate_exit_code','replay_exit_code')]==[0,0,0,0]
          assert e['global_q5_rerun'] is False and e['global_q6_claim'] is False
          assert g['WS30_FAMILY_GATE']=='PASS' and g['WORKSTREAM_COMPLETE'] is True
          assert g['actual_card_pass_count']==27 and g['assigned_path_count']==27
          assert g['combat_legality_from_rules_core'] is True
          assert g['manual_combat_legality_in_harness']==0
          assert g['combat_state_assertions_complete'] is True
          assert g['commander_specific_paths_rules_validated'] is True
          assert c['witness_path_count']==27 and c['inherited_pass_count']==0
          assert c['missing']==[] and c['extra']==[] and c['duplicates']==[]
          rows=[json.loads(x) for x in (root/'WS30_WITNESSES.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==27==len({r['path_id'] for r in rows})
          assert all(r['result']=='PASS' and r['actual_card_execution'] is True and r['manual_legality'] is False for r in rows)
          PY

      - name: Materialize committed evidence and handoff
        shell: bash
        run: |
          set -euo pipefail
          out=research/greenfield-qualification/actual-card-behavior/ws30
          mkdir -p "$out"
          for f in WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json WS30_GATE.json WS30_HASHES.sha256; do
            cp "/tmp/ws30-evidence/ws30/$f" "$out/$f"
          done
          cat > research/greenfield-qualification/WS30_HANDOFF.md <<'EOF'
          # WS30 — COMBAT / COMMANDER ACTUAL-CARD CLOSURE — HANDOFF

          ## Qualification status

          The immutable evidence committed with this handoff was produced by a complete WS30 full-pass run and independently rechecked before commit. The commit containing this handoff must itself pass the restored WS30 qualification workflow before final closure.

          - `WS30_FAMILY_GATE = PASS`
          - `WORKSTREAM_COMPLETE = TRUE`
          - Owner family: `COMBAT_COMMANDER`
          - Assigned V2 paths: **27**
          - Actual-card PASS witnesses: **27**
          - Inherited PASS witnesses: **0**
          - Missing / extra / duplicate paths: **0 / 0 / 0**
          - Global Q5 rerun: **false**
          - Global Q6 claim: **false**

          ## Immutable predecessor boundary

          - WS26 HEAD: `206a39cbaa3eeb98b10c2ddc36d51fe5b1b2f5ef`
          - WS26 TREE: `837f445f78bb26462653c58baf1532e294151b10`
          - WS26 run: `33283478862`
          - WS26 job: `99182488884`
          - WS26 artifact: `9723722686`
          - WS26 artifact digest: `sha256:b9e1fc4fd792b0baa1da1c17e3bbc9e01b2557d4b73b8590e680679f53b59883`

          ## Pinned engine

          - Card-Forge/forge: `8c7e9afb8e6caee88644b94e25da5852e36f8928`
          - No Forge production source was modified; WS30 uses a qualification-only test overlay against this exact pin.

          ## Full-pass evidence source

          - Qualification HEAD: `38d2db6eae131bef1e7079eb80e6c012b9badbdf`
          - Qualification TREE: `f55320645dfa63920954ebc2b292ccfc90128db7`
          - Run: `33316335525`
          - Job: `99270369522`
          - Artifact: `9733584180`
          - Artifact digest: `sha256:e31b939402e4b59db711a2bdf29773f4cb7be8d0ea434224256f5b3459a92199`
          - Test / materialize / gate / replay exit codes: `0 / 0 / 0 / 0`

          `WS30_HASHES.sha256` was independently verified. The five semantic evidence products from primary execution and replay compare byte-for-byte identical.

          ## Required hard gates

          - `combat_legality_from_rules_core = true`
          - `manual_combat_legality_in_harness = 0`
          - `combat_state_assertions_complete = true`
          - `commander_specific_paths_rules_validated = true`

          First strike, double strike, goad, blocking/evasion, removal from combat, Commander identity, and same-Commander combat damage are qualified by actual pinned-Forge execution.

          ## Rules / pilot boundary

          Attacker declaration consumes `Combat.getAttackConstraints().getLegalAttackers()` and is checked by `CombatUtil.validateAttackers`. Block legality is queried through `CombatUtil.canBlock` and validated through `CombatUtil.validateBlocks`. Combat damage is resolved by Forge combat-phase machinery. The harness does not reimplement combat rules or use silent default/random/pass fallbacks.

          ## Aura bootstrap closure

          The earlier Aura failure was a standalone-test bootstrap defect. `PaperCard` contained `Enchantment - Aura`; runtime construction lost `Aura` because Forge's dynamic subtype registry had not been initialized. WS30 now follows Forge's product initialization path via `FModel.loadDynamicGamedata()` before runtime card construction and asserts `CardType.Constant.LOADED`. No `setType`, card-name subtype patch, manual Aura injection, or SBA bypass was added.

          ## Multiplayer Ghostly Prison closure

          In 4-player Commander the attack tax is defender-scoped. Forge can satisfy a must-attack requirement by selecting an untaxed legal opponent rather than globally omitting the attacker. The witness asserts the actual rules-core-selected defender and does not impose a 2-player heuristic.

          ## Semantic replay normalization

          Java default `Object.toString()` heap identities for `AttackRestriction` and `AttackRequirement` are incidental JVM data. Materialization replaces only those addresses with a stable `[present]` marker, preserving the constraint class and every legal/result/state assertion. No semantic choice or game state is normalized away.

          ## Rules authority and evidence classes

          Official Magic Comprehensive Rules effective **2026-08-07** are semantic authority, including relevant rules 508, 509, 510, 701.12, 701.15, 702.4, 702.7, 702.9, 702.83, 702.91, 702.121, 903.3, 903.9, and 903.10a. Forge parity is implementation evidence only.

          - WS26 boundary / Forge pin / artifact hashes / replay identity: **DIRECTLY_VERIFIED**
          - 27/27 actual-card execution: **TECHNICALLY_CONFORMANT**
          - Official combat/Commander adjudication: **EXTERNALLY_RULE_VALIDATED**
          - Global Q6: **NOT CLAIMED**

          ## Committed evidence

          - `actual-card-behavior/ws30/WS30_WITNESSES.jsonl`
          - `actual-card-behavior/ws30/WS30_PATH_COVERAGE.json`
          - `actual-card-behavior/ws30/WS30_COMBAT_INVENTORY.json`
          - `actual-card-behavior/ws30/WS30_COMMANDER_INVENTORY.json`
          - `actual-card-behavior/ws30/WS30_RULES_ADJUDICATION.json`
          - `actual-card-behavior/ws30/WS30_GATE.json`
          - `actual-card-behavior/ws30/WS30_HASHES.sha256`
          EOF
          sed -i 's/^          //' research/greenfield-qualification/WS30_HANDOFF.md

      - name: Restore full qualifier, commit evidence, and dispatch final requalification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}^:.github/workflows/ws30-v2-combat-commander.yml" > .github/workflows/ws30-v2-combat-commander.yml
          grep -q '^name: WS30 V2 Combat Commander$' .github/workflows/ws30-v2-combat-commander.yml
          grep -q '^  contents: read$' .github/workflows/ws30-v2-combat-commander.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ws30-v2-combat-commander.yml research/greenfield-qualification/actual-card-behavior/ws30/WS30_WITNESSES.jsonl research/greenfield-qualification/actual-card-behavior/ws30/WS30_PATH_COVERAGE.json research/greenfield-qualification/actual-card-behavior/ws30/WS30_COMBAT_INVENTORY.json research/greenfield-qualification/actual-card-behavior/ws30/WS30_COMMANDER_INVENTORY.json research/greenfield-qualification/actual-card-behavior/ws30/WS30_RULES_ADJUDICATION.json research/greenfield-qualification/actual-card-behavior/ws30/WS30_GATE.json research/greenfield-qualification/actual-card-behavior/ws30/WS30_HASHES.sha256 research/greenfield-qualification/WS30_HANDOFF.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "WS30: commit qualified combat commander evidence"
          final_sha=$(git rev-parse HEAD)
          final_tree=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:${BRANCH}"
          remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          test "$remote_sha" = "$final_sha"
          echo "FINAL_EVIDENCE_HEAD=$final_sha"
          echo "FINAL_EVIDENCE_TREE=$final_tree"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ws30-v2-combat-commander.yml/dispatches" -f ref="$BRANCH"
