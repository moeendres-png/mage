name: WS30 V2 Combat Commander

on:
  workflow_dispatch:
  push:
    branches:
      - work/ws30-v2-combat-commander-20260830
    paths:
      - '.github/workflows/ws30-v2-combat-commander.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws30/**'
      - 'research/greenfield-qualification/WS30_HANDOFF.md'

permissions:
  contents: read

jobs:
  combat-commander:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WS26_HEAD: 206a39cbaa3eeb98b10c2ddc36d51fe5b1b2f5ef
      WS26_TREE: 837f445f78bb26462653c58baf1532e294151b10
      WS26_RUN_ID: '33283478862'
      WS26_JOB_ID: '99182488884'
      WS26_ARTIFACT_ID: '9723722686'
      WS26_ARTIFACT_DIGEST: sha256:b9e1fc4fd792b0baa1da1c17e3bbc9e01b2557d4b73b8590e680679f53b59883
      FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
      WS30_TRACE_PATH: ${{ github.workspace }}/artifacts/ws30/raw-trace.jsonl
    steps:
      - name: Checkout WS30 qualification branch
        uses: actions/checkout@v4
        with:
          path: qualification
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows/ws30-v2-combat-commander.yml
            research/greenfield-qualification/actual-card-behavior/ws30
            research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json
            research/greenfield-qualification/WS30_HANDOFF.md

      - name: Verify exact WS26 source boundary and ownership
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cd qualification
          test "$(git rev-parse "$WS26_HEAD^{tree}")" = "$WS26_TREE"
          git merge-base --is-ancestor "$WS26_HEAD" HEAD
          base_owner=$(mktemp)
          git show "$WS26_HEAD:research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json" > "$base_owner"
          cmp "$base_owner" research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json")
          obj=json.loads(p.read_text())
          fam=obj["families"]["COMBAT_COMMANDER"]
          assert fam["path_count"] == 27
          assert len(fam["v2_path_ids"]) == 27 == len(set(fam["v2_path_ids"]))
          PY
          changed=$(git diff --name-only "$WS26_HEAD"...HEAD)
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              .github/workflows/ws30-v2-combat-commander.yml) ;;
              research/greenfield-qualification/actual-card-behavior/ws30/*) ;;
              research/greenfield-qualification/WS30_HANDOFF.md) ;;
              *) echo "Out-of-scope WS30 change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: forge/pom.xml

      - name: Checkout exact pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1

      - name: Verify Forge pin and inject qualification-only overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          src=qualification/research/greenfield-qualification/actual-card-behavior/ws30/forge-overlay/Ws30CombatCommanderWitnessTest.java
          test -f "$src"
          mkdir -p forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests
          cp "$src" forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/
          mkdir -p artifacts/ws30 artifacts/ws30-replay
          : > "$WS30_TRACE_PATH"

      - name: Run exactly the WS30 Forge witness test
        id: tests
        shell: bash
        run: |
          set +e
          cd forge
          xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.gamesimulationtests.Ws30CombatCommanderWitnessTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false test \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/ws30/ws30-maven.log"
          rc=${PIPESTATUS[0]}
          if [ -d forge-gui-desktop/target/surefire-reports ]; then
            cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/artifacts/ws30/surefire-reports"
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Materialize exact 27-path evidence
        id: materialize
        shell: bash
        run: |
          set +e
          python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_materialize.py \
            --owner-partitions qualification/research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json \
            --trace "$WS30_TRACE_PATH" --out-dir artifacts/ws30
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce WS30 hard gate
        id: gate
        shell: bash
        run: |
          set +e
          python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_gate.py \
            --dir artifacts/ws30 \
            --java-source qualification/research/greenfield-qualification/actual-card-behavior/ws30/forge-overlay/Ws30CombatCommanderWitnessTest.java \
            2>&1 | tee artifacts/ws30/ws30-gate.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Semantic replay run
        id: replay
        if: ${{ steps.tests.outputs.exit_code == '0' && steps.materialize.outputs.exit_code == '0' && steps.gate.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set +e
          export WS30_TRACE_PATH="$GITHUB_WORKSPACE/artifacts/ws30-replay/raw-trace.jsonl"
          : > "$WS30_TRACE_PATH"
          cd forge
          xvfb-run -a mvn -B -pl forge-gui-desktop \
            -Dtest=forge.gamesimulationtests.Ws30CombatCommanderWitnessTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false test \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/ws30-replay/ws30-maven.log"
          rc=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"
          if [ "$rc" = 0 ]; then
            python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_materialize.py \
              --owner-partitions qualification/research/greenfield-qualification/actual-card-behavior/ws26/WS26_OWNER_PARTITIONS.json \
              --trace "$WS30_TRACE_PATH" --out-dir artifacts/ws30-replay
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            for f in WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json; do
              cmp "artifacts/ws30/$f" "artifacts/ws30-replay/$f" || rc=1
            done
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate hashes and execution metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/ws30/WS30_GATE.json ]; then
            (cd artifacts/ws30 && sha256sum WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json WS30_GATE.json > WS30_HASHES.sha256)
          fi
          cat > artifacts/ws30/WS30_EXECUTION.json <<EOF
          {
            "qualification_head": "${{ steps.source.outputs.head }}",
            "qualification_tree": "${{ steps.source.outputs.tree }}",
            "ws26_final_head": "$WS26_HEAD",
            "ws26_final_tree": "$WS26_TREE",
            "ws26_run_id": "$WS26_RUN_ID",
            "ws26_job_id": "$WS26_JOB_ID",
            "ws26_artifact_id": "$WS26_ARTIFACT_ID",
            "ws26_artifact_digest": "$WS26_ARTIFACT_DIGEST",
            "forge_pin": "$FORGE_PIN",
            "test_exit_code": ${{ steps.tests.outputs.exit_code || '999' }},
            "materialize_exit_code": ${{ steps.materialize.outputs.exit_code || '999' }},
            "gate_exit_code": ${{ steps.gate.outputs.exit_code || '999' }},
            "replay_exit_code": ${{ steps.replay.outputs.exit_code || '999' }},
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "global_q5_rerun": false,
            "global_q6_claim": false
          }
          EOF

      - name: Print hard-gate evidence
        if: always()
        shell: bash
        run: |
          set +e
          for f in WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json WS30_GATE.json WS30_HASHES.sha256 WS30_EXECUTION.json; do
            echo "=== $f ==="; cat "artifacts/ws30/$f" 2>/dev/null || true
          done

      - name: Upload WS30 immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws30-v2-combat-commander-${{ github.run_id }}
          path: |
            artifacts/ws30
            artifacts/ws30-replay
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final WS30 family gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.tests.outputs.exit_code || '999' }}" = "0"
          test "${{ steps.materialize.outputs.exit_code || '999' }}" = "0"
          test "${{ steps.gate.outputs.exit_code || '999' }}" = "0"
          test "${{ steps.replay.outputs.exit_code || '999' }}" = "0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("artifacts/ws30/WS30_GATE.json").read_text())
          assert g["combat_legality_from_rules_core"] is True
          assert g["manual_combat_legality_in_harness"] == 0
          assert g["combat_state_assertions_complete"] is True
          assert g["commander_specific_paths_rules_validated"] is True
          assert g["actual_card_pass_count"] == 27
          assert g["WS30_FAMILY_GATE"] == "PASS"
          assert g["WORKSTREAM_COMPLETE"] is True
          assert g["global_q6_claim"] is False
          PY
