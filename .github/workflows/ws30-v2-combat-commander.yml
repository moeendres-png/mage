name: WS30 V2 Combat Commander

on:
  workflow_dispatch:
  push:
    branches: [work/ws30-v2-combat-commander-20260830]
    paths:
      - '.github/workflows/ws30-v2-combat-commander.yml'
      - 'research/greenfield-qualification/actual-card-behavior/ws30/**'
      - 'research/greenfield-qualification/WS30_HANDOFF.md'

permissions:
  contents: read
  actions: read

jobs:
  combat-commander:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WS26_HEAD: 206a39cbaa3eeb98b10c2ddc36d51fe5b1b2f5ef
      WS26_TREE: 837f445f78bb26462653c58baf1532e294151b10
      WS26_RUN_ID: '33283478862'
      WS26_JOB_ID: '99182488884'
      WS26_ARTIFACT_ID: '9723722686'
      WS26_ARTIFACT_DIGEST: sha256:b9e1fc4fd792b0baa1da1c17e3bbc9e01b2557d4b73b8590e680679f53b59883
      FORGE_PIN: 8c7e9afb8e6caee88644b94e25da5852e36f8928
      WS30_TRACE_PATH: ${{ github.workspace }}/artifacts/ws30/raw-trace.jsonl
    steps:
      - name: Checkout WS30 qualification branch
        uses: actions/checkout@v4
        with:
          path: qualification
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows/ws30-v2-combat-commander.yml
            research/greenfield-qualification/actual-card-behavior/ws30
            research/greenfield-qualification/WS30_HANDOFF.md

      - name: Verify exact WS26 source and artifact boundary
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ws30" "$GITHUB_WORKSPACE/artifacts/ws30-replay" "$GITHUB_WORKSPACE/predecessor/ws26"
          cd qualification
          test "$(git rev-parse "$WS26_HEAD^{tree}")" = "$WS26_TREE"
          git merge-base --is-ancestor "$WS26_HEAD" HEAD
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${WS26_ARTIFACT_ID}")
          test "$(jq -r '.id' <<< "$meta")" = "$WS26_ARTIFACT_ID"
          test "$(jq -r '.name' <<< "$meta")" = "ws26-runtime-behavior-binding-v2"
          test "$(jq -r '.digest' <<< "$meta")" = "$WS26_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<< "$meta")" = "$WS26_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<< "$meta")" = "$WS26_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${WS26_ARTIFACT_ID}/zip" > "$GITHUB_WORKSPACE/predecessor/ws26.zip"
          unzip -q "$GITHUB_WORKSPACE/predecessor/ws26.zip" -d "$GITHUB_WORKSPACE/predecessor/ws26"
          owner=$(find "$GITHUB_WORKSPACE/predecessor/ws26" -name WS26_OWNER_PARTITIONS.json -type f -print -quit)
          test -n "$owner"
          python3 - "$owner" <<'PY'
          import json,sys
          from pathlib import Path
          fam=json.loads(Path(sys.argv[1]).read_text())["families"]["COMBAT_COMMANDER"]
          assert fam["path_count"] == 27
          assert len(fam["v2_path_ids"]) == 27 == len(set(fam["v2_path_ids"]))
          PY
          changed=$(git diff --name-only "$WS26_HEAD"...HEAD)
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              .github/workflows/ws30-v2-combat-commander.yml|research/greenfield-qualification/actual-card-behavior/ws30/*|research/greenfield-qualification/WS30_HANDOFF.md) ;;
              *) echo "Out-of-scope WS30 change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "owner_partitions=$owner" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Checkout exact pinned Forge
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ env.FORGE_PIN }}
          path: forge
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Forge pin and inject qualification-only overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C forge rev-parse HEAD)" = "$FORGE_PIN"
          src=qualification/research/greenfield-qualification/actual-card-behavior/ws30/forge-overlay/Ws30CombatCommanderWitnessTest.java
          dst=forge/forge-gui-desktop/src/test/java/forge/gamesimulationtests/Ws30CombatCommanderWitnessTest.java
          test -f "$src"
          mkdir -p "$(dirname "$dst")"
          cp "$src" "$dst"
          python3 - "$dst" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace('import forge.game.card.CardCollectionView;\n','')
          s=s.replace('import forge.game.player.IGameEntitiesFactory;\n', 'import forge.game.player.DelayedReveal;\nimport forge.game.player.IGameEntitiesFactory;\n')
          s=s.replace('import forge.util.Localizer;\n', 'import forge.util.Localizer;\nimport forge.util.collect.FCollectionView;\n')
          controller_ctor='        Ws30Controller(Game game, Player player, LobbyPlayer lobbyPlayer) { super(game, player, lobbyPlayer); }\n'
          controller_choice='''        private GameEntity expectedEntityChoice;\n        Ws30Controller(Game game, Player player, LobbyPlayer lobbyPlayer) { super(game, player, lobbyPlayer); }\n        void expectEntityChoice(GameEntity entity) {\n            if (expectedEntityChoice != null) throw new IllegalStateException("unconsumed expected entity choice");\n            expectedEntityChoice = entity;\n        }\n        @Override public <T extends GameEntity> T chooseSingleEntityForEffect(FCollectionView<T> optionList, DelayedReveal delayedReveal, SpellAbility sa, String title, boolean isOptional, Player relatedPlayer, Map<String,Object> params) {\n            System.out.println("WS30_ENTITY_CHOICE title="+title+" options="+optionList.size()+" expected="+expectedEntityChoice);\n            if (delayedReveal != null) reveal(delayedReveal);\n            GameEntity expected = expectedEntityChoice;\n            if (expected == null) throw new IllegalStateException("unexpected discretionary entity choice: " + title);\n            expectedEntityChoice = null;\n            for (T option : optionList) if (option.equals(expected)) return option;\n            throw new IllegalStateException("expected entity is not Forge-legal: " + expected + " options=" + optionList);\n        }\n'''
          assert controller_ctor in s
          s=s.replace(controller_ctor,controller_choice,1)
          old='        controller.getZone(ZoneType.Battlefield).add(card); f.game.getTriggerHandler().registerActiveTrigger(card,false); return card;\n'
          new='        f.game.getAction().changeZone(null,controller.getZone(ZoneType.Battlefield),card,null,null); return card;\n'
          assert old in s
          s=s.replace(old,new,1)
          force='''    private void forceAttack(Fixture f,Player p,Card creature) {\n        Card aura=putPermanent(f,p,p,"Furor of the Bitten"); aura.attachToEntity(creature,null,true); creature.setSickness(false);\n    }\n'''
          aura_helper='''    private Card putPermanentMaybeAura(Fixture f, Player owner, Player controller, String name, Card target) {\n        Card card=Card.fromPaperCard(paper(name),owner); card.setController(controller,0);\n        System.out.println("WS30_CARD_FACTORY name="+name+" paperType="+paper(name).getRules().getType()+" runtimeType="+card.getType()+" state="+card.getCurrentStateName()+" aura="+card.isAura());\n        if (!card.isAura()) return putPermanent(f,owner,controller,name);\n        Assert.assertTrue(card.hasKeyword(forge.game.keyword.Keyword.ENCHANT), "Aura lacks Forge ENCHANT keyword: "+name);\n        Assert.assertNotNull(card.getCurrentState().getAuraSpell(), "Aura lacks Forge AuraSpell: "+name);\n        f.game.copyLastState();\n        boolean lkiLegal=f.game.getLastStateBattlefield().anyMatch(forge.game.card.CardPredicates.canBeAttached(card,null));\n        boolean currentLegal=f.game.getCardsIn(ZoneType.Battlefield).anyMatch(forge.game.card.CardPredicates.canBeAttached(card,null));\n        System.out.println("WS30_AURA_PRE name="+name+" lastBF="+f.game.getLastStateBattlefield().size()+" currentBF="+f.game.getCardsIn(ZoneType.Battlefield).size()+" lkiLegal="+lkiLegal+" currentLegal="+currentLegal+" controller="+card.getController());\n        Assert.assertTrue(lkiLegal, "No Forge-legal LKI Aura attachment for "+name);\n        Assert.assertTrue(currentLegal, "No Forge-legal current Aura attachment for "+name);\n        ((Ws30Controller)controller.getController()).expectEntityChoice(target);\n        controller.getZone(ZoneType.Hand).add(card);\n        Card entered=f.game.getAction().changeZone(controller.getZone(ZoneType.Hand),controller.getZone(ZoneType.Battlefield),card,null,null);\n        Assert.assertNotNull(entered); Assert.assertTrue(entered.isAura()); Assert.assertEquals(entered.getEntityAttachedTo(),target);\n        f.game.getAction().checkStateEffects(true);\n        Assert.assertTrue(entered.isInPlay()); Assert.assertEquals(entered.getEntityAttachedTo(),target);\n        return entered;\n    }\n    private void forceAttack(Fixture f,Player p,Card creature) {\n        Card aura=putPermanentMaybeAura(f,p,p,"Furor of the Bitten",creature);\n        Assert.assertTrue(aura.isAura(), "Force-attack card lost Aura type: runtimeType="+aura.getType()+" paperType="+paper("Furor of the Bitten").getRules().getType()+" state="+aura.getCurrentStateName());\n        Assert.assertEquals(aura.getEntityAttachedTo(),creature); creature.setSickness(false);\n    }\n'''
          assert force in s
          s=s.replace(force,aura_helper,1)
          sca='Card source=putPermanent(f,p1,p1,sourceName); if(source.isAura()) source.attachToEntity(attacker,null,true);'
          assert sca in s
          s=s.replace(sca,'Card source=putPermanentMaybeAura(f,p1,p1,sourceName,attacker);',1)
          marker='    private Pair<Map<Card,GameEntity>,Integer> legal(Combat c){return c.getAttackConstraints().getLegalAttackers();}\n'
          helper='''    private Combat beginCombat(Fixture f, Player attacker) {\n        f.game.getPhaseHandler().devModeSet(PhaseType.MAIN1, attacker);\n        f.game.getAction().checkStateEffects(true);\n        Assert.assertTrue(f.game.getPhaseHandler().devAdvanceToPhase(PhaseType.COMBAT_BEGIN));\n        Combat combat=f.game.getPhaseHandler().getCombat();\n        Assert.assertNotNull(combat);\n        return combat;\n    }\n'''
          assert marker in s
          s=s.replace(marker, helper + marker, 1)
          count=s.count('new Combat(p0)')
          assert count >= 1
          s=s.replace('new Combat(p0)', 'beginCombat(f,p0)')
          assert 'new Combat(p0)' not in s
          first='Combat c=beginCombat(f,p0); var e=legal(c); Assert.assertTrue(e.getLeft().containsKey(bear));'
          diag='''Combat c=beginCombat(f,p0); var e=legal(c);\n            boolean requirementEntry=c.getAttackConstraints().getRequirements().containsKey(bear);\n            boolean hasRequirement=requirementEntry && c.getAttackConstraints().getRequirements().get(bear).hasRequirement();\n            System.out.println("WS30_DIAG opponents="+p0.getOpponents().size()+" canAttack="+CombatUtil.canAttack(bear)+" sick="+bear.isSick()+" power="+bear.getNetPower()+" requirementEntry="+requirementEntry+" hasRequirement="+hasRequirement+" restrictions="+restrictionsRequirements(c)+" legal="+stableAttackMap(e.getLeft()));\n            Assert.assertTrue(e.getLeft().containsKey(bear));'''
          assert first in s
          s=s.replace(first,diag,1)
          p.write_text(s)
          print(f'PhaseHandler-bound combat substitutions={count}; instrumented Aura preconditions and Forge-filtered entity choice')
          PY
          : > "$WS30_TRACE_PATH"

      - name: Run exactly the WS30 Forge witness test
        id: tests
        shell: bash
        run: |
          set +e
          cd forge
          xvfb-run -a mvn -B -pl forge-gui-desktop -am \
            -Dtest=forge.gamesimulationtests.Ws30CombatCommanderWitnessTest \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/ws30/ws30-maven.log"
          rc=${PIPESTATUS[0]}
          test ! -d forge-gui-desktop/target/surefire-reports || cp -R forge-gui-desktop/target/surefire-reports "$GITHUB_WORKSPACE/artifacts/ws30/"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Materialize exact 27-path evidence
        id: materialize
        shell: bash
        run: |
          set +e
          python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_materialize.py \
            --owner-partitions "${{ steps.source.outputs.owner_partitions }}" --trace "$WS30_TRACE_PATH" --out-dir artifacts/ws30
          rc=$?; echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Enforce WS30 hard gate
        id: gate
        shell: bash
        run: |
          set +e
          python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_gate.py \
            --dir artifacts/ws30 \
            --java-source qualification/research/greenfield-qualification/actual-card-behavior/ws30/forge-overlay/Ws30CombatCommanderWitnessTest.java \
            2>&1 | tee artifacts/ws30/ws30-gate.log
          rc=${PIPESTATUS[0]}; echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Semantic replay run
        id: replay
        if: ${{ steps.tests.outputs.exit_code == '0' && steps.materialize.outputs.exit_code == '0' && steps.gate.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set +e
          export WS30_TRACE_PATH="$GITHUB_WORKSPACE/artifacts/ws30-replay/raw-trace.jsonl"
          : > "$WS30_TRACE_PATH"
          cd forge
          xvfb-run -a mvn -B -pl forge-gui-desktop \
            -Dtest=forge.gamesimulationtests.Ws30CombatCommanderWitnessTest \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false test \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/ws30-replay/ws30-maven.log"
          rc=${PIPESTATUS[0]}; cd "$GITHUB_WORKSPACE"
          if [ "$rc" = 0 ]; then
            python3 qualification/research/greenfield-qualification/actual-card-behavior/ws30/ws30_materialize.py \
              --owner-partitions "${{ steps.source.outputs.owner_partitions }}" --trace "$WS30_TRACE_PATH" --out-dir artifacts/ws30-replay
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            for f in WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json; do
              cmp "artifacts/ws30/$f" "artifacts/ws30-replay/$f" || rc=1
            done
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Generate hashes and execution metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws30
          if [ -f artifacts/ws30/WS30_GATE.json ]; then
            (cd artifacts/ws30 && sha256sum WS30_WITNESSES.jsonl WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json WS30_GATE.json > WS30_HASHES.sha256)
          fi
          cat > artifacts/ws30/WS30_EXECUTION.json <<EOF
          {"qualification_head":"${{ steps.source.outputs.head }}","qualification_tree":"${{ steps.source.outputs.tree }}","ws26_final_head":"$WS26_HEAD","ws26_final_tree":"$WS26_TREE","ws26_run_id":"$WS26_RUN_ID","ws26_job_id":"$WS26_JOB_ID","ws26_artifact_id":"$WS26_ARTIFACT_ID","ws26_artifact_digest":"$WS26_ARTIFACT_DIGEST","forge_pin":"$FORGE_PIN","test_exit_code":${{ steps.tests.outputs.exit_code || '999' }},"materialize_exit_code":${{ steps.materialize.outputs.exit_code || '999' }},"gate_exit_code":${{ steps.gate.outputs.exit_code || '999' }},"replay_exit_code":${{ steps.replay.outputs.exit_code || '999' }},"workflow_run_id":"${{ github.run_id }}","workflow_run_attempt":"${{ github.run_attempt }}","global_q5_rerun":false,"global_q6_claim":false}
          EOF

      - name: Print hard-gate evidence
        if: always()
        shell: bash
        run: |
          set +e
          for f in WS30_PATH_COVERAGE.json WS30_COMBAT_INVENTORY.json WS30_COMMANDER_INVENTORY.json WS30_RULES_ADJUDICATION.json WS30_GATE.json WS30_HASHES.sha256 WS30_EXECUTION.json; do echo "=== $f ==="; cat "artifacts/ws30/$f" 2>/dev/null || true; done

      - name: Upload WS30 immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws30-v2-combat-commander-${{ github.run_id }}
          path: |
            artifacts/ws30
            artifacts/ws30-replay
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final WS30 family gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.tests.outputs.exit_code || '999' }}" = 0
          test "${{ steps.materialize.outputs.exit_code || '999' }}" = 0
          test "${{ steps.gate.outputs.exit_code || '999' }}" = 0
          test "${{ steps.replay.outputs.exit_code || '999' }}" = 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('artifacts/ws30/WS30_GATE.json').read_text())
          assert g['combat_legality_from_rules_core'] is True
          assert g['manual_combat_legality_in_harness'] == 0
          assert g['combat_state_assertions_complete'] is True
          assert g['commander_specific_paths_rules_validated'] is True
          assert g['actual_card_pass_count'] == 27
          assert g['WS30_FAMILY_GATE'] == 'PASS'
          assert g['WORKSTREAM_COMPLETE'] is True
          assert g['global_q6_claim'] is False
          PY