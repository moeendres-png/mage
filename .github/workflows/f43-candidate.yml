name: F-43 candidate qualification

on:
  push:
    branches:
      - "sol/f43-combat-damage-leaver-20260930"

concurrency:
  group: f43-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: F-43 targeted native regression
        run: >
          mvn test -B
          -Dxmage.dataCollectors.printGameLogs=false
          -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties
          -Dtest=CombatDamageLeaver4PTest,CombatDamageLeaver5PTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Complete Mage tests after targeted regression is green
        run: >
          mvn test -B
          -Dxmage.dataCollectors.printGameLogs=false
          -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties
